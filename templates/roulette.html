<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIP Roulette Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --dark: #050505; --red: #e74c3c; --black: #2c3e50; --green: #27ae60; }
        body {
            background: radial-gradient(circle, #1a1a1a, #000);
            color: white; font-family: 'Rajdhani', sans-serif;
            text-align: center; margin: 0; min-height: 100vh; user-select: none;
            overflow-x: hidden;
        }

        h1 { color: var(--gold); text-shadow: 0 0 15px var(--gold); font-size: 3rem; margin-top: 20px; }
        
        /* --- 🎡 WHEEL UI --- */
        .wheel-container {
            position: relative; width: 300px; height: 300px; margin: 20px auto;
            border: 8px solid var(--gold); border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            background: #222; overflow: hidden;
        }
        
        .wheel {
            width: 100%; height: 100%;
            background: conic-gradient(
                #27ae60 0deg 9.7deg, 
                #e74c3c 9.7deg 19.4deg, #2c3e50 19.4deg 29.1deg, 
                #e74c3c 29.1deg 38.8deg, #2c3e50 38.8deg 48.5deg,
                #e74c3c 48.5deg 58.2deg, #2c3e50 58.2deg 67.9deg,
                #e74c3c 67.9deg 77.6deg, #2c3e50 77.6deg 87.3deg,
                #e74c3c 87.3deg 97.0deg, #2c3e50 97.0deg 106.7deg,
                #e74c3c 106.7deg 116.4deg, #2c3e50 116.4deg 126.1deg,
                #e74c3c 126.1deg 135.8deg, #2c3e50 135.8deg 145.5deg,
                #e74c3c 145.5deg 155.2deg, #2c3e50 155.2deg 164.9deg,
                #e74c3c 164.9deg 174.6deg, #2c3e50 174.6deg 184.3deg,
                #e74c3c 184.3deg 194.0deg, #2c3e50 194.0deg 203.7deg,
                #e74c3c 203.7deg 213.4deg, #2c3e50 213.4deg 223.1deg,
                #e74c3c 223.1deg 232.8deg, #2c3e50 232.8deg 242.5deg,
                #e74c3c 242.5deg 252.2deg, #2c3e50 252.2deg 261.9deg,
                #e74c3c 261.9deg 271.6deg, #2c3e50 271.6deg 281.3deg,
                #e74c3c 281.3deg 291.0deg, #2c3e50 291.0deg 300.7deg,
                #e74c3c 300.7deg 310.4deg, #2c3e50 310.4deg 320.1deg,
                #e74c3c 320.1deg 329.8deg, #2c3e50 329.8deg 339.5deg,
                #e74c3c 339.5deg 349.2deg, #2c3e50 349.2deg 360deg
            );
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        
        .marker {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 10px solid transparent;
            border-right: 10px solid transparent; border-top: 20px solid var(--gold);
            z-index: 10; filter: drop-shadow(0 0 5px var(--gold));
        }

        .center-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: #000; border: 4px solid var(--gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: bold; z-index: 5;
        }

        /* --- 💸 BETTING BOARD --- */
        .controls { margin-bottom: 20px; }
        input.bet-input {
            padding: 10px; border-radius: 5px; background: #111; color: var(--gold);
            border: 1px solid var(--gold); text-align: center; font-family: 'Rajdhani';
            font-size: 1.2rem; font-weight: bold; width: 150px;
        }

        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
            max-width: 400px; margin: 0 auto 50px auto; padding: 10px;
            background: #111; border: 2px solid #333; border-radius: 10px;
        }

        .board-btn {
            padding: 15px; border: none; border-radius: 4px; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; color: white; transition: 0.2s;
            position: relative;
        }
        .board-btn:hover { transform: scale(1.05); filter: brightness(1.2); }
        
        .num-red { background: var(--red); }
        .num-black { background: var(--black); }
        .num-green { background: var(--green); grid-column: span 3; }
        
        .btn-red-bet { background: var(--red); grid-column: span 1.5; font-size: 1.2rem;}
        .btn-black-bet { background: var(--black); grid-column: span 1.5; font-size: 1.2rem;}

        .selected { border: 3px solid var(--gold); box-shadow: 0 0 15px var(--gold); transform: scale(0.95); }

        .spin-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 50px; font-size: 1.5rem; background: var(--gold); color: black;
            border: none; border-radius: 50px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); z-index: 100;
        }
        .spin-btn:disabled { background: #555; cursor: not-allowed; }

        .stats { font-size: 1.2rem; margin-bottom: 15px; }
        .win-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); border: 2px solid var(--gold);
            padding: 40px; z-index: 200; display: none; border-radius: 20px;
            box-shadow: 0 0 50px var(--gold);
        }
    </style>
</head>
<body>

    <audio id="spinSound" src="https://www.soundjay.com/mechanical/sounds/ratchet-wheel-01.mp3"></audio>
    <audio id="winSound" src="https://www.soundjay.com/misc/sounds/coins-in-hand-2.mp3"></audio>

    <h1>💎 VIP ROULETTE</h1>
    <div class="stats">
        Balance: <span style="color:var(--green)">$<span id="balance">{{ "{:,.0f}".format(user.balance) }}</span></span>
    </div>

    <div class="wheel-container">
        <div class="marker"></div>
        <div class="wheel" id="wheel"></div>
        <div class="center-dot" id="result-num">?</div>
    </div>

    <div class="controls">
        <input type="number" id="betAmount" class="bet-input" placeholder="Bet Amount ($)" value="1000">
        <div style="color:#666; font-size:0.8rem; margin-top:5px;">Select Number (36x) or Color (4x/2x)</div>
    </div>

    <div class="board">
        <button class="board-btn num-green" onclick="selectBet('number', '0', this)">0</button>

        <script>
            const redNums = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
            for(let i=1; i<=36; i++) {
                let colorClass = redNums.includes(i) ? 'num-red' : 'num-black';
                document.write(`<button class="board-btn ${colorClass}" onclick="selectBet('number', '${i}', this)">${i}</button>`);
            }
        </script>
        
        <button class="board-btn btn-red-bet" onclick="selectBet('color', 'red', this)">RED (4x)</button>
        <button class="board-btn btn-black-bet" onclick="selectBet('color', 'black', this)">BLACK (2x)</button>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN NOW</button>

    <div class="win-popup" id="winPopup">
        <h1 id="winTitle" style="margin:0">JACKPOT!</h1>
        <p id="winMsg" style="font-size:1.5rem; color:white;">You won $5,000</p>
        <button onclick="closePopup()" style="background:var(--gold); border:none; padding:10px 20px; font-weight:bold; cursor:pointer; margin-top:20px;">CLAIM</button>
    </div>

    <script>
        let selectedType = null;
        let selectedValue = null;
        const uid = "{{ user.id }}";
        let currentRotation = 0;

        function selectBet(type, value, btn) {
            document.querySelectorAll('.board-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedType = type;
            selectedValue = value;
            new Audio('https://www.soundjay.com/button/sounds/button-3.mp3').play().catch(e=>{});
        }

        async function spin() {
            const amount = document.getElementById('betAmount').value;

            if (!selectedType || !amount) {
                alert("⚠️ Pehle Bet select karo aur Amount daalo!");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.innerText = "SPINNING...";

            const sound = document.getElementById('spinSound');
            sound.currentTime = 0;
            sound.loop = true;
            sound.play();

            try {
                // ✅ UPDATED API URL
                const res = await fetch('/api/spin_vip', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: uid, type: selectedType, value: selectedValue, amount: amount })
                });
                const data = await res.json();

                if (data.status === 'error') {
                    alert(data.msg);
                    sound.pause();
                    btn.disabled = false;
                    btn.innerText = "SPIN NOW";
                    return;
                }

                // Animation
                const extraSpins = 5 * 360; 
                const randomOffset = Math.floor(Math.random() * 360); 
                const totalDegree = currentRotation + extraSpins + randomOffset;
                
                const wheel = document.getElementById('wheel');
                wheel.style.transform = `rotate(${totalDegree}deg)`;
                currentRotation = totalDegree;

                setTimeout(() => {
                    sound.pause();
                    document.getElementById('result-num').innerText = data.landed_number;
                    
                    if (data.is_win) {
                        document.getElementById('winSound').play();
                        showPopup("WINNER!", `+ $${data.win_amount.toLocaleString()}`, data.message);
                    } else {
                        // Loss feedback
                    }

                    document.getElementById('balance').innerText = data.new_balance.toLocaleString();
                    btn.disabled = false;
                    btn.innerText = "SPIN AGAIN";

                }, 4000);

            } catch (err) {
                console.error(err);
                sound.pause();
                btn.disabled = false;
                alert("Server Error");
            }
        }

        function showPopup(title, amount, msg) {
            document.getElementById('winTitle').innerText = title;
            document.getElementById('winMsg').innerHTML = `${msg}<br><br><span style="color:var(--green); font-size:2rem;">${amount}</span>`;
            document.getElementById('winPopup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('winPopup').style.display = 'none';
        }
    </script>
</body>
</html>
