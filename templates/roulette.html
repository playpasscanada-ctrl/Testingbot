<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE VIP ROULETTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. ROOT & BASICS
           ========================================= */
        :root {
            --gold: #FFD700;
            --gold-dim: #D4AF37;
            --bg-dark: #0a0a0a;
            --panel-glass: rgba(20, 20, 20, 0.95);
            --neon-green: #00ff41;
            --shadow-rim: rgba(0,0,0,0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 80%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 100px; /* Space for footer */
        }

        /* Scanlines for Retro/Premium feel */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 2;
        }

        /* =========================================
           2. HEADER
           ========================================= */
        .header-bar {
            width: 92%; max-width: 500px;
            margin: 15px 0; padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #ccc; }
        .user-icon { color: var(--gold); font-size: 1.2rem; }
        .bal-display { font-size: 1.3rem; font-weight: 800; color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,0,0.3); }

        /* =========================================
           3. 3D WHEEL ENGINE (The Core Fix)
           ========================================= */
        .wheel-stage {
            position: relative;
            width: 340px; height: 340px; /* Fixed size for perfect alignment */
            margin: 20px 0;
        }

        /* The Outer Case */
        .wheel-outer {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #111;
            box-shadow: 
                0 0 0 8px #050505, /* Gap */
                0 0 0 12px var(--gold-dim), /* Gold Rim */
                0 20px 50px #000; /* Drop Shadow */
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* The Gold Inner Ring */
        .wheel-bezel {
            width: 320px; height: 320px;
            border-radius: 50%;
            background: conic-gradient(#FFD700, #AA771C, #FFD700, #AA771C, #FFD700);
            padding: 4px; /* Thickness of ring */
            box-shadow: inset 0 0 15px #000;
        }

        /* The Rotating Disc */
        .wheel-spinner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            /* Transition for spin */
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1.0);
            will-change: transform;
        }

        /* Number Container (Crucial Fix) */
        .number-spoke {
            position: absolute;
            left: 50%; bottom: 50%; /* Pivot from center */
            width: 24px; height: 145px; /* Height = Radius roughly */
            transform-origin: bottom center;
            pointer-events: none;
            display: flex; justify-content: center; align-items: flex-start; /* Text at top */
            z-index: 5;
        }

        .number-text {
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 0 #000, 0 0 2px #000;
            transform: translateY(12px); /* Push text slightly down into the color band */
        }

        /* Center Hub */
        .wheel-hub {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            border: 3px solid var(--gold);
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px #000;
        }
        .hub-num { font-size: 1.5rem; color: var(--gold); font-weight: 900; }

        /* The Pointer (Fixed Top) */
        .marker {
            position: absolute;
            top: -20px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--gold);
            filter: drop-shadow(0 4px 2px #000);
            z-index: 20;
        }

        /* =========================================
           4. CONTROLS AREA
           ========================================= */
        .control-panel {
            width: 95%; max-width: 500px;
            background: var(--panel-glass);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .bet-row {
            display: flex; gap: 10px; margin-bottom: 15px;
            background: #000; padding: 5px; border-radius: 8px; border: 1px solid #222;
        }
        .currency { padding: 10px; color: var(--gold); font-size: 1.2rem; font-weight: bold; }
        #betAmount {
            background: none; border: none; width: 100%; color: white;
            font-size: 1.2rem; font-weight: bold; outline: none;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        
        .c-btn {
            padding: 15px 0; font-family: 'Rajdhani', sans-serif;
            font-weight: 800; font-size: 1.1rem; color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .c-btn:active { transform: scale(0.96); box-shadow: 0 1px 0 rgba(0,0,0,0.5); }

        .bg-g { background: #27ae60; grid-column: span 3; }
        .bg-r { background: #c0392b; }
        .bg-b { background: #2c3e50; }

        /* Multipliers */
        .multi-row { display: flex; gap: 5px; margin-top: 10px; }
        .m-btn {
            flex: 1; padding: 15px; font-weight: 800; border: none;
            border-radius: 5px; cursor: pointer; color: white;
            text-transform: uppercase; font-size: 0.9rem;
        }
        .m-red { background: linear-gradient(135deg, #e74c3c, #922b21); box-shadow: 0 4px 0 #641e16; }
        .m-blk { background: linear-gradient(135deg, #34495e, #1c2833); box-shadow: 0 4px 0 #17202a; }

        .selected {
            border: 2px solid var(--gold);
            transform: translateY(2px);
            box-shadow: none !important;
            filter: brightness(1.2);
        }

        /* =========================================
           5. FOOTER & POPUP
           ========================================= */
        .footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.95);
            padding: 15px; border-top: 1px solid #333;
            display: flex; justify-content: center; z-index: 100;
        }
        .spin-btn {
            width: 100%; max-width: 400px;
            padding: 16px; font-size: 1.5rem; font-weight: 900;
            background: var(--gold); border: none; border-radius: 50px;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            cursor: pointer; color: #000;
        }
        .spin-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        .win-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 200; display: none; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(8px);
        }
        .win-box {
            text-align: center; border: 4px solid var(--gold); padding: 40px;
            border-radius: 20px; background: #111;
            box-shadow: 0 0 60px var(--gold);
            transform: scale(0.8); opacity: 0; transition: 0.3s;
        }
        .win-overlay.show .win-box { transform: scale(1); opacity: 1; }
        .claim-btn {
            margin-top: 20px; padding: 12px 40px; background: var(--gold);
            border: none; border-radius: 30px; font-weight: bold; font-size: 1.2rem; cursor: pointer;
        }

    </style>
</head>
<body>

    <audio id="sfxSpin" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfxWin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="header-bar">
        <div class="user-info">
            <span class="user-icon">♛</span> {{ user.username }}
        </div>
        <div class="bal-display">$<span id="balance">{{ "{:,.0f}".format(balance) }}</span></div>
    </div>

    <div class="wheel-stage">
        <div class="marker"></div>
        <div class="wheel-outer">
            <div class="wheel-bezel">
                <div class="wheel-spinner" id="wheelSpinner">
                    </div>
            </div>
            <div class="wheel-hub">
                <div class="hub-num" id="centerDisplay">?</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="bet-row">
            <div class="currency">$</div>
            <input type="number" id="betInput" value="1000">
        </div>

        <div class="grid">
            <button class="c-btn bg-g" onclick="setBet('number', '0', this)">0</button>
            <script>
                // Euro Layout
                const nums = [3,6,9,12,15,18,21,24,27,30,33,36,2,5,8,11,14,17,20,23,26,29,32,35,1,4,7,10,13,16,19,22,25,28,31,34];
                const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
                nums.forEach(n => {
                    let cls = reds.includes(n) ? 'bg-r' : 'bg-b';
                    document.write(`<button class="c-btn ${cls}" onclick="setBet('number', '${n}', this)">${n}</button>`);
                });
            </script>
        </div>

        <div class="multi-row">
            <button class="m-btn m-red" onclick="setBet('color', 'red', this)">RED ($1M)</button>
            <button class="m-btn m-blk" onclick="setBet('color', 'black', this)">BLACK ($100K)</button>
        </div>
    </div>

    <div class="footer">
        <button class="spin-btn" id="spinBtn" onclick="doSpin()">SPIN</button>
    </div>

    <div class="win-overlay" id="winUI">
        <div class="win-box">
            <h1 style="color:var(--gold); margin:0; font-size:2.5rem;">BIG WIN!</h1>
            <h2 id="winAmt" style="color:var(--neon-green); font-size:3rem; margin:10px 0;">$0</h2>
            <div id="winTxt" style="color:#aaa;">Red 32</div>
            <button class="claim-btn" onclick="hideWin()">CLAIM</button>
        </div>
    </div>

    <script>
        // CONFIG
        const uid = "{{ user.id }}";
        // Wheel Order (Clockwise starting from 0)
        const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redSet = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        const sliceDeg = 360 / 37;
        
        let currentRotation = 0;
        let betType = null;
        let betVal = null;

        // --- INIT WHEEL ---
        const spinner = document.getElementById('wheelSpinner');
        
        // 1. Draw Gradient Background
        let grad = [];
        wheelOrder.forEach((n, i) => {
            let color = (n===0) ? '#27ae60' : (redSet.has(n) ? '#c0392b' : '#2c3e50');
            grad.push(`${color} ${i*sliceDeg}deg ${(i+1)*sliceDeg}deg`);
        });
        spinner.style.background = `conic-gradient(${grad.join(', ')})`;

        // 2. Place Numbers (Spoke Method)
        wheelOrder.forEach((n, i) => {
            let spoke = document.createElement('div');
            spoke.className = 'number-spoke';
            // Rotation: Center of the slice
            let angle = (i * sliceDeg) + (sliceDeg / 2);
            spoke.style.transform = `rotate(${angle}deg)`;
            
            let txt = document.createElement('div');
            txt.className = 'number-text';
            txt.innerText = n;
            // No counter-rotation needed as numbers usually orient with wheel in roulette
            
            spoke.appendChild(txt);
            spinner.appendChild(spoke);
        });

        // --- LOGIC ---
        function setBet(type, val, btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            betType = type;
            betVal = val;
            if(navigator.vibrate) navigator.vibrate(30);
        }

        async function doSpin() {
            const amtIn = document.getElementById('betInput');
            const btn = document.getElementById('spinBtn');
            const hub = document.getElementById('centerDisplay');
            
            if(!betType || amtIn.value <= 0) {
                alert("Place a valid bet!"); return;
            }

            btn.disabled = true; 
            btn.innerText = "ROLLING...";
            amtIn.disabled = true;
            document.getElementById('sfxSpin').play().catch(()=>{});

            try {
                // API Call
                const res = await fetch('/api/spin_roulette', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: uid, type: betType, value: betVal, amount: amtIn.value })
                });
                const data = await res.json();
                
                if(data.status === 'error') throw new Error(data.msg);

                // Calculate Rotation
                // Target index
                const targetIdx = wheelOrder.indexOf(data.landed_number);
                // The center angle of that slice
                const sliceCenterAngle = (targetIdx * sliceDeg) + (sliceDeg/2);
                
                // We want this angle to align with Top (0deg)
                // Current visual position is determined by rotation.
                // To align 'sliceCenterAngle' to 0, we rotate by -sliceCenterAngle.
                
                // Add spins for effect
                const spins = 5 * 360; 
                // Add noise (+/- 2 deg) for realism
                const noise = (Math.random() * 4) - 2;
                
                // Calculate absolute target rotation (always negative/clockwise)
                // We add to currentRotation to ensure smooth continuous spin
                const targetRotation = -(sliceCenterAngle + spins + noise);
                
                // Math fix for continuous rotation:
                // We need to land on (targetRotation % 360) visually.
                // Current is 'currentRotation'.
                // Let's just set the style. CSS transition handles the interpolation.
                // But we must ensure we go lower (more negative) than current.
                
                // Normalize current to 0-360 relative? No.
                // Just subtract the diff.
                
                // Current visual angle mod 360
                let currentMod = currentRotation % 360;
                // Target visual angle
                let targetMod = -sliceCenterAngle;
                
                // Diff to travel
                let diff = targetMod - currentMod;
                // Force negative direction (clockwise)
                if(diff > 0) diff -= 360;
                
                // Add extra spins
                diff -= (360 * 5);
                
                // Update Global
                currentRotation += diff;
                
                spinner.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    document.getElementById('sfxSpin').pause();
                    hub.innerText = data.landed_number;
                    
                    if(data.is_win) {
                        document.getElementById('sfxWin').play();
                        showWin(data.message, data.win_amount);
                        if(navigator.vibrate) navigator.vibrate(200);
                    }
                    
                    document.getElementById('balance').innerText = data.new_balance.toLocaleString();
                    btn.disabled = false;
                    btn.innerText = "SPIN";
                    amtIn.disabled = false;
                    
                }, 5000);

            } catch(e) {
                alert(e.message);
                btn.disabled = false;
                amtIn.disabled = false;
            }
        }

        function showWin(msg, amt) {
            const ui = document.getElementById('winUI');
            document.getElementById('winAmt').innerText = "+$" + amt.toLocaleString();
            document.getElementById('winTxt').innerText = msg;
            ui.style.display = 'flex';
            setTimeout(()=> ui.classList.add('show'), 10);
        }

        function hideWin() {
            const ui = document.getElementById('winUI');
            ui.classList.remove('show');
            setTimeout(()=> ui.style.display = 'none', 300);
        }

    </script>
</body>
</html>
