<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Roulette - Big Daddy Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;500&display=swap');

        body {
            background-color: #0d1117;
            background-image: radial-gradient(circle, #1a2c22 0%, #050f09 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            text-shadow: 0 0 10px #b8860b;
            margin-top: 20px;
            font-size: 2.5rem;
        }

        /* --- GAME CONTAINER --- */
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            padding: 20px;
        }

        /* --- WHEEL SECTION --- */
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px #000;
            border: 15px solid #4a2c0f; /* Wood Texture Color */
        }

        canvas#wheel {
            width: 100%;
            height: 100%;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffd700;
            z-index: 10;
            filter: drop-shadow(0 4px 2px black);
        }

        /* --- BETTING BOARD (European Layout) --- */
        .betting-board {
            background-color: #014421; /* Felt Green */
            border: 8px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            display: grid;
            grid-template-columns: 40px repeat(3, 60px);
            gap: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .bet-btn {
            height: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            font-family: 'Cinzel', serif;
        }

        .bet-btn:hover { filter: brightness(1.2); transform: scale(1.05); }
        .bet-btn.active { box-shadow: 0 0 10px 2px #ffd700; z-index: 5; transform: scale(1.1); }

        .red-num { background-color: #d81d28; }
        .black-num { background-color: #222; }
        .green-num { background-color: #08a308; grid-row: span 12; display: flex; align-items: center; }

        /* Special Bets */
        .special-bets {
            grid-column: 2 / span 3;
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .color-btn { flex: 1; height: 40px; border: 2px solid #ffd700; }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        input[type="number"] {
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #ffd700;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 5px;
        }

        button#spin-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #ffd700, #b8860b);
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-family: 'Cinzel', serif;
        }
        button#spin-btn:disabled { background: #555; cursor: not-allowed; }

        #result-display {
            font-size: 1.5rem;
            margin-top: 10px;
            min-height: 30px;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>PREMIUM ROULETTE</h1>
    <div id="balance-display">Wallet: $<span id="user-balance">Loading...</span></div>

    <div class="game-container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <div>
            <div class="betting-board" id="board">
                </div>
            
            <div class="special-bets">
                <button class="bet-btn color-btn" style="background: #d81d28;" onclick="selectBet('red')">RED (x4)</button>
                <button class="bet-btn color-btn" style="background: #222;" onclick="selectBet('black')">BLACK (x2)</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <div>
            <label>Selected Bet: <span id="selected-bet" style="color:#ffd700">None</span></label>
        </div>
        <input type="number" id="bet-amount" placeholder="Bet Amount" min="100">
        <button id="spin-btn" onclick="spinWheel()">SPIN WHEEL</button>
        <div id="result-display"></div>
    </div>

    <audio id="spinSound" src="https://www.soundjay.com/mechanical/sounds/ratchet-wheel-1.mp3"></audio>
    <audio id="winSound" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>

<script>
    // 1️⃣ YAHAN ADD KARO (URL se User ID nikalne ka code)
    const urlParams = new URLSearchParams(window.location.search);
    const userID = urlParams.get('uid'); // URL se ID lega

    // --- SETUP ---
    const wheelCanvas = document.getElementById('wheel');
    const ctx = wheelCanvas.getContext('2d');
    
    // European Roulette Order
    const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    
    let currentBetType = null;
    let currentBetValue = null;
    let isSpinning = false;

    // --- DRAW WHEEL ---
    function drawWheel() {
        const arc = (2 * Math.PI) / numbers.length;
        const radius = wheelCanvas.width / 2;

        ctx.translate(radius, radius);
        
        for (let i = 0; i < numbers.length; i++) {
            const angle = i * arc;
            const num = numbers[i];
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, angle, angle + arc);
            
            if (num === 0) ctx.fillStyle = "#08a308";
            else if (redNumbers.includes(num)) ctx.fillStyle = "#d81d28";
            else ctx.fillStyle = "#111";
            
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px Arial";
            ctx.fillText(num, radius - 30, 5);
            ctx.restore();
        }
    }
    drawWheel();

    // --- GENERATE BOARD UI ---
    const board = document.getElementById('board');
    const zeroBtn = document.createElement('div');
    zeroBtn.className = 'bet-btn green-num';
    zeroBtn.innerText = '0';
    zeroBtn.onclick = () => selectBet('number', 0);
    board.appendChild(zeroBtn);

    for(let i=1; i<=36; i++) {
        const btn = document.createElement('div');
        btn.innerText = i;
        btn.className = `bet-btn ${redNumbers.includes(i) ? 'red-num' : 'black-num'}`;
        btn.onclick = () => selectBet('number', i);
        board.appendChild(btn);
    }

    // --- LOGIC ---
    function selectBet(type, value) {
        if(isSpinning) return;
        currentBetType = type; 
        currentBetValue = value; 
        
        document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
        if(type === 'number') {
            event.target.classList.add('active');
            document.getElementById('selected-bet').innerText = `Number ${value}`;
        } else {
            event.target.classList.add('active');
            document.getElementById('selected-bet').innerText = value.toUpperCase();
        }
    }

    async function spinWheel() {
        const amount = document.getElementById('bet-amount').value;
        if (!currentBetType || !amount || amount <= 0) return alert("Select a bet and enter amount!");
        
        // Check if User ID exists
        if (!userID) return alert("Error: User ID missing in URL! (Link should have ?uid=...)");

        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('result-display').innerText = "Rolling...";
        
        const audio = document.getElementById('spinSound');
        audio.currentTime = 0;
        audio.play();

        // 2️⃣ YAHAN CHANGE KIYA HAI (User ID pass ho rahi hai)
        const response = await fetch('/api/spin-roulette', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                user_id: userID, // <--- Ab ye URL wale ID ko backend bhejeg
                bet_type: currentBetType, 
                bet_value: currentBetValue, 
                amount: parseInt(amount) 
            })
        });
        const data = await response.json();
        
        if(data.error) {
            alert(data.error);
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            return;
        }

        const winningNumber = data.result_number;
        const winningIndex = numbers.indexOf(winningNumber);
        
        // Random Spins logic
        const arc = 360 / numbers.length;
        const stopAngle = 360 * 5 - (winningIndex * arc) - 90; 

        wheelCanvas.style.transform = `rotate(${stopAngle}deg)`;

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            audio.pause();
            
            if(data.winnings > 0) {
                document.getElementById('result-display').innerHTML = `🎉 Winner! <span style="color:#0f0">Number ${winningNumber}</span>. Won $${data.winnings}`;
                document.getElementById('winSound').play();
            } else {
                document.getElementById('result-display').innerHTML = `❌ Lost. Ball landed on <span style="color:red">${winningNumber}</span>`;
            }
            document.getElementById('user-balance').innerText = data.new_balance;
        }, 5000);
    }
</script>

</body>
</html>
