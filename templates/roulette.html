1<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE VIP ROULETTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. ROOT & NEW BACKGROUND
           ========================================= */
        :root {
            --gold: #FFD700;
            --gold-dim: #D4AF37;
            --bg-dark: #050505;
            --panel-glass: rgba(20, 20, 20, 0.95);
            --neon-green: #00ff41;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-dark);
            /* NEW: Continuous Gold Sprinkle Animation */
            background-image: 
                radial-gradient(var(--gold) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                radial-gradient(var(--gold-dim) 2px, transparent 2px);
            background-size: 50px 50px, 100px 100px, 150px 150px;
            background-position: 0 0, 0 0, 0 0;
            animation: sprinkleAnim 60s linear infinite;
            
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 110px;
        }

        @keyframes sprinkleAnim {
            from { background-position: 0 0, 0 0, 0 0; }
            to { background-position: 500px 1000px, 400px 800px, 300px 600px; }
        }

        /* =========================================
           2. HEADER
           ========================================= */
        .header-bar {
            width: 92%; max-width: 500px;
            margin: 15px auto; /* Centered */
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #ccc; }
        .user-icon { color: var(--gold); font-size: 1.2rem; }
        .bal-display { font-size: 1.3rem; font-weight: 800; color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,0,0.3); }

        /* =========================================
           3. 3D WHEEL ENGINE (Perfect Alignment Fix)
           ========================================= */
        .wheel-stage {
            position: relative;
            width: 340px; height: 340px; /* Fixed size for perfect alignment */
            margin: 25px auto; /* Perfectly Centered horizontally */
            perspective: 1000px;
        }

        /* The Outer Case */
        .wheel-outer {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #111;
            box-shadow: 
                0 0 0 8px #050505,
                0 0 0 12px var(--gold-dim),
                0 25px 50px #000;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* The Gold Inner Ring */
        .wheel-bezel {
            width: 316px; height: 316px; /* Precise sizing */
            border-radius: 50%;
            background: conic-gradient(#FFD700, #AA771C, #FFD700, #AA771C, #FFD700);
            padding: 4px;
            box-shadow: inset 0 0 20px #000;
        }

        /* The Rotating Disc */
        .wheel-spinner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1.0);
            will-change: transform;
            overflow: hidden; /* Ensures nothing spills out */
        }

        /* Number Container (GEOMETRIC FIX) */
        .number-spoke {
            position: absolute;
            left: 50%; bottom: 50%; /* Pivot exactly from center */
            width: 30px; /* Wider container for centering text */
            height: 50%; /* Exact Radius */
            transform-origin: bottom center;
            pointer-events: none;
            display: flex; justify-content: center; /* Horizontally Center */
            padding-top: 10px; /* Distance from outer edge */
            z-index: 5;
            margin-left: -15px; /* Perfectly center the spoke container itself */
        }

        .number-text {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
            /* Removed translateY, using padding-top on parent for precision */
        }

        /* Center Hub */
        .wheel-hub {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 64px; height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #555, #111);
            border: 3px solid var(--gold);
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px #000;
        }
        .hub-num { font-size: 1.6rem; color: var(--gold); font-weight: 900; }

        /* The Pointer (Fixed Top) */
        .marker {
            position: absolute;
            top: -22px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid var(--gold);
            filter: drop-shadow(0 5px 4px #000);
            z-index: 20;
        }

        /* =========================================
           4. CONTROLS AREA
           ========================================= */
        .control-panel {
            width: 95%; max-width: 500px;
            background: var(--panel-glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bet-row {
            display: flex; gap: 10px; margin-bottom: 15px;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; border: 1px solid #333;
        }
        .currency { padding: 10px; color: var(--gold); font-size: 1.3rem; font-weight: bold; }
        #betInput {
            background: none; border: none; width: 100%; color: white;
            font-size: 1.3rem; font-weight: bold; outline: none;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        
        .c-btn {
            padding: 18px 0; font-family: 'Rajdhani', sans-serif;
            font-weight: 800; font-size: 1.2rem; color: #fff;
            border: none; border-radius: 6px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            transition: all 0.1s; position: relative; top: 0;
        }
        .c-btn:active { top: 3px; box-shadow: 0 1px 0 rgba(0,0,0,0.4); }

        .bg-g { background: linear-gradient(to bottom, #27ae60, #229954); grid-column: span 3; }
        .bg-r { background: linear-gradient(to bottom, #c0392b, #a93226); }
        .bg-b { background: linear-gradient(to bottom, #34495e, #2c3e50); }

        /* Multipliers */
        .multi-row { display: flex; gap: 6px; margin-top: 12px; }
        .m-btn {
            flex: 1; padding: 18px; font-weight: 800; border: none;
            border-radius: 6px; cursor: pointer; color: white;
            text-transform: uppercase; font-size: 0.95rem; position: relative; top:0;
        }
        .m-red { background: linear-gradient(135deg, #e74c3c, #8B0000); box-shadow: 0 4px 0 #641e16; }
        .m-blk { background: linear-gradient(135deg, #34495e, #1A1A1A); box-shadow: 0 4px 0 #17202a; }
        .m-btn:active { top: 3px; box-shadow: 0 1px 0 rgba(0,0,0,0.5); }

        .selected {
            border: 2px solid var(--gold) !important;
            box-shadow: 0 0 15px var(--gold) !important;
            filter: brightness(1.2); top: 2px;
        }

        /* =========================================
           5. FOOTER & POPUP
           ========================================= */
        .footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9);
            padding: 15px; border-top: 1px solid #333;
            display: flex; justify-content: center; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .spin-btn {
            width: 100%; max-width: 450px;
            padding: 18px; font-size: 1.6rem; font-weight: 900;
            background: linear-gradient(90deg, var(--gold), #FFA000, var(--gold));
            background-size: 200%;
            border: none; border-radius: 50px;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            cursor: pointer; color: #000;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200%; } }
        .spin-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; animation: none; color: #888; }

        .win-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 200; display: none; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(10px);
        }
        .win-box {
            text-align: center; border: 4px solid var(--gold); padding: 40px;
            border-radius: 25px; background: #111;
            box-shadow: 0 0 80px var(--gold);
            transform: scale(0.8); opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .win-overlay.show .win-box { transform: scale(1); opacity: 1; }
        .claim-btn {
            margin-top: 25px; padding: 15px 50px; background: var(--gold);
            border: none; border-radius: 30px; font-weight: 900; font-size: 1.3rem; cursor: pointer; color: #000;
            box-shadow: 0 0 20px var(--gold);
        }

    </style>
</head>
<body>

    <audio id="sfxSpin" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfxWin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="header-bar">
        <div class="user-info">
            <span class="user-icon">⚜️</span> {{ user.username }}
        </div>
        <div class="bal-display">$<span id="balance">{{ "{:,.0f}".format(balance) }}</span></div>
    </div>

    <div class="wheel-stage">
        <div class="marker"></div>
        <div class="wheel-outer">
            <div class="wheel-bezel">
                <div class="wheel-spinner" id="wheelSpinner">
                    </div>
            </div>
            <div class="wheel-hub">
                <div class="hub-num" id="centerDisplay">?</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="bet-row">
            <div class="currency">$</div>
            <input type="number" id="betInput" value="1000" placeholder="Amount">
        </div>

        <div class="grid">
            <button class="c-btn bg-g" onclick="setBet('number', '0', this)">0</button>
            <script>
                const nums = [3,6,9,12,15,18,21,24,27,30,33,36,2,5,8,11,14,17,20,23,26,29,32,35,1,4,7,10,13,16,19,22,25,28,31,34];
                const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
                nums.forEach(n => {
                    let cls = reds.includes(n) ? 'bg-r' : 'bg-b';
                    document.write(`<button class="c-btn ${cls}" onclick="setBet('number', '${n}', this)">${n}</button>`);
                });
            </script>
        </div>

        <div class="multi-row">
             <button class="m-btn m-red" onclick="setBet('color', 'red', this)">
        RED <span style="font-size:0.7em; display:block; opacity:0.8;">COST: $500K | WIN: $1M</span>
    </button>
            <button class="m-btn m-blk" onclick="setBet('color', 'black', this)">
        BLACK <span style="font-size:0.7em; display:block; opacity:0.8;">COST: $50K | WIN: $100K</span>
    </button>
        </div>
    </div>

    <div class="footer">
        <button class="spin-btn" id="spinBtn" onclick="doSpin()">SPIN NOW</button>
    </div>

    <div class="win-overlay" id="winUI">
        <div class="win-box">
            <h1 style="color:var(--gold); margin:0; font-size:3rem; text-shadow: 0 0 10px var(--gold);">JACKPOT!</h1>
            <h2 id="winAmt" style="color:var(--neon-green); font-size:3.5rem; margin:15px 0; text-shadow: 0 0 15px var(--neon-green);">$0</h2>
            <div id="winTxt" style="color:#ccc; font-size: 1.2rem;">WIN</div>
            <button class="claim-btn" onclick="hideWin()">COLLECT CASH</button>
        </div>
    </div>

    <script>
        const uid = "{{ user.id }}";
        const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redSet = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        const sliceDeg = 360 / 37;
        
        let currentRotation = 0;
        let betType = null;
        let betVal = null;

        // --- INIT WHEEL ---
        const spinner = document.getElementById('wheelSpinner');
        
        // 1. Draw Colors
        let grad = [];
        wheelOrder.forEach((n, i) => {
            let color = (n===0) ? '#27ae60' : (redSet.has(n) ? '#c0392b' : '#2c3e50');
            grad.push(`${color} ${i*sliceDeg}deg ${(i+1)*sliceDeg}deg`);
        });
        spinner.style.background = `conic-gradient(${grad.join(', ')})`;

        // 2. Place Numbers (Precision Fix)
        wheelOrder.forEach((n, i) => {
            let spoke = document.createElement('div');
            spoke.className = 'number-spoke';
            let angle = (i * sliceDeg) + (sliceDeg / 2);
            spoke.style.transform = `rotate(${angle}deg)`;
            
            let txt = document.createElement('div');
            txt.className = 'number-text';
            txt.innerText = n;
            spoke.appendChild(txt);
            spinner.appendChild(spoke);
        });

        // --- LOGIC ---
        function setBet(type, val, btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            betType = type; betVal = val;
            if(navigator.vibrate) navigator.vibrate(30);
        }

        async function doSpin() {
            const amtIn = document.getElementById('betInput');
            const btn = document.getElementById('spinBtn');
            const hub = document.getElementById('centerDisplay');
            
            if(!betType || amtIn.value <= 0) { alert("Place a valid bet!"); return; }

            btn.disabled = true; btn.innerText = "ROLLING...";
            amtIn.disabled = true; hub.innerText = "...";
            document.getElementById('sfxSpin').play().catch(()=>{});

            try {
                const res = await fetch('/api/spin_roulette', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: uid, type: betType, value: betVal, amount: amtIn.value })
                });
                const data = await res.json();
                if(data.status === 'error') throw new Error(data.msg);

                // Calc Rotation
                const targetIdx = wheelOrder.indexOf(data.landed_number);
                const sliceCenterAngle = (targetIdx * sliceDeg) + (sliceDeg/2);
                let targetMod = -sliceCenterAngle;
                let currentMod = currentRotation % 360;
                let diff = targetMod - currentMod;
                if(diff > 0) diff -= 360;
                diff -= (360 * 5); // 5 extra spins
                
                currentRotation += diff;
                spinner.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    document.getElementById('sfxSpin').pause();
                    hub.innerText = data.landed_number;
                    if(data.is_win) {
                        document.getElementById('sfxWin').play();
                        showWin(data.message, data.win_amount);
                        if(navigator.vibrate) navigator.vibrate(200);
                    }
                    document.getElementById('balance').innerText = data.new_balance.toLocaleString();
                    btn.disabled = false; btn.innerText = "SPIN NOW"; amtIn.disabled = false;
                }, 5000);

            } catch(e) {
                alert(e.message); btn.disabled = false; btn.innerText = "SPIN NOW"; amtIn.disabled = false;
            }
        }

        function showWin(msg, amt) {
            const ui = document.getElementById('winUI');
            document.getElementById('winAmt').innerText = "+$" + amt.toLocaleString();
            document.getElementById('winTxt').innerText = msg;
            ui.style.display = 'flex'; setTimeout(()=> ui.classList.add('show'), 10);
        }

        function hideWin() {
            const ui = document.getElementById('winUI');
            ui.classList.remove('show'); setTimeout(()=> ui.style.display = 'none', 300);
        }
    </script>
</body>
</html>
