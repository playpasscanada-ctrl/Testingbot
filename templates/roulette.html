<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE VIP ROULETTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. ROOT VARIABLES & RESET
           ========================================= */
        :root {
            --gold: #FFD700;
            --gold-shadow: #b8860b;
            --dark-bg: #050505;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --red: #D32F2F;
            --black: #1a1a1a;
            --green: #2E7D32;
            --neon-blue: #00e5ff;
            --text-main: #ffffff;
            --border-glow: rgba(255, 215, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            /* Premium Dark Mesh Gradient */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(211, 47, 47, 0.08), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.05), transparent 25%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 120px; /* Space for fixed footer */
        }

        /* Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* =========================================
           2. HEADER & STATS
           ========================================= */
        .header-bar {
            width: 95%;
            max-width: 600px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-icon { font-size: 1.5rem; filter: drop-shadow(0 0 5px var(--gold)); }
        .username { font-size: 1.1rem; font-weight: 700; color: #ccc; letter-spacing: 1px; }

        .wallet-display { text-align: right; }
        .wallet-label { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-bottom: 2px; }
        .wallet-amount { 
            font-size: 1.4rem; 
            font-weight: 900; 
            color: var(--green); 
            text-shadow: 0 0 10px rgba(46, 125, 50, 0.4);
        }

        /* =========================================
           3. 3D ROULETTE WHEEL AREA
           ========================================= */
        .game-area {
            position: relative;
            margin: 30px 0;
            width: 360px;
            height: 360px;
            /* Creates the 3D perspective */
            perspective: 1000px;
        }

        /* Outer Casing */
        .wheel-outer-rim {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #222 0%, #000 100%);
            box-shadow: 
                0 0 0 8px #111,
                0 0 0 12px var(--gold-shadow), 
                0 0 50px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Gold Rim inside */
        .wheel-inner-rim {
            width: 92%;
            height: 92%;
            border-radius: 50%;
            background: conic-gradient(
                #FFD700, #FDB931, #FFD700, #B8860B, #FFD700
            );
            padding: 4px; /* Thickness of gold rim */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* The Rotating Part */
        .wheel-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1.0); /* Smooth easing */
            will-change: transform;
            /* IMPORTANT: This holds the slices */
        }

        /* Numbers and Slices Container */
        .slice-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Individual Slice Number */
        .wheel-number {
            position: absolute;
            top: 50%; left: 50%;
            transform-origin: center;
            width: 30px; 
            height: 50%; /* Height is radius */
            /* We align text to the top (outer edge) */
            padding-top: 15px; 
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,1);
            z-index: 5;
            /* Pointer events none to avoid blocking */
            pointer-events: none;
        }

        /* Center Hub */
        .wheel-hub {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #444, #000);
            border: 4px solid var(--gold);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* The result text inside the hub */
        .hub-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--gold);
        }

        /* The Pointer (Fixed) */
        .marker {
            position: absolute;
            top: -25px; /* Sits on top */
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--gold); /* Points DOWN */
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
            z-index: 20;
        }
        /* Little shine on marker */
        .marker::after {
            content: '';
            position: absolute;
            top: -35px; left: -10px;
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid rgba(255,255,255,0.3);
        }

        /* =========================================
           4. CONTROLS & BOARD
           ========================================= */
        .controls-wrapper {
            width: 95%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        /* Bet Input Area */
        .bet-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .currency-symbol {
            color: var(--gold);
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        input#betAmount {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            width: 100%;
            font-family: 'Rajdhani', sans-serif;
        }
        input#betAmount:focus { outline: none; }

        /* The Number Grid */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .g-btn {
            padding: 18px 0;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.1s;
        }
        
        .g-btn:active { transform: scale(0.95); }
        .g-green { background: linear-gradient(to bottom, #2ecc71, #27ae60); grid-column: span 3; box-shadow: 0 4px 0 #1e8449; }
        .g-red { background: linear-gradient(to bottom, #e74c3c, #c0392b); box-shadow: 0 4px 0 #922b21; }
        .g-black { background: linear-gradient(to bottom, #34495e, #2c3e50); box-shadow: 0 4px 0 #1a252f; }

        /* Multiplier Buttons */
        .multiplier-row {
            grid-column: span 3;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .m-btn {
            flex: 1;
            padding: 20px 0;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .m-red { background: #922b21; color: #ffadad; box-shadow: 0 4px 0 #58160f;}
        .m-black { background: #212f3c; color: #aab7b8; box-shadow: 0 4px 0 #111;}

        /* Selected State */
        .selected {
            border: 2px solid var(--gold);
            filter: brightness(1.3);
            transform: translateY(2px);
            box-shadow: none !important;
        }

        /* =========================================
           5. FIXED FOOTER (SPIN BUTTON)
           ========================================= */
        .footer-action {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.95);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--gold-shadow);
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .spin-button {
            width: 100%;
            max-width: 500px;
            padding: 18px;
            background: linear-gradient(90deg, #FFD700 0%, #FFA000 50%, #FFD700 100%);
            background-size: 200% auto;
            border: none;
            border-radius: 50px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            animation: shine 2s linear infinite;
        }
        
        @keyframes shine { to { background-position: 200% center; } }
        
        .spin-button:disabled {
            background: #444; color: #888;
            box-shadow: none; cursor: not-allowed; animation: none;
        }

        /* =========================================
           6. WIN POPUP (OVERLAY)
           ========================================= */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .win-card {
            background: linear-gradient(135deg, #111, #222);
            border: 4px solid var(--gold);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 100px var(--gold);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .overlay.active .win-card { transform: scale(1); opacity: 1; }
        
        .win-title { font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px var(--gold); }
        .win-amt { font-size: 4rem; color: var(--green); margin: 10px 0; font-weight: 900; }
        .win-desc { color: #fff; font-size: 1.2rem; }

        .collect-btn {
            margin-top: 30px;
            padding: 15px 50px;
            background: var(--gold);
            border: none;
            font-weight: 900;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <audio id="sfx-spin" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="header-bar">
        <div class="user-profile">
            <span class="user-icon">👤</span>
            <span class="username">{{ user.username }}</span>
        </div>
        <div class="wallet-display">
            <div class="wallet-label">BALANCE</div>
            <div class="wallet-amount">$<span id="balance">{{ "{:,.0f}".format(balance) }}</span></div>
        </div>
    </div>

    <div class="game-area">
        <div class="marker"></div>

        <div class="wheel-outer-rim">
            <div class="wheel-inner-rim">
                <div class="wheel-spinner" id="wheel">
                    </div>
            </div>
        </div>
        
        <div class="wheel-hub">
            <div class="hub-display" id="hubValue">?</div>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="bet-input-box">
            <span class="currency-symbol">$</span>
            <input type="number" id="betAmount" value="1000" placeholder="0">
        </div>

        <div class="grid-board">
            <button class="g-btn g-green" onclick="placeBet('number', '0', this)">0</button>

            <script>
                // Standard European Layout
                const gridOrder = [
                    3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36,
                    2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35,
                    1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34
                ];
                const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

                for(let i=0; i<3; i++) {
                    for(let j=0; j<12; j++) {
                        let n = gridOrder[i*12+j];
                        let c = reds.includes(n) ? 'g-red' : 'g-black';
                        document.write(`<button class="g-btn ${c}" onclick="placeBet('number', '${n}', this)">${n}</button>`);
                    }
                }
            </script>

            <div class="multiplier-row">
                <button class="m-btn m-red" onclick="placeBet('color', 'red', this)">
                    RED (1M PRIZE)
                </button>
                <button class="m-btn m-black" onclick="placeBet('color', 'black', this)">
                    BLACK (100K PRIZE)
                </button>
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="spin-button" id="spinBtn" onclick="spinWheel()">SPIN NOW</button>
    </div>

    <div class="overlay" id="winOverlay">
        <div class="win-card">
            <h2 class="win-title">YOU WON!</h2>
            <div class="win-amt" id="winAmountDisplay">$0</div>
            <div class="win-desc" id="winMsgDisplay">Target Hit</div>
            <button class="collect-btn" onclick="closeOverlay()">COLLECT</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const uid = "{{ user.id }}";
        
        // 1. Wheel Sequence (European Roulette Order - Clockwise)
        // This MUST match the visual order on the wheel for math to work.
        const wheelNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        
        const sliceAngle = 360 / 37;
        let currentDeg = 0;
        let selectedType = null;
        let selectedValue = null;

        // --- 2. BUILD WHEEL VISUALLY (JS Generates Gradient & Numbers) ---
        const wheelDiv = document.getElementById('wheel');
        const redSet = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

        // A. Generate Conic Gradient String
        let gradientParts = [];
        wheelNumbers.forEach((num, i) => {
            let color = (num === 0) ? '#2E7D32' : (redSet.has(num) ? '#D32F2F' : '#1a1a1a');
            let start = i * sliceAngle;
            let end = (i + 1) * sliceAngle;
            gradientParts.push(`${color} ${start}deg ${end}deg`);
        });
        wheelDiv.style.background = `conic-gradient(${gradientParts.join(', ')})`;

        // B. Place Numbers
        wheelNumbers.forEach((num, i) => {
            let el = document.createElement('div');
            el.className = 'wheel-number';
            el.innerText = num;
            
            // Calculate Rotation: center of the slice
            let midAngle = (i * sliceAngle) + (sliceAngle / 2);
            el.style.transform = `rotate(${midAngle}deg) translateY(-50%)`; 
            // translateY adjusts distance from center. Since height is 50% (radius),
            // and origin is center, this just rotates it.
            // Wait, we need the text to be at the EDGE.
            
            // Correction:
            // Rotate the DIV container to angle
            // Inside text needs to be upright? No, numbers rotate with wheel.
            // Just need to push it out.
            
            // Reset transform for simplicity:
            // 1. Rotate to angle
            // 2. Move out (TranslateY)
            el.style.transform = `rotate(${midAngle}deg) translateY(-140px)`;
            
            wheelDiv.appendChild(el);
        });


        // --- 3. GAME LOGIC ---
        function placeBet(type, val, btn) {
            // UI Update
            document.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            
            selectedType = type;
            selectedValue = val;
            
            // Vibration
            if(navigator.vibrate) navigator.vibrate(40);
        }

        async function spinWheel() {
            const amtInp = document.getElementById('betAmount');
            const btn = document.getElementById('spinBtn');
            const hub = document.getElementById('hubValue');
            
            if(!selectedType || amtInp.value <= 0) {
                alert("⚠️ Please place a valid bet!");
                return;
            }

            // Lock UI
            btn.disabled = true;
            btn.innerText = "SPINNING...";
            amtInp.disabled = true;
            hub.innerText = "...";

            // Audio
            const spinSfx = document.getElementById('sfx-spin');
            spinSfx.currentTime = 0;
            spinSfx.play().catch(e=>{});

            try {
                // Call API
                const res = await fetch('/api/spin_roulette', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        uid: uid,
                        type: selectedType,
                        value: selectedValue,
                        amount: amtInp.value
                    })
                });
                const data = await res.json();

                if(data.status === 'error') throw new Error(data.msg);

                // --- CALCULATION OF SPIN ---
                // We need the 'data.landed_number' to be at the TOP (0 deg or 360 deg)
                // But our Marker is at Top (0 deg).
                // Our wheel numbers array starts at 0 index (0 deg) going clockwise.
                // So index 0 is at 0 deg. Index 1 (32) is at +9.7 deg.
                
                // To bring Index 1 to Top, we must rotate Counter-Clockwise 9.7 deg?
                // Or Clockwise by (360 - 9.7)?
                // Let's use negative rotation for standard clockwise spin visual.
                
                const targetIndex = wheelNumbers.indexOf(data.landed_number);
                // Angle of the center of that slice
                const sliceCenter = (targetIndex * sliceAngle) + (sliceAngle / 2);
                
                // We want this angle to end up at 0 (Top).
                // Target Rotation = -sliceCenter.
                
                // Add lots of spins (e.g. 5 full rounds = 1800 deg)
                // Add some randomness to land inside the slice, not dead center
                const fuzz = (Math.random() * 4) - 2; // +/- 2 deg
                
                const extraSpins = 360 * 5;
                const newAngle = -(sliceCenter + extraSpins + fuzz);
                
                // Apply Transform
                // Note: We accumulate rotation so it doesn't snap back
                // But simplified: just set a massive negative value based on current mod?
                // Let's just set the style directly.
                
                // Reset to 0 for a sec? No, that jerks.
                // We need to add to CURRENT rotation.
                
                // Current rotation (we need to track it)
                // Since we start at 0, newAngle is absolute.
                // But if we spin again, we need to go from NewAngle to NextAngle.
                // Let's force a reset or track it.
                // Tracking is better.
                
                // Adjust calculation:
                // We are at `currentDeg`. We want to reach `newAngle` (modulo 360).
                // Actually, let's just use the absolute calculation and add it to a base.
                
                // Simple Logic:
                // 1. Reset transition
                // 2. Set rotation to `currentDeg % 360` (instant)
                // 3. Enable transition
                // 4. Rotate to `currentDeg + 1800 + diff`
                
                // Let's try the absolute huge number method, it's easier.
                // Just keep subtracting.
                
                // Calculate difference needed to align top
                // Current visual angle is usually negative.
                
                // Let's just create a new target based on the data.
                // Target is -(sliceCenter).
                // We are at 'currentDeg'.
                // We need to decrease currentDeg until (currentDeg % 360) approx equals -sliceCenter
                
                const targetMod = -sliceCenter;
                const currentMod = currentDeg % 360;
                let diff = targetMod - currentMod;
                // Ensure we spin at least 5 times (1800 deg) in negative direction
                if (diff > 0) diff -= 360; 
                diff -= 1800; // Add 5 spins
                
                currentDeg += diff;
                
                wheelDiv.style.transform = `rotate(${currentDeg}deg)`;
                
                // Finish
                setTimeout(() => {
                    spinSfx.pause();
                    hub.innerText = data.landed_number;
                    
                    if(data.is_win) {
                        document.getElementById('sfx-win').play();
                        showWin(data.message, data.win_amount);
                        if(navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
                    }
                    
                    document.getElementById('balance').innerText = data.new_balance.toLocaleString();
                    btn.disabled = false;
                    btn.innerText = "SPIN NOW";
                    amtInp.disabled = false;
                    
                }, 5000); // 5s match css transition

            } catch(e) {
                alert(e.message || "Error");
                btn.disabled = false;
                btn.innerText = "SPIN NOW";
                amtInp.disabled = false;
            }
        }

        function showWin(msg, amt) {
            const ov = document.getElementById('winOverlay');
            document.getElementById('winMsgDisplay').innerText = msg;
            document.getElementById('winAmountDisplay').innerText = "+$" + amt.toLocaleString();
            
            ov.style.display = 'flex';
            setTimeout(() => ov.classList.add('active'), 10);
        }

        function closeOverlay() {
            const ov = document.getElementById('winOverlay');
            ov.classList.remove('active');
            setTimeout(() => ov.style.display = 'none', 300);
        }

    </script>
</body>
</html>
