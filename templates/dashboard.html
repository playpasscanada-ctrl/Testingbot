<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luneira Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Poppins:wght@300;600&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff; 
            --secondary: #bc13fe; 
            --gold: #ffd700;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05); 
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            margin: 0; padding: 0; background: var(--dark); color: white;
            font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- MAGIC TOUCH TRAIL --- */
        #trail-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }

        /* --- ANIMATED BACKGROUND --- */
        .bg-grid {
            position: absolute; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: moveGrid 15s linear infinite; z-index: -1;
            opacity: 0.5; pointer-events: none;
        }
        @keyframes moveGrid { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }

        /* --- DEVELOPER BADGE (SAKSHAM) --- */
        .dev-badge {
            position: absolute; top: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            padding: 5px 15px; border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; color: var(--gold);
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            z-index: 100;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow { from { box-shadow: 0 0 5px var(--gold); } to { box-shadow: 0 0 20px var(--gold); } }

        /* --- PROFILE --- */
        .profile-bar {
            position: relative; margin-top: 40px; width: 90%; max-width: 400px;
            background: rgba(20, 20, 30, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 15px 25px; display: flex; align-items: center; gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 50;
        }
        .avatar { 
            width: 55px; height: 55px; border-radius: 50%; 
            border: 2px solid var(--primary); 
            box-shadow: 0 0 15px var(--primary);
        }
        .info h3 { margin: 0; font-family: 'Rajdhani'; font-size: 22px; letter-spacing: 1px; color: white; }
        .info p { margin: 2px 0 0; font-size: 14px; color: var(--primary); font-weight: bold; font-family: 'Orbitron'; }

        /* --- CARDS CONTAINER --- */
        .hub-container {
            display: flex; flex-direction: column; gap: 20px; width: 90%; max-width: 400px;
            margin-top: 30px; z-index: 50;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid var(--border); padding: 25px 30px; border-radius: 20px;
            text-decoration: none; color: white; position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        
        /* Neon Sweep Effect */
        .card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s; pointer-events: none;
        }
        .card:active { transform: scale(0.96); }
        .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.3); }
        .card:hover::after { left: 100%; }

        .shop-card { border-left: 4px solid var(--secondary); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .game-card { border-left: 4px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-card { border-left: 4px solid #5865F2; box-shadow: 0 10px 30px rgba(88, 101, 242, 0.3); justify-content: center; }

        .shop-card:hover { box-shadow: 0 10px 40px rgba(188, 19, 254, 0.2); }
        .game-card:hover { box-shadow: 0 10px 40px rgba(0, 243, 255, 0.2); }
        .login-card:hover { box-shadow: 0 10px 40px rgba(88, 101, 242, 0.4); }

        .card-text h2 { margin: 0; font-family: 'Rajdhani'; font-size: 28px; text-transform: uppercase; font-weight: 700; }
        .card-text p { margin: 5px 0 0; font-size: 12px; color: #bbb; letter-spacing: 0.5px; }
        .icon { font-size: 35px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); transition: 0.3s; }
        
        .card:hover .icon { transform: scale(1.2) rotate(10deg); }

        /* Footer Credit */
        .footer-credit {
            position: absolute; bottom: 20px;
            font-size: 10px; color: rgba(255,255,255,0.3);
            font-family: 'Poppins'; letter-spacing: 1px;
        }

        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="trail-canvas"></canvas>

    <div class="bg-grid"></div>

    <div class="dev-badge">DEVELOPED BY SAKSHAM</div>

    {% if user %}
        
        <div class="profile-bar">
            <img src="{{ user['avatar'] }}" class="avatar" alt="User" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="info">
                <h3>{{ user['username'] }}</h3>
                <p>WALLET: ${{ "{:,}".format(balance) }}</p>
            </div>
        </div>

        <div class="hub-container">
            <a href="/shop" class="card shop-card">
                <div class="card-text">
                    <h2 style="color: var(--secondary);">Item Shop</h2>
                    <p>Buy Roles & Inventory</p>
                </div>
                <div class="icon">🛍️</div>
            </a>

            <a href="/games" class="card game-card">
                <div class="card-text">
                    <h2 style="color: var(--primary);">Game Zone</h2>
                    <p>Play & Earn Money</p>
                </div>
                <div class="icon">🎮</div>
            </a>
        </div>

        <div class="footer-credit">SYSTEM SECURED • ID: {{ user['id'] }}</div>

    {% else %}
        
        <div class="hub-container" style="margin-top: 50px;">
            <a href="{{ login_url }}" class="card login-card">
                <div class="card-text" style="text-align: center;">
                    <h2 style="color: #5865F2;">LOGIN</h2>
                    <p>Connect with Discord</p>
                </div>
            </a>
        </div>
        <div class="footer-credit">WELCOME TO LUNEIRA</div>

    {% endif %}


    <script>
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Track Mouse/Touch
        const addPoint = (x, y) => {
            points.push({ x: x, y: y, age: 0, hue: Math.random() * 360 });
        };

        document.addEventListener('mousemove', e => addPoint(e.clientX, e.clientY));
        document.addEventListener('touchmove', e => addPoint(e.touches[0].clientX, e.touches[0].clientY));

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw the trail
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.age++;
                
                // Remove old points
                if (p.age > 25) {
                    points.splice(i, 1);
                    i--;
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 10 - (p.age / 2.5), 0, Math.PI * 2);
                
                // Rainbow Color Logic
                ctx.fillStyle = `hsla(${p.hue}, 100%, 50%, ${1 - p.age/25})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${p.hue}, 100%, 50%, 1)`;
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
