<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #020205; color: white; margin: 0; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh;
        }
        
        /* --- BACKGROUND PARTICLES (CANVAS) --- */
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            z-index: 10; position: relative; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .back-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.3s; font-family: 'Orbitron'; letter-spacing: 1px;
        }
        .back-btn:hover { background: white; color: black; box-shadow: 0 0 20px white; }

        .container {
            padding: 20px; display: flex; flex-direction: column; gap: 25px;
            height: 85vh; overflow-y: auto; z-index: 5; position: relative;
            padding-bottom: 100px; /* Space for scrolling */
        }
        
        /* Hide Scrollbar */
        .container::-webkit-scrollbar { display: none; }

        /* --- PREMIUM GAME CARD DESIGN --- */
        .game-card {
            position: relative; height: 160px; border-radius: 20px;
            background: rgba(20, 20, 30, 0.6); /* Glassy Dark */
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between; padding: 0 25px;
            text-decoration: none; overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            
            /* Entry Animation */
            opacity: 0; transform: translateY(30px);
            animation: slideIn 0.6s forwards;
        }
        
        /* Staggered Animation Delays */
        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.2s; }
        .game-card:nth-child(3) { animation-delay: 0.3s; }
        .game-card:nth-child(4) { animation-delay: 0.4s; }
        .game-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .game-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: translateX(-100%); transition: 0.5s;
        }
        
        .game-card:hover { transform: scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-width: 2px; }
        .game-card:hover::before { transform: translateX(100%); }

        /* Left Side Text */
        .card-info h2 { 
            margin: 0; font-size: 28px; font-family: 'Orbitron'; letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card-info p { 
            margin: 5px 0 0; letter-spacing: 2px; font-weight: bold; font-size: 12px; opacity: 0.9; 
            text-transform: uppercase;
        }
        
        /* Right Side Icon */
        .card-icon { font-size: 55px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); transition: 0.4s; }
        .game-card:hover .card-icon { transform: rotate(10deg) scale(1.2); filter: drop-shadow(0 0 25px rgba(255,255,255,0.6)); }

        .status-badge {
            position: absolute; top: 15px; right: 15px; padding: 4px 10px;
            border-radius: 20px; font-size: 10px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 0 15px currentColor;
        }
        .live { background: #00f3ff; color: black; box-shadow: 0 0 15px #00f3ff; }
        .soon { background: #333; color: gray; border: 1px solid #555; box-shadow: none; }

        /* --- SPECIFIC CARD STYLES --- */
        .card-runner { border-color: cyan; }
        .card-runner:hover { box-shadow: 0 0 30px cyan, inset 0 0 20px rgba(0, 255, 255, 0.1); }
        
        .card-slots { border-color: #ff00de; }
        .card-slots:hover { box-shadow: 0 0 30px #ff00de, inset 0 0 20px rgba(255, 0, 222, 0.1); }

        .card-death { border-color: #ff0000; }
        .card-death:hover { box-shadow: 0 0 30px #ff0000, inset 0 0 20px rgba(255, 0, 0, 0.1); }

        .card-biz { border-color: #00ff00; }
        .card-biz:hover { box-shadow: 0 0 30px #00ff00, inset 0 0 20px rgba(0, 255, 0, 0.1); }

    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="header">
        <a href="/" class="back-btn">← DASHBOARD</a>
        <div style="font-family:'Orbitron'; color:#ffd700; font-size: 20px; text-shadow:0 0 15px #ffd700;">${{ "{:,}".format(balance) }}</div>
    </div>

    <div class="container">
        
        <a href="/games/runner" class="game-card card-runner">
            <div class="status-badge live" style="background:cyan; color:black; box-shadow:0 0 15px cyan;">NEW</div>
            <div class="card-info">
                <h2 style="background: linear-gradient(to right, cyan, #0088ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">NEON SURF</h2>
                <p style="color: cyan;">RUN & COLLECT • $10/COIN</p>
            </div>
            <div class="card-icon">🏃‍♂️</div>
        </a>

        <a href="/games/casino" class="game-card card-slots">
            <div class="status-badge live">ONLINE</div>
            <div class="card-info">
                <h2 style="background: linear-gradient(to right, #ff00de, #ff99ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">NEON SLOTS</h2>
                <p style="color: #ff00de;">WIN JACKPOT 10M</p>
            </div>
            <div class="card-icon">🎰</div>
        </a>

        <a href="/games/casino" class="game-card card-death">
            <div class="status-badge live" style="background:red; color:white; box-shadow:0 0 15px red;">HOT</div>
            <div class="card-info">
                <h2 style="background: linear-gradient(to right, #ff4d4d, #ff0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">DEATH ROLL</h2>
                <p style="color: #ff4d4d;">HIGH RISK • 10x WIN</p>
            </div>
            <div class="card-icon">💀</div>
        </a>

        <a href="/business" class="game-card card-biz">
            <div class="status-badge live" style="background:#00ff00; color:black; box-shadow:0 0 15px #00ff00;">PASSIVE</div>
            <div class="card-info">
                <h2 style="background: linear-gradient(to right, #00ff00, #00aa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GTA BUSINESS</h2>
                <p style="color: #00ff00;">BUILD EMPIRE • RAID</p>
            </div>
            <div class="card-icon">💼</div>
        </a>

        <div class="game-card" style="filter: grayscale(1); opacity: 0.5; cursor: not-allowed; border-color: #555;">
            <div class="status-badge soon">SOON</div>
            <div class="card-info">
                <h2 style="color:gray;">LUCKY DICE</h2>
                <p style="color:gray;">UNDER DEVELOPMENT</p>
            </div>
            <div class="card-icon">🎲</div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let touchParticles = [];

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        // 1. FALLING SPARKLES
        class Sparkle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5 + 0.2;
                this.opacity = Math.random();
            }
            update() {
                this.y += this.speed;
                if (this.y > height) this.y = 0;
                this.opacity += Math.random() * 0.02 - 0.01;
                if (this.opacity < 0) this.opacity = 0;
                if (this.opacity > 1) this.opacity = 1;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        // 2. TOUCH TRAIL PARTICLES
        class Trail {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1;
                this.color = `hsl(${Math.random()*360}, 100%, 50%)`;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Initialize Background Sparkles
        for(let i=0; i<50; i++) particles.push(new Sparkle());

        // Handle Touch/Mouse Move
        function addTrail(x, y) {
            for(let i=0; i<3; i++) touchParticles.push(new Trail(x, y));
        }
        window.addEventListener('mousemove', e => addTrail(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => addTrail(e.touches[0].clientX, e.touches[0].clientY));

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Background Sparkles
            particles.forEach(p => { p.update(); p.draw(); });

            // Draw Touch Trail
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update();
                touchParticles[i].draw();
                if (touchParticles[i].life <= 0) {
                    touchParticles.splice(i, 1); i--;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
