<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background: #050505; color: white; font-family: 'Orbitron', sans-serif; text-align: center; }
        .header { padding: 40px; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: gray; text-decoration: none; font-size: 20px; }
        
        .game-grid {
            display: flex; justify-content: center; gap: 30px; padding: 50px; flex-wrap: wrap;
        }
        .game-tile {
            width: 300px; height: 180px;
            background: linear-gradient(135deg, #111, #222);
            border-radius: 15px; border: 1px solid #444;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: white; position: relative;
            overflow: hidden; transition: 0.3s;
        }
        .game-tile:hover {
            transform: scale(1.05); border-color: gold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .game-info h2 { margin: 0; font-size: 28px; }
        .game-info p { color: #00ffcc; font-size: 14px; }
        .status { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #0f0; }
    </style>
</head>
<body>
    <a href="/dashboard" class="back-btn">← Back</a>
    <div class="header">
        <h1>AVAILABLE GAMES</h1>
        <p>Your Balance: <span style="color: gold;">${{ balance }}</span></p>
    </div>

    <div class="game-grid">
        <a href="/games/casino" class="game-tile">
            <div class="status">● ONLINE</div>
            <div class="game-info">
                <h2>🎰 SLOTS</h2>
                <p>Jackpot: 10 MILLION</p>
            </div>
        </a>
        
        <div class="game-tile" style="opacity: 0.5; cursor: not-allowed;">
            <div class="game-info">
                <h2>🎲 DICE</h2>
                <p>Coming Soon...</p>
            </div>
        </div>
    </div>
</body>
</html>
