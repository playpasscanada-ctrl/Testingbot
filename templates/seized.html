<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS DENIED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .glitch-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            animation: glitch 1s infinite;
        }

        .sub-text {
            margin-top: 20px;
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 80%;
            line-height: 1.5;
        }

        .lock-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: shake 0.5s infinite;
        }

        .border-box {
            border: 2px solid red;
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.4);
            background: rgba(20, 0, 0, 0.9);
            max-width: 90%;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px #fff; }
            50% { text-shadow: -2px -2px #000; }
            100% { text-shadow: 2px 2px #fff; }
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="border-box">
        <div class="lock-icon">🔒</div>
        <div class="glitch-text">ACCOUNT SEIZED</div>
        
        <div class="sub-text">
            YOUR ASSETS HAVE BEEN FROZEN BY THE ADMINISTRATOR.<br><br>
            REASON: VIOLATION OF PROTOCOLS<br>
            STATUS: <span style="background:red; color:black; padding:2px 5px;">TERMINATED</span>
        </div>

        <div style="margin-top: 40px; font-size: 0.8rem; color: #555;">
            ERROR CODE: 403_FORBIDDEN_USER
        </div>
    </div>

</body>
</html>
