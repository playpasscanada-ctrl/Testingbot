<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Discord Shop</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; text-align: center; }
        h1 { color: #FFD700; text-shadow: 0 0 10px #FFD700; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; width: 250px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #FFD700; }
        .card h3 { margin-top: 0; color: #fff; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.2em; }
        .btn { background: #FFD700; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
        .btn:hover { background: #ffcc00; }
        .role-card { border-top: 5px solid; }
        .vip-card { border-top: 5px solid #9b59b6; }
        .lotto-card { border-top: 5px solid #e74c3c; }
    </style>
</head>
<body>

    <h1>🛒 GLOBAL BLACK MARKET</h1>
    <p>Logged in User ID: <span id="uid-display">Checking...</span></p>

    <div class="container" id="shop-container">
        </div>

    <script>
        // Get User ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        document.getElementById('uid-display').innerText = userId || "Not Logged In (Use /shop in Discord)";

        // Shop Data (Synced with Python)
        const items = [
            {id: 'izzat_wapasi', name: '🧼 Izzat Wapasi', price: 100000, type: 'item', desc: "Clean your bad name"},
            {id: 'extra_life', name: '💖 Extra Life', price: 50000, type: 'item', desc: "Survive one death"},
            {id: 'landmine', name: '💣 Landmine', price: 25000, type: 'item', desc: "Explode robbers"},
            
            {id: 'vip_1h', name: '👑 1 Hour VIP', price: 1000000, type: 'vip', desc: "Immunity for 1 Hr"},
            {id: 'vip_1d', name: '👑 1 Day VIP', price: 5000000, type: 'vip', desc: "Immunity for 24 Hrs"},
            {id: 'vip_1w', name: '👑 1 Week VIP', price: 25000000, type: 'vip', desc: "Immunity for 7 Days"},
            {id: 'vip_life', name: '♾️ Lifetime VIP', price: 7000000000, type: 'vip', desc: "Immunity FOREVER"},

            {id: 'lotto_10k', name: '🎟️ 10k Ticket', price: 10000, type: 'lotto', desc: "Win 100k (10%)"},
            {id: 'lotto_20k', name: '🎟️ 20k Ticket', price: 20000, type: 'lotto', desc: "Win 150k (8%)"},
            {id: 'lotto_50k', name: '🎟️ 50k Ticket', price: 50000, type: 'lotto', desc: "Win 400k (5%)"},
            {id: 'lotto_100k', name: '🎟️ 100k Ticket', price: 100000, type: 'lotto', desc: "Win 5M (2%)"},

            {id: 'hitman', name: '🗡️ Hitman', price: 5000000, type: 'role', color: '#8B0000'},
            {id: 'gambler', name: '🎲 Gambler', price: 5000000, type: 'role', color: '#3498DB'},
            {id: 'peaky', name: '🚬 Peaky Blinders', price: 20000000, type: 'role', color: '#808080'},
            {id: 'millionaire', name: '💰 Millionaire', price: 25000000, type: 'role', color: '#2ECC71'},
            {id: 'yakuza', name: '👺 Yakuza', price: 30000000, type: 'role', color: '#FF0000'},
            {id: 'yamraj', name: '💀 Yamraj', price: 50000000, type: 'role', color: '#000000'},
            {id: 'rich_kid', name: '💸 Rich Kid', price: 50000000, type: 'role', color: '#F1C40F'},
            {id: 'lucifer', name: '😈 Lucifer', price: 100000000, type: 'role', color: '#4B0082'},
            {id: 'mafia', name: '🕶️ Mafia', price: 500000000, type: 'role', color: '#2C3E50'},
            {id: 'oil_prince', name: '🛢️ Oil Prince', price: 1000000000, type: 'role', color: '#D35400'},
            {id: 'server_god', name: '🛐 Server God', price: 10000000000, type: 'role', color: '#FF00FF'},
            {id: 'impossible', name: '♾️ IMPOSSIBLE', price: 1000000000000000000, type: 'role', color: '#FFFFFF'},
        ];

        const container = document.getElementById('shop-container');

        items.forEach(item => {
            let borderStyle = '';
            if(item.type === 'role') borderStyle = `border-top-color: ${item.color}; border-top-width: 5px;`;
            if(item.type === 'vip') borderStyle = `border-top-color: #9b59b6; border-top-width: 5px;`;
            if(item.type === 'lotto') borderStyle = `border-top-color: #e74c3c; border-top-width: 5px;`;

            const card = document.createElement('div');
            card.className = 'card';
            card.style = borderStyle;
            card.innerHTML = `
                <h3>${item.name}</h3>
                <p>${item.desc || 'Role for Flex'}</p>
                <div class="price">$${item.price.toLocaleString()}</div>
                <button class="btn" onclick="buyItem('${item.id}')">BUY NOW</button>
            `;
            container.appendChild(card);
        });

        async function buyItem(itemKey) {
            if(!userId) return alert("Please open this link from Discord /shop command!");

            if(!confirm("Confirm purchase?")) return;

            try {
                const res = await fetch('/buy', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, item_key: itemKey })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    alert(data.msg + "\nRemaining Balance: $" + data.new_balance.toLocaleString());
                } else {
                    alert("Error: " + data.msg);
                }
            } catch(e) {
                alert("Server Error");
            }
        }
    </script>
</body>
</html>
