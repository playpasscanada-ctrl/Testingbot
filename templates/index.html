<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Black Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --dark: #0a0a0a;
            --card-bg: #111;
            --border: #333;
            --neon-red: #ff3333;
            --neon-green: #00ff00;
            --neon-blue: #00ccff;
        }

        /* --- Global Animations --- */
        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2); }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }

        /* --- Header --- */
        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
        }

        .subtitle { color: #888; font-size: 1rem; margin-bottom: 20px; letter-spacing: 1px; }

        /* --- Status Bar --- */
        #status-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 1.1rem;
            backdrop-filter: blur(5px);
            animation: glow 3s infinite;
        }
        .status-dot { height: 10px; width: 10px; background: red; border-radius: 50%; box-shadow: 0 0 10px red; }
        .connected .status-dot { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        /* --- Filters --- */
        .filters { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #888;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* --- Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Card Design --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        }
        
        .card.special::before { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
        .card.vip::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .card.role::before { background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .card.lotto::before { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .card.verification::before { background: #ffffff; box-shadow: 0 0 10px #ffffff; }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #777;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }

        .card-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 10px;
            text-align: left;
        }

        .card-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: left;
            line-height: 1.2;
        }

        .card-price {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 600;
            text-align: right;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        button.buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #b8860b, var(--gold));
            border: none;
            color: black;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button.buy-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--gold);
        }

        button.buy-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Login Container */
        .login-container {
            margin-top: 100px;
            padding: 60px;
            background: rgba(17, 17, 17, 0.8);
            border: 1px solid #333;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.1);
        }
        .login-btn {
            background: #5865F2;
            color: white;
            padding: 18px 40px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }
        .login-btn:hover { 
            background: #4752c4; 
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(88, 101, 242, 0.6);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    {% if user %}
        <h1>Global Black Market</h1>
        <div class="subtitle">SECURE • ANONYMOUS • INSTANT</div>

        <div id="status-bar" class="connected">
            <div class="status-dot"></div>
            <span id="status-text">
                Welcome, <span style="color:var(--gold)">{{ user.username }}</span> 
                | Balance: <span style="color:var(--neon-green)">${{ "{:,.0f}".format(user.balance) }}</span>
            </span>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterItems('all')">All</button>
            <button class="filter-btn" onclick="filterItems('special')">Items</button>
            <button class="filter-btn" onclick="filterItems('vip')">VIP Access</button>
            <button class="filter-btn" onclick="filterItems('verification')">VERIFICATION</button>
            <button class="filter-btn" onclick="filterItems('role')">Roles</button>
            <button class="filter-btn" onclick="filterItems('lotto')">Lottery</button>
        </div>

        <div class="grid" id="container"></div>

        <script>
            // ✅ CHANNEL ID TRACKING (Fixed Logic)
            const urlParams = new URLSearchParams(window.location.search);
            const cid = "{{ cid }}" || urlParams.get('state') || ""; 
            const uid = "{{ user.id }}";

            // 📦 100% Items Protected (No deletion)
            const items = [
                // Special
                {id: 'izzat', name: '🧼 Izzat Wapasi', price: 150000, type: 'special'},
                {id: 'landmine', name: '💣 Landmine', price: 500000, type: 'special'},
                {id: 'life', name: '💖 Extra Life', price: 750000, type: 'special'},
                {id: 'cctv', name: '📹 CCTV Camera', price: 150000, type: 'special'},
                {id: 'knife', name: '🔪 Combat Knife', price: 50000, type: 'special'},
                {id: 'armor', name: '🛡️ Kevlar Vest', price: 80000, type: 'special'},
                {id: 'steroids', name: '💉 Steroids', price: 20000, type: 'special'},

                // Verification
                {id: 'verify_1d', name: '✅ Verify (1 Day)', price: 50000000, type: 'verification'},
                {id: 'verify_3d', name: '✅ Verify (3 Days)', price: 150000000, type: 'verification'},
                {id: 'verify_5d', name: '✅ Verify (5 Days)', price: 500000000, type: 'verification'},
                {id: 'verify_1w', name: '✅ Verify (1 Week)', price: 1000000000, type: 'verification'},
                {id: 'verify_10d', name: '✅ Verify (10 Days)', price: 1500000000, type: 'verification'},
                {id: 'verify_15d', name: '✅ Verify (15 Days)', price: 3000000000, type: 'verification'},
                {id: 'verify_1m', name: '✅ Verify (1 Month)', price: 10000000000000, type: 'verification'},
                {id: 'verify_perm', name: '♾️ Verify (Lifetime)', price: 100000000000000, type: 'verification'},

                // VIP
                {id: 'vip_10m', name: '⚡ 10 Mins Escape', price: 200000, type: 'vip'},
                {id: 'vip_1h', name: '👑 1 Hour VIP', price: 10000000, type: 'vip'},
                {id: 'vip_6h', name: '🛡️ 6 Hours VIP', price: 30000000, type: 'vip'},
                {id: 'vip_1d', name: '💎 1 Day VIP', price: 50000000, type: 'vip'},
                {id: 'vip_3d', name: '🗓️ 3 Days VIP', price: 120000000, type: 'vip'},
                {id: 'vip_1w', name: '🔥 1 Week VIP', price: 250000000, type: 'vip'},
                {id: 'vip_life', name: '♾️ Lifetime VIP', price: 700000000000, type: 'vip'},

                // Roles
                {id: 'hitman', name: '🗡️ Hitman', price: 50000000, type: 'role'},
                {id: 'hacker', name: '💻 Hacker', price: 100000000, type: 'role'},
                {id: 'gambler', name: '🎲 Gambler', price: 200000000, type: 'role'},
                {id: 'peaky', name: '🚬 Peaky Blinders', price: 300000000, type: 'role'},
                {id: 'shadow', name: '👻 Shadow', price: 400000000, type: 'role'},
                {id: 'yakuza', name: '👺 Yakuza', price: 500000000, type: 'role'},
                {id: 'mafia', name: '🕶️ Mafia Boss', price: 1000000000, type: 'role'},
                {id: 'king', name: '👑 Kingpin', price: 5000000000, type: 'role'},
                {id: 'oil', name: '🛢️ Oil Prince', price: 100000000000, type: 'role'},
                {id: 'god', name: '🛐 Server God', price: 10000000000000, type: 'role'},
                {id: 'immortal', name: '🧟 Immortal', price: 5000000000000, type: 'role'},

                // Lotto
                {id: 'lotto_10k', name: '🎟️ 20k Ticket', price: 20000, type: 'lotto'},
                {id: 'lotto_50k', name: '🎟️ 100k Ticket', price: 100000, type: 'lotto'},
                {id: 'lotto_100k', name: '🎟️ 150k Ticket', price: 150000, type: 'lotto'},
                {id: 'lotto_mega', name: '🎫 MEGA JACKPOT', price: 5000000, type: 'lotto'},
                {id: 'lotto_god', name: '🎰 GOD TICKET', price: 100000000, type: 'lotto'}
            ];

            const container = document.getElementById('container');

            function renderItems(filter = 'all') {
                container.innerHTML = '';
                items.forEach(item => {
                    if (filter === 'all' || item.type === filter) {
                        const card = document.createElement('div');
                        card.className = `card ${item.type}`;
                        card.innerHTML = `
                            <div class="card-type">${item.type.toUpperCase()}</div>
                            <div class="card-name">${item.name}</div>
                            <div class="card-price">$${item.price.toLocaleString()}</div>
                            <button class="buy-btn" onclick="buy('${item.id}', this)">PURCHASE</button>
                        `;
                        container.appendChild(card);
                    }
                });
            }

            function filterItems(category) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                renderItems(category);
            }

            // 🛒 BUY LOGIC WITH RECEIPT TRACKING
            async function buy(itemId, btn) {
                const originalText = btn.innerText;
                btn.innerText = "VERIFYING...";
                btn.disabled = true;

                try {
                    const res = await fetch('/buy', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        // Sending cid (Channel ID) to Python for Receipt
                        body: JSON.stringify({ uid: uid, cid: cid, item_id: itemId })
                    });
                    const data = await res.json();

                    if (data.status === 'success') {
                        btn.innerText = "PURCHASED";
                        btn.style.background = "var(--neon-green)";
                        alert(`💸 SUCCESS!\n${data.msg}\nReceipt sent to Discord.`);
                        location.reload(); // Refresh balance
                    } else {
                        btn.innerText = "DENIED";
                        btn.style.background = "var(--neon-red)";
                        alert(`❌ ERROR: ${data.msg}`);
                    }
                } catch (err) {
                    alert("⚠️ Connection Failed. Market is offline.");
                }

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    btn.style.background = "";
                }, 2000);
            }

            renderItems();
        </script>
    {% else %}
        <div class="login-container">
            <h1 style="color:var(--neon-red); font-size: 3.5rem;">🔒 RESTRICTED</h1>
            <p style="color:#888; font-size:1.2rem; letter-spacing: 1px;">
                AUTHORIZATION REQUIRED FOR MARKET ENTRY
            </p>
            <a href="{{ login_url }}" class="login-btn">
                📡 ESTABLISH CONNECTION
            </a>
        </div>
    {% endif %}
</body>
</html>
