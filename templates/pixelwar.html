<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Pixel War</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00de;
            --bg-dark: #050508;
            --glass: rgba(16, 16, 24, 0.85);
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
        }

        /* --- FULLSCREEN CANVAS --- */
        #game-container {
            flex: 1; position: relative; overflow: hidden;
            background-color: #0b0b10;
            background-image: 
                linear-gradient(#1a1a20 1px, transparent 1px),
                linear-gradient(90deg, #1a1a20 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none; /* Crucial for mobile drag */
        }

        #pixel-canvas {
            position: absolute; left: 0; top: 0;
            image-rendering: pixelated;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform-origin: 0 0;
        }

        /* --- HUD (HEADS UP DISPLAY) --- */
        .hud-top {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px; display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }

        .score-pill {
            pointer-events: auto;
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 8px 16px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .score-pill.neon { border-color: var(--neon-blue); color: var(--neon-blue); }
        .score-pill.cyber { border-color: var(--neon-pink); color: var(--neon-pink); }
        
        .score-val { font-family: 'Orbitron'; font-size: 18px; font-weight: bold; color: white; }

        .back-btn {
            pointer-events: auto;
            background: rgba(255,0,0,0.2); border: 1px solid #ff4444; color: #ff4444;
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 14px;
        }

        /* --- BOTTOM NAVIGATION (MOBILE STYLE) --- */
        .bottom-nav {
            height: 70px; background: var(--glass); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 20; padding-bottom: 5px;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #666; font-size: 10px; gap: 4px; cursor: pointer; transition: 0.2s;
            width: 60px;
        }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .nav-item.active i { transform: scale(1.1); }

        /* --- DRAWERS (SLIDE UP PANELS) --- */
        .drawer {
            position: absolute; bottom: 70px; left: 0; width: 100%; height: 60%;
            background: #0f0f14; border-top: 2px solid var(--neon-blue);
            border-radius: 20px 20px 0 0; transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 15; display: flex; flex-direction: column;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        }
        .drawer.open { transform: translateY(0); }
        
        .drawer-header {
            padding: 15px; text-align: center; border-bottom: 1px solid #222;
            font-family: 'Orbitron'; font-size: 16px; color: white;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-drawer { color: #666; cursor: pointer; padding: 5px; }

        .drawer-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* --- MEMBER CARDS (INVITE UI) --- */
        .agent-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            padding: 12px; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .agent-info { display: flex; align-items: center; gap: 12px; }
        .agent-avatar { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #555; }
        .agent-name { font-weight: bold; font-size: 14px; }
        .agent-status { font-size: 10px; color: #0f0; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; background: #0f0; border-radius: 50%; box-shadow: 0 0 5px #0f0; }

        .btn-invite {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 16px; border-radius: 20px; font-family: 'Orbitron'; font-size: 10px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-invite:active { background: var(--neon-blue); color: black; }

        /* --- TEAM MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .team-title { font-family: 'Orbitron'; font-size: 24px; margin-bottom: 40px; text-shadow: 0 0 15px white; }
        
        .team-btn {
            width: 80%; max-width: 300px; padding: 25px; margin: 10px;
            background: rgba(255,255,255,0.05); border: 2px solid #444;
            border-radius: 15px; cursor: pointer; text-align: left;
            display: flex; align-items: center; gap: 20px; transition: 0.2s;
        }
        .team-btn i { font-size: 30px; }
        .team-btn h3 { margin: 0; font-family: 'Orbitron'; font-size: 18px; }
        .team-btn p { margin: 5px 0 0; font-size: 10px; color: #888; }

        .team-btn.neon { border-color: var(--neon-blue); color: var(--neon-blue); }
        .team-btn.neon:active { background: rgba(0, 243, 255, 0.2); }
        
        .team-btn.cyber { border-color: var(--neon-pink); color: var(--neon-pink); }
        .team-btn.cyber:active { background: rgba(255, 0, 222, 0.2); }

        /* --- COOLDOWN TOAST --- */
        .toast {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid white; color: white;
            padding: 10px 20px; border-radius: 30px; font-family: 'Orbitron'; font-size: 14px;
            display: none; pointer-events: none; z-index: 50;
        }

    </style>
</head>
<body>

    <div class="modal-overlay" id="teamModal">
        <div class="team-title">SELECT FACTION</div>
        
        <div class="team-btn neon" onclick="selectTeam('neon')">
            <i class="fas fa-cube"></i>
            <div>
                <h3>TEAM NEON</h3>
                <p>THE ARCHITECTS • BLUE</p>
            </div>
        </div>

        <div class="team-btn cyber" onclick="selectTeam('cyber')">
            <i class="fas fa-bolt"></i>
            <div>
                <h3>TEAM CYBER</h3>
                <p>THE GLITCHERS • PINK</p>
            </div>
        </div>
    </div>

    <div class="hud-top">
        <a href="/" class="back-btn"><i class="fas fa-times"></i></a>
        <div class="score-pill neon">
            <i class="fas fa-cube"></i> <span class="score-val" id="score-neon">0</span>
        </div>
        <div class="score-pill cyber">
            <i class="fas fa-bolt"></i> <span class="score-val" id="score-cyber">0</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="pixel-canvas"></canvas>
        <div class="toast" id="cooldown-toast">WAIT: <span id="timer">5.0</span>s</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="closeDrawers()">
            <i class="fas fa-map"></i>
            <span>MAP</span>
        </div>
        <div class="nav-item" onclick="openDrawer('agents')">
            <i class="fas fa-users"></i>
            <span>AGENTS</span>
        </div>
        <div class="nav-item" onclick="openDrawer('logs')">
            <i class="fas fa-list-ul"></i>
            <span>LOGS</span>
        </div>
    </div>

    <div class="drawer" id="drawer-agents">
        <div class="drawer-header">
            <span>ACTIVE AGENTS</span>
            <i class="fas fa-chevron-down close-drawer" onclick="closeDrawers()"></i>
        </div>
        <div class="drawer-content" id="agents-list">
            <div style="text-align:center; padding:30px; color:#666;">
                <i class="fas fa-satellite fa-spin" style="font-size:20px; margin-bottom:10px;"></i><br>
                SCANNING FREQUENCIES...
            </div>
        </div>
    </div>

    <div class="drawer" id="drawer-logs">
        <div class="drawer-header">
            <span>BATTLE LOGS</span>
            <i class="fas fa-chevron-down close-drawer" onclick="closeDrawers()"></i>
        </div>
        <div class="drawer-content" id="logs-list" style="font-size:12px; color:#aaa; line-height:1.6;">
            </div>
    </div>

    <script>
        // --- CONFIG ---
        const GRID_SIZE = {{ grid_size }};
        const PIXEL_SIZE = 20;
        let myTeam = null;
        let cooldown = 0;
        
        // Canvas Logic
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GRID_SIZE * PIXEL_SIZE;
        canvas.height = GRID_SIZE * PIXEL_SIZE;

        // Panning Variables
        let isDragging = false;
        let startX, startY, currentX = 0, currentY = 0;
        let translateX = 0, translateY = 0;

        // --- 1. INITIALIZATION ---
        // Center the map initially
        const centerX = (container.offsetWidth - canvas.width) / 2;
        const centerY = (container.offsetHeight - canvas.height) / 2;
        translateX = centerX; translateY = centerY;
        canvas.style.transform = `translate(${translateX}px, ${translateY}px)`;

        // --- 2. TEAM LOGIC ---
        function selectTeam(team) {
            myTeam = team;
            document.getElementById('teamModal').style.opacity = '0';
            setTimeout(() => document.getElementById('teamModal').style.display = 'none', 300);
            
            // Start Game Loop
            fetchState();
            fetchMembers(); // Load invite list immediately
            setInterval(fetchState, 2000); // Live grid
            setInterval(fetchMembers, 10000); // Live members
        }

        // --- 3. CANVAS INTERACTION (TOUCH & DRAG) ---
        container.addEventListener('touchstart', dragStart);
        container.addEventListener('touchmove', drag);
        container.addEventListener('touchend', dragEnd);
        
        container.addEventListener('mousedown', dragStart);
        container.addEventListener('mousemove', drag);
        container.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            if (e.target !== canvas && e.target !== container) return;
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            currentX = clientX - startX;
            currentY = clientY - startY;

            setTranslate(translateX + currentX, translateY + currentY);
        }

        function dragEnd() {
            isDragging = false;
            translateX += currentX;
            translateY += currentY;
            currentX = 0; currentY = 0;
        }

        function setTranslate(xPos, yPos) {
            canvas.style.transform = `translate(${xPos}px, ${yPos}px)`;
        }

        // --- 4. PIXEL PLACING ---
        // Separate Click Listener to distinguish from Drag
        let clickStartTime;
        canvas.addEventListener('touchstart', () => clickStartTime = new Date().getTime());
        canvas.addEventListener('touchend', (e) => {
            if(new Date().getTime() - clickStartTime < 200) handleTap(e.changedTouches[0]);
        });
        canvas.addEventListener('click', (e) => handleTap(e));

        async function handleTap(e) {
            if(cooldown > 0) return;

            // Calculate Grid Coordinate
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

            if(x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                // Optimistic UI Update
                ctx.fillStyle = myTeam === 'neon' ? '#00f3ff' : '#ff00de';
                ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                
                // Server Call
                await fetch('/api/pixelwar/place', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({x, y, team: myTeam})
                });

                startCooldown(5);
                fetchState();
            }
        }

        function startCooldown(sec) {
            cooldown = sec;
            const toast = document.getElementById('cooldown-toast');
            const timer = document.getElementById('timer');
            toast.style.display = 'block';

            let int = setInterval(() => {
                cooldown -= 0.1;
                timer.innerText = cooldown.toFixed(1);
                if(cooldown <= 0) {
                    clearInterval(int);
                    toast.style.display = 'none';
                }
            }, 100);
        }

        // --- 5. API SYNC ---
        async function fetchState() {
            try {
                const res = await fetch('/api/pixelwar/state');
                const data = await res.json();
                
                // Draw Grid
                let neon = 0, cyber = 0;
                for(let y=0; y<GRID_SIZE; y++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        let c = data.grid[y][x];
                        if(c === '#00f3ff') neon++;
                        if(c === '#ff00de') cyber++;
                        ctx.fillStyle = c;
                        ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                        ctx.strokeStyle = '#222'; ctx.lineWidth = 0.5;
                        ctx.strokeRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                    }
                }
                document.getElementById('score-neon').innerText = neon;
                document.getElementById('score-cyber').innerText = cyber;

                // Update Logs
                document.getElementById('logs-list').innerHTML = data.history.map(l => 
                    `<div style="padding:5px 0; border-bottom:1px solid #222;">${l}</div>`
                ).join('');

            } catch(e) {}
        }

        // --- 6. INVITE SYSTEM ---
        async function fetchMembers() {
            const container = document.getElementById('agents-list');
            try {
                const res = await fetch('/api/pixelwar/members');
                const members = await res.json();
                
                if(!members.length) {
                    container.innerHTML = `<div style="text-align:center; padding:20px; color:#444;">NO ACTIVE AGENTS</div>`;
                    return;
                }

                container.innerHTML = members.map(m => `
                    <div class="agent-card">
                        <div class="agent-info">
                            <img src="${m.avatar}" class="agent-avatar">
                            <div>
                                <div class="agent-name">${m.name}</div>
                                <div class="agent-status"><div class="status-dot"></div> ONLINE</div>
                            </div>
                        </div>
                        <button class="btn-invite" onclick="sendInvite('${m.id}', this)">RECRUIT</button>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function sendInvite(id, btn) {
            btn.innerText = "SENDING...";
            btn.style.color = "white";
            
            await fetch('/api/pixelwar/invite', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_id: id})
            });

            btn.innerText = "SENT";
            btn.style.borderColor = "#0f0";
            btn.style.color = "#0f0";
            setTimeout(() => {
                btn.innerText = "RECRUIT";
                btn.style.borderColor = "var(--neon-blue)";
                btn.style.color = "var(--neon-blue)";
            }, 3000);
        }

        // --- 7. DRAWER LOGIC ---
        function openDrawer(id) {
            closeDrawers();
            document.getElementById('drawer-'+id).classList.add('open');
            // Highlight nav item
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function closeDrawers() {
            document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector('.nav-item:first-child').classList.add('active'); // Default to Map
        }

    </script>
</body>
</html>
