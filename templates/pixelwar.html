<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Pixel War: Global Conflict</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. GLOBAL VARIABLES & RESET --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --neon-red: #ff2a2a;
            --neon-green: #00ff9d;
            --gold: #ffd700;
            --bg-dark: #050508;
            --glass-panel: rgba(12, 12, 18, 0.92);
            --border-glow: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
        }

        /* --- 2. BACKGROUND FX LAYER --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0.5;
        }

        /* --- 3. GAME CONTAINER (MAP) --- */
        #game-wrapper {
            flex: 1; position: relative; overflow: hidden; z-index: 5;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
            touch-action: none;
            background-color: #08080a; /* Base dark color */
            
            /* Background Grid Effect */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #pixel-canvas {
            position: absolute; left: 0; top: 0;
            image-rendering: pixelated; /* Sharp pixels */
            /* MAP VISIBILITY FIX: Glow around the map */
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1), 0 0 80px rgba(0,0,0,0.8);
            background-color: #111116; /* Map specific background */
        }

        /* --- 4. HUD: TOP BAR (With Reset Button) --- */
        .hud-top {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 20; background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, transparent 100%);
            pointer-events: none; /* Let clicks pass through empty space */
        }

        .hud-left-group {
            display: flex; gap: 15px; pointer-events: auto;
        }

        .btn-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glow);
            color: white; display: flex; align-items: center; justify-content: center;
            text-decoration: none; backdrop-filter: blur(10px); cursor: pointer;
            transition: 0.3s;
        }
        .btn-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        /* NEW RESET BUTTON STYLE */
        .btn-reset {
            border-color: var(--neon-red); color: var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
        }
        .btn-reset:active { background: var(--neon-red); color: white; }

        .score-board {
            pointer-events: auto;
            display: flex; gap: 15px; background: rgba(0,0,0,0.7);
            padding: 10px 20px; border-radius: 30px; border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .score-item { display: flex; align-items: center; gap: 8px; font-family: 'Orbitron'; font-size: 14px; font-weight: bold; }
        .si-neon { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .si-cyber { color: var(--neon-pink); text-shadow: 0 0 10px rgba(188, 19, 254, 0.4); }

        /* --- 5. HUD: BOTTOM BAR --- */
        .hud-bottom {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            padding: 0 20px; display: flex; justify-content: center; align-items: flex-end;
            z-index: 20; pointer-events: none;
        }

        .action-dock {
            pointer-events: auto;
            background: var(--glass-panel); border: 1px solid var(--border-glow);
            padding: 12px 25px; border-radius: 25px; display: flex; gap: 25px;
            backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            align-items: center;
        }

        .dock-btn {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #888; font-size: 10px; cursor: pointer; transition: 0.3s;
            min-width: 50px;
        }
        .dock-btn i { font-size: 22px; margin-bottom: 2px; }
        .dock-btn.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .dock-btn.active i { transform: scale(1.1); }

        .btn-recruit-main {
            background: var(--neon-blue); color: black; border: none;
            width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-top: -35px; box-shadow: 0 0 25px var(--neon-blue);
            cursor: pointer; animation: pulseBtn 2s infinite; position: relative;
        }
        .btn-recruit-main::after {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--neon-blue); animation: ripple 1.5s infinite;
        }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 15px var(--neon-blue); } 50% { box-shadow: 0 0 35px var(--neon-blue); } 100% { box-shadow: 0 0 15px var(--neon-blue); } }
        @keyframes ripple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* --- 6. COOLDOWN OVERLAY (Updated Visibility) --- */
        .cooldown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 5, 5, 0.95); border: 2px solid var(--neon-red);
            padding: 20px 40px; border-radius: 15px; text-align: center;
            display: none; z-index: 50; pointer-events: none;
            box-shadow: 0 0 60px rgba(255, 42, 42, 0.5);
            backdrop-filter: blur(5px);
        }
        .cd-text { font-family: 'Orbitron'; color: var(--neon-red); font-size: 12px; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; }
        .cd-timer { font-family: 'Orbitron'; color: white; font-size: 35px; font-weight: 900; text-shadow: 0 0 15px rgba(255,255,255,0.5); }

        /* --- 7. MODAL SHEETS (RECRUIT & LOGS) --- */
        .modal-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75%;
            background: #0f0f15; border-top: 2px solid var(--neon-blue);
            border-radius: 30px 30px 0 0; z-index: 100;
            transform: translateY(110%); transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column;
            box-shadow: 0 -10px 100px rgba(0,0,0,0.9);
        }
        .modal-sheet.active { transform: translateY(0); }

        .sheet-header {
            padding: 25px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);
        }
        .sheet-title { font-family: 'Orbitron'; font-size: 18px; color: white; letter-spacing: 1px; }
        .sheet-close { color: #666; font-size: 24px; cursor: pointer; padding: 5px; transition: 0.3s; }
        .sheet-close:hover { color: white; transform: rotate(90deg); }

        .sheet-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* AGENT CARD STYLE */
        .agent-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; border-radius: 15px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .agent-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        
        .agent-info { display: flex; align-items: center; gap: 15px; }
        .agent-avatar { width: 45px; height: 45px; border-radius: 12px; border: 2px solid #333; }
        .agent-name { font-weight: bold; font-size: 15px; color: #fff; font-family: 'Orbitron'; }
        .agent-id { font-size: 10px; color: #666; font-family: 'Share Tech Mono'; margin-top: 2px; }
        
        .btn-invite-action {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 18px; border-radius: 25px; font-family: 'Orbitron'; font-size: 11px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-invite-action:active { background: var(--neon-blue); color: black; transform: scale(0.95); }

        /* LOG ENTRY STYLE */
        .log-entry {
            font-family: 'Share Tech Mono'; font-size: 12px; color: #aaa;
            padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 10px;
        }
        .log-icon { color: var(--gold); font-size: 14px; }

        /* --- 8. TEAM SELECTION SCREEN (FULLSCREEN) --- */
        .team-select-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .ts-title { font-family: 'Orbitron'; font-size: 26px; margin-bottom: 50px; letter-spacing: 3px; text-shadow: 0 0 20px white; }
        
        .ts-card {
            width: 280px; padding: 25px; margin: 15px; border-radius: 20px;
            background: rgba(255,255,255,0.02); border: 1px solid #333;
            display: flex; align-items: center; gap: 20px; cursor: pointer;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .ts-card:active { transform: scale(0.95); }
        .ts-card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; }
        
        .ts-neon { border-color: var(--neon-blue); box-shadow: 0 0 30px rgba(0, 243, 255, 0.15); }
        .ts-neon::before { background: var(--neon-blue); }
        
        .ts-cyber { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(188, 19, 254, 0.15); }
        .ts-cyber::before { background: var(--neon-pink); }

        /* --- 9. JOIN NOTIFICATION (TOAST) --- */
        .join-notification {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 20, 10, 0.95); border: 1px solid var(--neon-green);
            padding: 12px 25px; border-radius: 50px; width: 90%; max-width: 400px;
            display: flex; align-items: center; gap: 15px; z-index: 90;
            box-shadow: 0 5px 30px rgba(0, 255, 157, 0.3); opacity: 0;
            pointer-events: none; transition: 0.5s;
        }
        .jn-icon { color: var(--neon-green); font-size: 22px; animation: spinIcon 2s infinite linear; }
        @keyframes spinIcon { 100% { transform: rotate(360deg); } }

        /* --- 10. FLOATING MONEY ANIMATION --- */
        .floating-money {
            position: fixed; font-family: 'Orbitron'; font-weight: 900; font-size: 28px;
            color: var(--gold); text-shadow: 0 0 20px var(--gold);
            pointer-events: none; z-index: 1000; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp { 
            0% { opacity: 0; transform: translateY(10px) scale(0.5); } 
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); } 
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="join-alert-area"></div>

    <div class="team-select-screen" id="teamModal">
        <div class="ts-title">CHOOSE FACTION</div>
        
        <div class="ts-card ts-neon" onclick="selectTeam('neon')">
            <i class="fas fa-cube" style="font-size:35px; color:var(--neon-blue)"></i>
            <div>
                <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-blue)">NEON</h3>
                <span style="font-size:10px; color:#888;">THE ARCHITECTS</span>
            </div>
        </div>

        <div class="ts-card ts-cyber" onclick="selectTeam('cyber')">
            <i class="fas fa-bolt" style="font-size:35px; color:var(--neon-pink)"></i>
            <div>
                <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-pink)">CYBER</h3>
                <span style="font-size:10px; color:#888;">THE HACKERS</span>
            </div>
        </div>
    </div>

    <div class="hud-top">
        <div class="hud-left-group">
            <a href="/" class="btn-icon"><i class="fas fa-chevron-left"></i></a>
            <div class="btn-icon btn-reset" onclick="resetGame()">
                <i class="fas fa-power-off"></i>
            </div>
        </div>

        <div class="score-board">
            <div class="score-item si-neon">
                <i class="fas fa-cube"></i> <span id="score-neon">0</span>
            </div>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.1)"></div>
            <div class="score-item si-cyber">
                <i class="fas fa-bolt"></i> <span id="score-cyber">0</span>
            </div>
        </div>
    </div>

    <div class="cooldown-overlay" id="cd-overlay">
        <div class="cd-text">WEAPON RECHARGING</div>
        <div class="cd-timer"><span id="cd-val">5.0</span>s</div>
    </div>

    <div id="game-wrapper">
        <canvas id="pixel-canvas"></canvas>
    </div>

    <div class="hud-bottom">
        <div class="action-dock">
            <div class="dock-btn active" onclick="centerMap()">
                <i class="fas fa-crosshairs"></i>
                <span>CENTER</span>
            </div>
            
            <button class="btn-recruit-main" onclick="toggleSheet('recruitSheet', true)">
                <i class="fas fa-satellite-dish"></i>
            </button>

            <div class="dock-btn" onclick="toggleSheet('logsSheet', true)">
                <i class="fas fa-list-ul"></i>
                <span>LOGS</span>
            </div>
        </div>
    </div>

    <div class="modal-sheet" id="recruitSheet">
        <div class="sheet-header">
            <div class="sheet-title">ACTIVE OPERATORS</div>
            <div class="sheet-close" onclick="toggleSheet('recruitSheet', false)"><i class="fas fa-times"></i></div>
        </div>
        <div class="sheet-content" id="agents-list">
            <div style="text-align:center; padding:40px; color:#555;">
                <i class="fas fa-radar fa-spin" style="font-size:30px; margin-bottom:15px; opacity:0.5;"></i><br>
                SCANNING NETWORK...
            </div>
        </div>
    </div>

    <div class="modal-sheet" id="logsSheet" style="border-top-color: var(--gold);">
        <div class="sheet-header">
            <div class="sheet-title" style="color:var(--gold)">BATTLE LOGS</div>
            <div class="sheet-close" onclick="toggleSheet('logsSheet', false)"><i class="fas fa-times"></i></div>
        </div>
        <div class="sheet-content" id="logs-list">
            <div style="text-align:center; padding:40px; color:#555;">
                FETCHING DATA...
            </div>
        </div>
    </div>

    <script>
        // --- GAME CONFIGURATION ---
        const GRID_SIZE = {{ grid_size }};
        const PIXEL_SIZE = 30; // Increased size for visibility
        let myTeam = null;
        let cooldown = 0;
        let knownPlayers = new Set();
        let isProcessing = false; // LOCK VARIABLE FOR SPAM FIX

        // Canvas Setup
        const wrapper = document.getElementById('game-wrapper');
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GRID_SIZE * PIXEL_SIZE;
        canvas.height = GRID_SIZE * PIXEL_SIZE;

        // Pan/Zoom Vars
        let translateX = 0, translateY = 0;
        let isDragging = false;
        let startX, startY, currentX = 0, currentY = 0;

        // --- 1. INITIALIZATION & RESET ---
        function centerMap() {
            translateX = (wrapper.offsetWidth - canvas.width) / 2;
            translateY = (wrapper.offsetHeight - canvas.height) / 2;
            updateTransform();
        }
        centerMap();

        function resetGame() {
            if(confirm("SYSTEM RESET: Logout and clear data?")) {
                // Assuming logout route exists or redirect to home
                window.location.href = '/'; 
            }
        }

        // --- 2. BACKGROUND ANIMATION ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width, height, particles = [];

        function resizeBg() { width = bgCanvas.width = window.innerWidth; height = bgCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeBg); resizeBg();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.1;
                this.alpha = Math.random();
            }
            update() {
                this.y -= this.speed; if (this.y < 0) this.reset();
                this.alpha = Math.random() * 0.5 + 0.3;
            }
            draw() {
                bgCtx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); bgCtx.fill();
            }
        }
        for(let i=0; i<60; i++) particles.push(new Star());
        function animateBg() {
            bgCtx.clearRect(0,0,width,height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();


        // --- 3. TEAM LOGIC ---
        function selectTeam(team) {
            myTeam = team;
            document.getElementById('teamModal').style.opacity = '0';
            setTimeout(() => document.getElementById('teamModal').style.display = 'none', 300);
            
            // Start Systems
            fetchState();
            fetchMembers();
            setInterval(fetchState, 2000); 
            setInterval(fetchMembers, 10000);
        }


        // --- 4. TOUCH & DRAG LOGIC ---
        wrapper.addEventListener('touchstart', e => dragStart(e.touches[0]));
        wrapper.addEventListener('mousedown', e => dragStart(e));
        
        window.addEventListener('touchmove', e => drag(e.touches[0]));
        window.addEventListener('mousemove', e => drag(e));
        
        window.addEventListener('touchend', dragEnd);
        window.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            if(e.target !== canvas && e.target !== wrapper) return;
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
        }

        function drag(e) {
            if(!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            setTranslate(translateX + currentX, translateY + currentY);
        }

        function dragEnd() {
            isDragging = false;
            translateX += currentX; translateY += currentY;
            currentX = 0; currentY = 0;
        }

        function setTranslate(x, y) {
            canvas.style.transform = `translate(${x}px, ${y}px)`;
        }
        function updateTransform() { setTranslate(translateX, translateY); }


        // --- 5. PLACING PIXEL (WITH SPAM FIX & MONEY) ---
        let tapTime = 0;
        wrapper.addEventListener('mousedown', () => tapTime = Date.now());
        wrapper.addEventListener('mouseup', (e) => {
            if(Date.now() - tapTime < 200 && currentX === 0 && currentY === 0) handleInput(e);
        });

        async function handleInput(e) {
            // SPAM FIX: Check if already processing or in cooldown
            if(cooldown > 0 || isProcessing) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

            if(x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                
                isProcessing = true; // LOCK INPUT

                // Optimistic Update
                ctx.fillStyle = myTeam === 'neon' ? '#00f3ff' : '#bc13fe';
                ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                drawCellOutline(x, y);

                try {
                    // Server Request
                    const res = await fetch('/api/pixelwar/place', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({x, y, team: myTeam})
                    });
                    const data = await res.json();

                    // 💰 MONEY ANIMATION
                    if(data.status === 'success') {
                        showFloatingMoney(e.clientX, e.clientY, data.reward);
                        triggerCooldown(5); // Start cooldown only on success
                    } else {
                        // If error (e.g. server side cooldown), handle gracefully
                        console.warn(data.msg);
                        if(data.msg.includes("Cooling")) triggerCooldown(5);
                    }
                } catch(err) {
                    console.error(err);
                } finally {
                    isProcessing = false; // UNLOCK INPUT
                    fetchState();
                }
            }
        }

        function showFloatingMoney(x, y, amount) {
            const el = document.createElement('div');
            el.className = 'floating-money';
            el.innerText = `+$${amount}`;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function triggerCooldown(sec) {
            cooldown = sec;
            const overlay = document.getElementById('cd-overlay');
            const val = document.getElementById('cd-val');
            overlay.style.display = 'block';

            let int = setInterval(() => {
                cooldown -= 0.1;
                val.innerText = cooldown.toFixed(1);
                if(cooldown <= 0) {
                    clearInterval(int);
                    overlay.style.display = 'none';
                }
            }, 100);
        }


        // --- 6. STATE, LOGS (FIXED) & MEMBERS ---
        async function fetchState() {
            try {
                const res = await fetch('/api/pixelwar/state');
                const data = await res.json();
                
                let n=0, c=0;
                
                // Clear Canvas
                ctx.clearRect(0,0,canvas.width, canvas.height);

                for(let y=0; y<GRID_SIZE; y++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        let color = data.grid[y][x];
                        
                        // DRAW GRID
                        ctx.fillStyle = color === '#111' ? 'rgba(0,0,0,0)' : color; 
                        ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                        
                        // VISIBILITY FIX: Always draw outlines
                        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; 
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);

                        if(color==='#00f3ff') n++; if(color==='#ff00de') c++;
                    }
                }
                document.getElementById('score-neon').innerText = n;
                document.getElementById('score-cyber').innerText = c;

                // UPDATE LOGS
                const logDiv = document.getElementById('logs-list');
                if(data.history && data.history.length > 0) {
                    logDiv.innerHTML = data.history.map(l => `
                        <div class="log-entry">
                            <i class="fas fa-terminal log-icon"></i> ${l}
                        </div>
                    `).reverse().join('');
                } else {
                    logDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#444">NO ACTIVITY RECORDED</div>';
                }

            } catch(e){}
        }

        function drawCellOutline(x, y) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; 
            ctx.strokeRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        async function fetchMembers() {
            try {
                const res = await fetch('/api/pixelwar/members');
                const members = await res.json();
                const list = document.getElementById('agents-list');

                if(members.length === 0) {
                    list.innerHTML = `<div style="text-align:center; padding:30px; color:#555;">NO SIGNALS DETECTED</div>`;
                    return;
                }

                let html = '';
                members.forEach(m => {
                    if(!knownPlayers.has(m.id)) {
                        knownPlayers.add(m.id);
                        if(knownPlayers.size > 1) showJoinToast(m.name, m.id);
                    }

                    html += `
                    <div class="agent-card">
                        <div class="agent-info">
                            <img src="${m.avatar}" class="agent-avatar">
                            <div>
                                <div class="agent-name">${m.name}</div>
                                <div class="agent-id">ID: ${m.id}</div>
                            </div>
                        </div>
                        <button class="btn-invite-action" onclick="sendInvite('${m.id}', this)">RECRUIT</button>
                    </div>`;
                });
                list.innerHTML = html;
            } catch(e){}
        }

        function showJoinToast(name, id) {
            const area = document.getElementById('join-alert-area');
            const toast = document.createElement('div');
            toast.className = 'join-notification';
            toast.innerHTML = `
                <div class="jn-icon"><i class="fas fa-wifi"></i></div>
                <div>
                    <div style="font-weight:bold; color:var(--neon-green); font-size:14px;">${name}</div>
                    <div style="font-size:10px; color:#ccc;">HAS ENTERED THE BATTLEFIELD</div>
                </div>
            `;
            area.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 100);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        async function sendInvite(id, btn) {
            btn.innerText = "...";
            await fetch('/api/pixelwar/invite', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_id: id})
            });
            btn.innerText = "SENT";
            btn.style.borderColor = "#0f0";
            btn.style.color = "#0f0";
        }

        // --- 7. UI TOGGLES ---
        function toggleSheet(id, show) {
            document.querySelectorAll('.modal-sheet').forEach(s => s.classList.remove('active'));
            if(show) {
                document.getElementById(id).classList.add('active');
                if(id === 'recruitSheet') fetchMembers();
                if(id === 'logsSheet') fetchState();
            }
        }

    </script>
</body>
</html>
