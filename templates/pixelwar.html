<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Pixel War: Global Conflict</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --neon-alert: #ff2a2a;
            --gold: #ffd700;
            --bg-dark: #050508;
            --glass-panel: rgba(10, 15, 20, 0.9);
            --border-glow: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
        }

        /* --- 1. BACKGROUND FX LAYER --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0.6;
        }

        /* --- 2. GAME CONTAINER (Fixed Visibility) --- */
        #game-wrapper {
            flex: 1; position: relative; overflow: hidden; z-index: 5;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            touch-action: none;
            /* Background grid for empty space */
            background-image: 
                linear-gradient(#1a1a20 1px, transparent 1px),
                linear-gradient(90deg, #1a1a20 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #pixel-canvas {
            position: absolute; left: 0; top: 0;
            image-rendering: pixelated; 
            /* CANVAS VISIBILITY FIX: Separate background and shadow */
            background-color: #111116; 
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1), 0 0 50px rgba(0,0,0,0.8);
        }

        /* --- 3. HUD: TOP BAR --- */
        .hud-top {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 20; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .back-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glow);
            color: white; display: flex; align-items: center; justify-content: center;
            text-decoration: none; backdrop-filter: blur(10px);
        }

        .score-board {
            display: flex; gap: 15px; background: rgba(0,0,0,0.6);
            padding: 8px 16px; border-radius: 30px; border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
        }
        .score-item { display: flex; align-items: center; gap: 8px; font-family: 'Orbitron'; font-size: 14px; font-weight: bold; }
        .si-neon { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .si-cyber { color: var(--neon-pink); text-shadow: 0 0 10px rgba(188, 19, 254, 0.4); }

        /* --- 4. HUD: BOTTOM BAR --- */
        .hud-bottom {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            padding: 0 20px; display: flex; justify-content: center; align-items: flex-end;
            z-index: 20; pointer-events: none;
        }

        .action-dock {
            pointer-events: auto;
            background: var(--glass-panel); border: 1px solid var(--border-glow);
            padding: 10px 20px; border-radius: 20px; display: flex; gap: 20px;
            backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dock-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #888; font-size: 10px; cursor: pointer; transition: 0.3s;
            min-width: 50px;
        }
        .dock-btn i { font-size: 20px; margin-bottom: 2px; }
        .dock-btn.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .dock-btn.active i { transform: scale(1.1); }

        .btn-recruit-main {
            background: var(--neon-blue); color: black; border: none;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-top: -30px; box-shadow: 0 0 20px var(--neon-blue);
            cursor: pointer; animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 10px var(--neon-blue); } 50% { box-shadow: 0 0 30px var(--neon-blue); } 100% { box-shadow: 0 0 10px var(--neon-blue); } }

        /* --- 5. COOLDOWN OVERLAY --- */
        .cooldown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 0, 0, 0.9); border: 2px solid var(--neon-alert);
            padding: 15px 30px; border-radius: 10px; text-align: center;
            display: none; z-index: 50; pointer-events: none;
            box-shadow: 0 0 50px rgba(255, 42, 42, 0.4);
        }
        .cd-text { font-family: 'Orbitron'; color: var(--neon-alert); font-size: 12px; letter-spacing: 2px; margin-bottom: 5px; }
        .cd-timer { font-family: 'Orbitron'; color: white; font-size: 30px; font-weight: bold; text-shadow: 0 0 10px white; }

        /* --- 6. MODAL SHEETS (RECRUIT & LOGS) --- */
        .modal-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70%;
            background: #0f0f15; border-top: 2px solid var(--neon-blue);
            border-radius: 25px 25px 0 0; z-index: 100;
            transform: translateY(110%); transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column;
            box-shadow: 0 -10px 100px rgba(0,0,0,0.8);
        }
        .modal-sheet.active { transform: translateY(0); }

        .sheet-header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sheet-title { font-family: 'Orbitron'; font-size: 18px; color: white; }
        .sheet-close { color: #666; font-size: 20px; cursor: pointer; padding: 5px; }

        .sheet-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* AGENT CARD */
        .agent-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .agent-info { display: flex; align-items: center; gap: 12px; }
        .agent-avatar { width: 42px; height: 42px; border-radius: 10px; border: 1px solid #444; }
        .agent-name { font-weight: bold; font-size: 14px; color: #eee; }
        .agent-id { font-size: 10px; color: #666; font-family: 'Share Tech Mono'; }
        
        .btn-invite-action {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 16px; border-radius: 20px; font-family: 'Orbitron'; font-size: 10px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-invite-action:active { background: var(--neon-blue); color: black; }

        /* LOG ENTRY STYLE */
        .log-entry {
            font-family: 'Share Tech Mono'; font-size: 12px; color: #aaa;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; gap: 10px;
        }
        .log-time { color: #555; font-size: 10px; }

        /* --- 7. TEAM SELECTION (FULLSCREEN) --- */
        .team-select-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .ts-title { font-family: 'Orbitron'; font-size: 24px; margin-bottom: 40px; letter-spacing: 2px; }
        
        .ts-card {
            width: 280px; padding: 25px; margin: 15px; border-radius: 20px;
            background: rgba(255,255,255,0.02); border: 1px solid #333;
            display: flex; align-items: center; gap: 20px; cursor: pointer;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .ts-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .ts-neon { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }
        .ts-neon::before { background: var(--neon-blue); }
        .ts-cyber { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(188, 19, 254, 0.1); }
        .ts-cyber::before { background: var(--neon-pink); }

        /* --- 8. JOIN TOAST --- */
        .join-notification {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 255, 100, 0.1); border: 1px solid #0f0;
            padding: 10px 20px; border-radius: 8px; width: 90%; max-width: 350px;
            display: flex; align-items: center; gap: 12px; z-index: 90;
            box-shadow: 0 5px 20px rgba(0, 255, 0, 0.2); opacity: 0;
            pointer-events: none; transition: 0.5s;
        }
        .jn-icon { color: #0f0; font-size: 20px; }

        /* --- 9. FLOATING MONEY ANIMATION --- */
        .floating-money {
            position: fixed; font-family: 'Orbitron'; font-weight: 900; font-size: 24px;
            color: var(--gold); text-shadow: 0 0 15px var(--gold);
            pointer-events: none; z-index: 1000; animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="join-alert-area"></div>

    <div class="team-select-screen" id="teamModal">
        <div class="ts-title">CHOOSE FACTION</div>
        
        <div class="ts-card ts-neon" onclick="selectTeam('neon')">
            <i class="fas fa-cube" style="font-size:30px; color:var(--neon-blue)"></i>
            <div>
                <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-blue)">NEON</h3>
                <span style="font-size:10px; color:#888;">THE ARCHITECTS</span>
            </div>
        </div>

        <div class="ts-card ts-cyber" onclick="selectTeam('cyber')">
            <i class="fas fa-bolt" style="font-size:30px; color:var(--neon-pink)"></i>
            <div>
                <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-pink)">CYBER</h3>
                <span style="font-size:10px; color:#888;">THE HACKERS</span>
            </div>
        </div>
    </div>

    <div class="hud-top">
        <a href="/" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="score-board">
            <div class="score-item si-neon">
                <i class="fas fa-cube"></i> <span id="score-neon">0</span>
            </div>
            <div style="width:1px; height:15px; background:rgba(255,255,255,0.2)"></div>
            <div class="score-item si-cyber">
                <i class="fas fa-bolt"></i> <span id="score-cyber">0</span>
            </div>
        </div>
    </div>

    <div class="cooldown-overlay" id="cd-overlay">
        <div class="cd-text">WEAPON RECHARGING</div>
        <div class="cd-timer"><span id="cd-val">5.0</span>s</div>
    </div>

    <div id="game-wrapper">
        <canvas id="pixel-canvas"></canvas>
    </div>

    <div class="hud-bottom">
        <div class="action-dock">
            <div class="dock-btn active" onclick="centerMap()">
                <i class="fas fa-crosshairs"></i>
                <span>CENTER</span>
            </div>
            
            <button class="btn-recruit-main" onclick="toggleSheet('recruitSheet', true)">
                <i class="fas fa-satellite-dish"></i>
            </button>

            <div class="dock-btn" onclick="toggleSheet('logsSheet', true)">
                <i class="fas fa-list-ul"></i>
                <span>LOGS</span>
            </div>
        </div>
    </div>

    <div class="modal-sheet" id="recruitSheet">
        <div class="sheet-header">
            <div class="sheet-title">ACTIVE OPERATORS</div>
            <div class="sheet-close" onclick="toggleSheet('recruitSheet', false)"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="sheet-content" id="agents-list">
            <div style="text-align:center; padding:40px; color:#555;">
                <i class="fas fa-radar fa-spin"></i><br><br>SCANNING NETWORK...
            </div>
        </div>
    </div>

    <div class="modal-sheet" id="logsSheet" style="border-top-color: #ffd700;">
        <div class="sheet-header">
            <div class="sheet-title" style="color:#ffd700">WAR LOGS</div>
            <div class="sheet-close" onclick="toggleSheet('logsSheet', false)"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="sheet-content" id="logs-list">
            <div style="text-align:center; padding:40px; color:#555;">
                FETCHING DATA...
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GRID_SIZE = {{ grid_size }};
        const PIXEL_SIZE = 25; 
        let myTeam = null;
        let cooldown = 0;
        let knownPlayers = new Set(); 

        // Canvas Setup
        const wrapper = document.getElementById('game-wrapper');
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GRID_SIZE * PIXEL_SIZE;
        canvas.height = GRID_SIZE * PIXEL_SIZE;

        // Pan/Zoom Vars
        let translateX = 0, translateY = 0;
        let isDragging = false;
        let startX, startY, currentX = 0, currentY = 0;

        // --- 1. INITIALIZATION ---
        function centerMap() {
            translateX = (wrapper.offsetWidth - canvas.width) / 2;
            translateY = (wrapper.offsetHeight - canvas.height) / 2;
            updateTransform();
        }
        centerMap();

        // --- 2. BACKGROUND ANIMATION ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width, height, particles = [];

        function resizeBg() { width = bgCanvas.width = window.innerWidth; height = bgCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeBg); resizeBg();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.1;
                this.alpha = Math.random();
            }
            update() {
                this.y -= this.speed; if (this.y < 0) this.reset();
                this.alpha = Math.random() * 0.5 + 0.3;
            }
            draw() {
                bgCtx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); bgCtx.fill();
            }
        }
        for(let i=0; i<60; i++) particles.push(new Star());
        function animateBg() {
            bgCtx.clearRect(0,0,width,height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();


        // --- 3. TEAM LOGIC ---
        function selectTeam(team) {
            myTeam = team;
            document.getElementById('teamModal').style.opacity = '0';
            setTimeout(() => document.getElementById('teamModal').style.display = 'none', 300);
            
            fetchState();
            fetchMembers();
            setInterval(fetchState, 2000); 
            setInterval(fetchMembers, 10000);
        }


        // --- 4. TOUCH & DRAG LOGIC ---
        wrapper.addEventListener('touchstart', e => dragStart(e.touches[0]));
        wrapper.addEventListener('mousedown', e => dragStart(e));
        
        window.addEventListener('touchmove', e => drag(e.touches[0]));
        window.addEventListener('mousemove', e => drag(e));
        
        window.addEventListener('touchend', dragEnd);
        window.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            if(e.target !== canvas && e.target !== wrapper) return;
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
        }

        function drag(e) {
            if(!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            setTranslate(translateX + currentX, translateY + currentY);
        }

        function dragEnd() {
            isDragging = false;
            translateX += currentX; translateY += currentY;
            currentX = 0; currentY = 0;
        }

        function setTranslate(x, y) {
            canvas.style.transform = `translate(${x}px, ${y}px)`;
        }
        function updateTransform() { setTranslate(translateX, translateY); }


        // --- 5. PLACING PIXEL (TAP) ---
        let tapTime = 0;
        wrapper.addEventListener('mousedown', () => tapTime = Date.now());
        wrapper.addEventListener('mouseup', (e) => {
            if(Date.now() - tapTime < 200 && currentX === 0 && currentY === 0) handleInput(e);
        });

        async function handleInput(e) {
            if(cooldown > 0) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

            if(x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                // Optimistic Update
                ctx.fillStyle = myTeam === 'neon' ? '#00f3ff' : '#bc13fe';
                ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                drawGridLines(x, y); // Redraw outline

                // Server Sync
                const res = await fetch('/api/pixelwar/place', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({x, y, team: myTeam})
                });
                const data = await res.json();

                // 💰 REWARD ANIMATION
                if(data.status === 'success') {
                    showFloatingMoney(e.clientX, e.clientY, data.reward);
                }

                triggerCooldown(5);
                fetchState();
            }
        }

        // --- MONEY ANIMATION ---
        function showFloatingMoney(x, y, amount) {
            const el = document.createElement('div');
            el.className = 'floating-money';
            el.innerText = `+$${amount}`;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function triggerCooldown(sec) {
            cooldown = sec;
            const overlay = document.getElementById('cd-overlay');
            const val = document.getElementById('cd-val');
            overlay.style.display = 'block';

            let int = setInterval(() => {
                cooldown -= 0.1;
                val.innerText = cooldown.toFixed(1);
                if(cooldown <= 0) {
                    clearInterval(int);
                    overlay.style.display = 'none';
                }
            }, 100);
        }


        // --- 6. STATE, LOGS & MEMBERS ---
        async function fetchState() {
            try {
                const res = await fetch('/api/pixelwar/state');
                const data = await res.json();
                
                let n=0, c=0;
                
                // Clear Canvas
                ctx.clearRect(0,0,canvas.width, canvas.height);

                for(let y=0; y<GRID_SIZE; y++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        let color = data.grid[y][x];
                        
                        // DRAW GRID BOXES
                        ctx.fillStyle = color === '#111' ? 'rgba(0,0,0,0)' : color; // Transparent if empty
                        ctx.fillRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                        
                        // DRAW OUTLINES (VISIBILITY FIX)
                        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; 
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);

                        if(color==='#00f3ff') n++; if(color==='#ff00de') c++;
                    }
                }
                document.getElementById('score-neon').innerText = n;
                document.getElementById('score-cyber').innerText = c;

                // UPDATE LOGS
                const logDiv = document.getElementById('logs-list');
                if(data.history && data.history.length > 0) {
                    logDiv.innerHTML = data.history.map(l => `
                        <div class="log-entry">
                            <span style="color:#0f0">></span> ${l}
                        </div>
                    `).reverse().join('');
                } else {
                    logDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#444">NO ACTIVITY</div>';
                }

            } catch(e){}
        }

        // Helper for single cell draw
        function drawGridLines(x, y) {
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; 
            ctx.strokeRect(x*PIXEL_SIZE, y*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        async function fetchMembers() {
            try {
                const res = await fetch('/api/pixelwar/members');
                const members = await res.json();
                const list = document.getElementById('agents-list');

                if(members.length === 0) {
                    list.innerHTML = `<div style="text-align:center; padding:30px; color:#555;">NO SIGNALS DETECTED</div>`;
                    return;
                }

                let html = '';
                members.forEach(m => {
                    if(!knownPlayers.has(m.id)) {
                        knownPlayers.add(m.id);
                        if(knownPlayers.size > 1) showJoinToast(m.name, m.id);
                    }

                    html += `
                    <div class="agent-card">
                        <div class="agent-info">
                            <img src="${m.avatar}" class="agent-avatar">
                            <div>
                                <div class="agent-name">${m.name}</div>
                                <div class="agent-id">ID: ${m.id}</div>
                            </div>
                        </div>
                        <button class="btn-invite-action" onclick="sendInvite('${m.id}', this)">RECRUIT</button>
                    </div>`;
                });
                list.innerHTML = html;
            } catch(e){}
        }

        function showJoinToast(name, id) {
            const area = document.getElementById('join-alert-area');
            const toast = document.createElement('div');
            toast.className = 'join-notification';
            toast.innerHTML = `
                <div class="jn-icon"><i class="fas fa-wifi"></i></div>
                <div>
                    <div style="font-weight:bold; color:#0f0; font-size:14px;">${name}</div>
                    <div style="font-size:10px; color:#aaa;">HAS ENTERED THE BATTLEFIELD</div>
                </div>
            `;
            area.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 100);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        async function sendInvite(id, btn) {
            btn.innerText = "...";
            await fetch('/api/pixelwar/invite', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_id: id})
            });
            btn.innerText = "SENT";
            btn.style.borderColor = "#0f0";
            btn.style.color = "#0f0";
        }

        // --- 7. UI TOGGLES ---
        function toggleSheet(id, show) {
            // Close all
            document.querySelectorAll('.modal-sheet').forEach(s => s.classList.remove('active'));
            
            if(show) {
                document.getElementById(id).classList.add('active');
                if(id === 'recruitSheet') fetchMembers();
                if(id === 'logsSheet') fetchState(); // Refresh logs
            }
        }

    </script>
</body>
</html>
