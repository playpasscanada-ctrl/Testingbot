<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game: Nightmare Level</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .neon-text { text-shadow: 0 0 10px #ff007f; color: #ff007f; }
        
        .candy-container {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #e6c275 20%, #cfaa4c 90%);
            border-radius: 50%;
            box-shadow: inset 0 0 40px #8b6c22, 0 0 20px rgba(230, 194, 117, 0.3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }

        svg { width: 300px; height: 300px; overflow: visible; transform: scale(1.1); }
        path {
            fill: none;
            stroke: #6b4c12; /* Deep pressed look */
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: crosshair;
        }
        
        /* Level 10 Special Look */
        .nightmare-mode path {
            stroke-width: 6 !important; /* Bahut patla rasta */
        }

        /* Needle */
        #needle {
            position: absolute; width: 4px; height: 70px;
            background: silver; pointer-events: none;
            transform: translate(-50%, -100%) rotate(-15deg);
            z-index: 50; display: none;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        #game-modal { display: none; }
        .cracked { background: url('https://i.imgur.com/3q1s7.png'); mix-blend-mode: multiply; opacity: 0.8; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <a href="/" class="absolute top-5 left-5 text-green-500 border border-green-500 px-3 py-1 hover:bg-green-500 hover:text-black">← BACK</a>
    <div class="absolute top-5 right-5 text-xl">WALLET: <span class="text-green-400">$<span id="balance">{{ "{:,}".format(balance) }}</span></span></div>

    <h1 class="text-5xl font-bold neon-text mb-2">DALGONA</h1>
    <p class="text-gray-400 mb-8">LEVEL 10 IS THE "NIGHTMARE TRIANGLE"</p>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 w-full max-w-4xl px-4">
        {% for id, lvl in levels.items() %}
        <div onclick="selectLevel({{id}}, '{{lvl.name}}', {{lvl.fee}})" 
             class="border border-gray-700 p-3 rounded hover:border-pink-500 cursor-pointer text-center bg-gray-900 transition hover:scale-105">
            <div class="text-xl font-bold {{ 'text-red-500' if id == 10 else 'text-white' }}">{{ lvl.name }}</div>
            <div class="text-xs text-gray-400">Prize: ${{ "{:,}".format(lvl.prize) }}</div>
            <div class="text-xs text-red-400">Fee: ${{ "{:,}".format(lvl.fee) }}</div>
        </div>
        {% endfor %}
    </div>

    <div id="game-modal" class="fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-50">
        <div id="timer" class="text-6xl font-mono text-white mb-6">00:00</div>
        
        <div class="candy-container" id="candy">
            <div id="crack-overlay" class="absolute inset-0 pointer-events-none"></div>
            <svg viewBox="0 0 100 100" id="svg-area">
                <path id="visual-path" d="" opacity="0.7" />
                <path id="logic-path" d="" stroke="transparent" stroke-width="12" 
                      onmouseenter="enterPath()" onmouseleave="leavePath()" />
            </svg>
        </div>

        <div id="msg" class="mt-8 text-2xl neon-text">CLICK SHAPE TO START</div>
        <button onclick="location.reload()" class="mt-4 text-gray-500 hover:text-white">EXIT</button>
    </div>

    <div id="needle"></div>

    <script>
        // SHAPES CONFIG
        const SHAPES = {
            'circle': 'M 50, 10 a 40,40 0 1,0 0,80 a 40,40 0 1,0 0,-80',
            'triangle': 'M 50,15 L 85,85 L 15,85 Z',
            'square': 'M 20,20 L 80,20 L 80,80 L 20,80 Z',
            'star': 'M 50,10 L 61,35 L 88,35 L 66,50 L 75,75 L 50,60 L 25,75 L 34,50 L 12,35 L 39,35 Z',
            'diamond': 'M 50,10 L 90,50 L 50,90 L 10,50 Z',
            'heart': 'M 50,30 C 60,10 90,20 90,50 C 90,80 50,90 50,90 C 50,90 10,80 10,50 C 10,20 40,10 50,30',
            'spade': 'M 50,20 C 60,5 90,20 90,50 C 90,70 50,90 50,90 L 50,95 L 60,95 L 40,95 L 50,95 L 50,90 C 50,90 10,70 10,50 C 10,20 40,5 50,20',
            'cloud': 'M 25,60 A 15,15 0 0,1 35,35 A 20,20 0 0,1 70,40 A 15,15 0 0,1 80,60 Q 80,70 65,70 L 30,70 Q 20,70 25,60',
            'bolt': 'M 55,10 L 35,50 L 55,50 L 45,90 L 65,50 L 45,50 Z',
            // NIGHTMARE TRIANGLE (Fractal Pattern)
            'nightmare': 'M 50,5 L 90,85 L 10,85 L 50,5 M 50,25 L 70,65 L 30,65 L 50,25 M 50,45 L 60,65 L 40,65 L 50,45'
        };

        let active = false, started = false, timeLeft = 0, timerInt;
        
        // Needle Movement
        document.addEventListener('mousemove', e => {
            const n = document.getElementById('needle');
            n.style.left = e.pageX + 'px';
            n.style.top = e.pageY + 'px';
        });

        function selectLevel(id, name, fee) {
            if(!confirm(`Pay $${fee} for Level ${id}?`)) return;
            fetch('/api/dalgona/start', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({level: id})
            }).then(r=>r.json()).then(d => {
                if(d.status==='error') alert(d.msg);
                else {
                    document.getElementById('balance').innerText = d.new_balance.toLocaleString();
                    startUI(d.shape, d.time_limit);
                }
            });
        }

        function startUI(shape, time) {
            document.getElementById('game-modal').style.display = 'flex';
            document.getElementById('needle').style.display = 'block';
            
            const path = SHAPES[shape];
            document.getElementById('visual-path').setAttribute('d', path);
            document.getElementById('logic-path').setAttribute('d', path);
            
            // Make Level 10 Harder
            if(shape === 'nightmare') {
                document.getElementById('candy').classList.add('nightmare-mode');
                document.getElementById('logic-path').style.strokeWidth = "6"; // Super thin
            } else {
                document.getElementById('candy').classList.remove('nightmare-mode');
                document.getElementById('logic-path').style.strokeWidth = "12";
            }

            timeLeft = time;
            document.getElementById('timer').innerText = timeLeft;
            active = false; started = false;
        }

        // Game Logic
        document.getElementById('svg-area').addEventListener('mousedown', () => {
            if(active) return;
            active = true;
            document.getElementById('msg').innerText = "TRACING...";
            document.getElementById('msg').style.color = "yellow";
            
            timerInt = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft<=0) gameOver("TIME UP!");
            }, 1000);
        });

        document.getElementById('svg-area').addEventListener('mouseup', () => {
            if(active && started) {
                active = false; clearInterval(timerInt);
                // Assume Win if released safely
                winGame();
            }
        });

        function enterPath() { if(active) started = true; document.getElementById('visual-path').style.stroke = "#0f0"; }
        
        function leavePath() { 
            if(active && started) gameOver("CRACK! YOU MISSED THE LINE"); 
        }

        function gameOver(reason) {
            active = false; clearInterval(timerInt);
            document.getElementById('crack-overlay').classList.add('cracked');
            document.getElementById('msg').innerText = reason;
            document.getElementById('msg').style.color = "red";
            setTimeout(() => location.reload(), 2000);
        }

        function winGame() {
            document.getElementById('msg').innerText = "PASSED!";
            document.getElementById('msg').style.color = "#0f0";
            fetch('/api/dalgona/finish', { method: 'POST' })
            .then(r=>r.json()).then(d => {
                if(d.status==='win') alert(`WON $${d.prize.toLocaleString()}`);
                location.reload();
            });
        }
    </script>
</body>
</html>
