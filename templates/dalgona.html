<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squid Game Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            touch-action: none;
            background: radial-gradient(circle at center, #1a1100 0%, #000000 100%);
        }

        /* COOKIE */
        .cookie {
            width: 85vw; height: 85vw;
            max-width: 400px; max-height: 400px;
            background: radial-gradient(circle, #eecfa1 30%, #cd853f 90%);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 30px rgba(139, 69, 19, 0.6), 0 10px 30px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
        }
        .cookie::before {
            content:''; position: absolute; inset:0; border-radius: 50%;
            background-image: url('https://www.transparenttextures.com/patterns/concrete-wall.png');
            opacity: 0.35; mix-blend-mode: multiply; pointer-events: none;
        }

        /* SVG */
        svg { width: 70%; height: 70%; overflow: visible; z-index: 10; }

        .path-base {
            fill: none; 
            stroke: #5c3a1a; 
            stroke-opacity: 0.9;
            stroke-width: 7;              /* thinner corners */
            stroke-linecap: butt;        /* sharp edges */
            stroke-linejoin: miter;      /* sharp corners */
            filter: drop-shadow(0px 1px 0px rgba(255,255,255,0.3));
        }

        .path-progress {
            fill: none; 
            stroke: #00ff41; 
            stroke-width: 4;
            stroke-linecap: butt;
            stroke-linejoin: miter;
            filter: drop-shadow(0 0 10px #00ff41);
            stroke-dasharray: 1000; 
            stroke-dashoffset: 1000;
            pointer-events: none;
        }

        .path-hitbox {
            fill: none; 
            stroke: transparent; 
            stroke-width: 32;
            stroke-linecap: round; 
            stroke-linejoin: round;
        }

        /* NEEDLE (REALISTIC) */
        #needle {
            position: fixed; 
            width: 6px; 
            height: 90px;
            background: linear-gradient(to bottom, #f5f5f5 0%, #bdbdbd 40%, #5a5a5a 100%);
            border-radius: 3px;
            pointer-events: none; 
            z-index: 9999;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(-20deg);
            box-shadow: 0 0 10px rgba(255,255,255,0.3), 4px 4px 12px rgba(0,0,0,0.8);
            display: none;
        }
        #needle::before {
            content:''; position: absolute; top: 8px; left: 1px;
            width: 2px; height: 60px;
            background: rgba(255,255,255,0.6);
            border-radius: 2px;
        }
        #needle::after {
            content:''; position: absolute; bottom: -8px; left: -5px;
            width: 16px; height: 16px;
            background: radial-gradient(circle at center, #555 20%, #111 70%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* CRACK */
        #crack {
            position: absolute; inset: 0; border-radius: 50%;
            background: url('https://i.imgur.com/3q1s7.png') no-repeat center/cover;
            mix-blend-mode: multiply; opacity: 0; pointer-events: none;
        }

        /* WARNING */
        #warning-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 0;
            background: radial-gradient(circle at center, rgba(220,20,60,0.95), rgba(0,0,0,0.95));
            z-index: 200;
            transition: height 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Creepster', cursive; color: white; 
            font-size: 3rem; letter-spacing: 3px;
            text-shadow: 0 0 20px red;
        }

        .shake {
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(-3px,2px); }
            50% { transform: translate(3px,-2px); }
            75% { transform: translate(-2px,-3px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div id="warning-bar">YOU LOST</div>

    <div class="absolute top-4 w-full flex justify-between px-6 z-50">
        <a href="/" class="text-xs bg-gray-800 border border-green-500 text-green-400 px-3 py-2 rounded uppercase font-bold tracking-widest">Exit</a>
        <div class="text-sm font-bold bg-gray-900 px-3 py-2 rounded border border-yellow-600 text-yellow-500">
            $<span id="balance">{{ "{:,}".format(balance) }}</span>
        </div>
    </div>

    <div id="menu" class="w-full max-w-md px-4 z-10 flex flex-col items-center">
        <h1 class="text-6xl text-pink-600 mb-8" style="font-family: 'Creepster', cursive; text-shadow: 0 0 15px #ff007f;">SQUID GAME</h1>

        <div class="grid grid-cols-2 gap-3 w-full">
            {% for id, lvl in levels.items() %}
            <div onclick="startGame({{id}}, '{{lvl.name}}', {{lvl.fee}})" 
                 class="relative bg-gray-900/80 backdrop-blur border {{ 'border-red-600' if id==10 else 'border-gray-700' }} p-4 rounded-xl active:scale-95 transition cursor-pointer">
                <h2 class="text-lg font-bold {{ 'text-red-500' if id==10 else 'text-white' }}">{{ lvl.name }}</h2>
                <div class="flex justify-between mt-2 text-xs">
                    <span class="text-green-400">Win: ${{ "{:,}".format(lvl.prize) }}</span>
                </div>
                <div class="text-xs text-gray-500 mt-1">Fee: ${{ "{:,}".format(lvl.fee) }}</div>
                {% if id == 10 %}<span class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded animate-pulse">NIGHTMARE</span>{% endif %}
            </div>
            {% endfor %}
        </div>
    </div>

    <div id="game-ui" class="hidden flex-col items-center w-full">
        <div class="text-5xl font-mono mb-8 text-green-400 tracking-widest" id="timer">00:00</div>

        <div class="cookie" id="cookie-area">
            <div id="crack"></div>
            <svg viewBox="0 0 100 100">
                <path id="path-base" class="path-base" d="" />
                <path id="path-progress" class="path-progress" d="" />
                <path id="path-hitbox" class="path-hitbox" d="" />
            </svg>
        </div>

        <p class="mt-8 text-gray-400 text-center text-sm animate-pulse px-4" id="status-text">
            HOLD & SLIDE FINGER ON THE SHAPE
        </p>
    </div>

    <div id="needle"></div>

    <script>
        const SHAPES = {
            'circle': 'M 50, 10 A 40,40 0 1,0 50,90 A 40,40 0 1,0 50,10',
            'triangle': 'M 50,10 L 90,85 L 10,85 L 50,10 Z',
            'square': 'M 15,15 L 85,15 L 85,85 L 15,85 Z',
            'star': 'M 50,5 L 61,38 L 95,38 L 68,58 L 79,90 L 50,70 L 21,90 L 32,58 L 5,38 L 39,38 Z',
            'umbrella': 'M 10,50 Q 50,-10 90,50 L 90,55 Q 80,45 70,55 Q 60,45 50,55 Q 40,45 30,55 Q 20,45 10,55 Z M 50,10 L 50,85 Q 50,95 60,95',
            'nightmare': 'M 50,5 L 95,90 L 5,90 L 50,5 M 50,25 L 75,75 L 25,75 L 50,25 M 50,45 L 60,65 L 40,65 L 50,45'
        };

        let active = false, started = false;
        let progress = 0, totalLength = 0;
        let timerInt;
        let failed = false;

        const needle = document.getElementById('needle');

        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchend', endInput);
        window.addEventListener('mouseup', endInput);

        function handleMove(e) {
            if(!active || failed) return;
            e.preventDefault();

            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            needle.style.left = clientX + 'px';
            needle.style.top = (clientY - 20) + 'px';
            needle.style.transform = `translate(-50%, -100%) rotate(${(Math.random()*4)-2}deg)`;

            checkCollision(clientX, clientY);
        }

        function endInput() {}

        function startGame(level, name, fee) {
            if(!confirm(`Start Level: ${name}?\nFee: $${fee}`)) return;

            fetch('/api/dalgona/start', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({level: level})
            }).then(r=>r.json()).then(d => {
                if(d.status === 'error') { alert(d.msg); return; }

                document.getElementById('balance').innerText = d.new_balance.toLocaleString();
                document.getElementById('menu').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                document.getElementById('game-ui').classList.add('flex');
                needle.style.display = 'block';

                const pathStr = SHAPES[d.shape];
                document.getElementById('path-base').setAttribute('d', pathStr);
                document.getElementById('path-progress').setAttribute('d', pathStr);
                document.getElementById('path-hitbox').setAttribute('d', pathStr);

                totalLength = document.getElementById('path-base').getTotalLength();
                progress = totalLength;
                document.getElementById('path-progress').style.strokeDasharray = totalLength;
                document.getElementById('path-progress').style.strokeDashoffset = totalLength;

                document.getElementById('timer').innerText = d.time;
                document.getElementById('crack').style.opacity = 0;
                document.getElementById('warning-bar').style.height = '0';
                failed = false;

                active = true; started = false;
            });
        }

        function checkCollision(x, y) {
            const el = document.elementFromPoint(x, y - 20);

            if(el && el.id === 'path-hitbox') {
                if(!started) {
                    started = true;
                    document.getElementById('status-text').innerText = "TRACING... DON'T SLIP!";
                    document.getElementById('status-text').className = "mt-8 text-green-400 font-bold animate-pulse";
                    startTimer();
                }

                progress -= 3;
                if(progress < 0) progress = 0;
                document.getElementById('path-progress').style.strokeDashoffset = progress;

                if(progress <= 0) winGame();

            } else {
                if(started && active && !failed) {
                    failGame("YOU LOST");
                }
            }
        }

        function failGame(reason) {
            failed = true;
            active = false; 
            clearInterval(timerInt);
            document.getElementById('crack').style.opacity = 1;
            const bar = document.getElementById('warning-bar');
            bar.style.height = '100vh';
            bar.innerText = reason;
            document.body.classList.add("shake");

            if(navigator.vibrate) navigator.vibrate([300, 100, 300]);

            fetch('/api/dalgona/fail', {method:'POST'});
            setTimeout(() => location.reload(), 3000);
        }

        function winGame() {
            if(!active) return;
            active = false; 
            clearInterval(timerInt);

            confetti({ particleCount: 300, spread: 140, origin: { y: 0.6 } });
            document.getElementById('status-text').innerText = "CONGRATULATIONS!";
            document.getElementById('status-text').className = "mt-8 text-yellow-400 font-bold text-3xl";

            fetch('/api/dalgona/finish', {method:'POST'})
            .then(r=>r.json()).then(d => {
                if(d.status === 'win') alert(`PASSED! +$${d.prize.toLocaleString()}`);
                else alert(d.msg);
                location.reload();
            });
        }

        function startTimer() {
            let t = parseInt(document.getElementById('timer').innerText);
            timerInt = setInterval(() => {
                t--;
                document.getElementById('timer').innerText = t < 10 ? `0${t}` : t;
                if(t <= 0) failGame("TIME UP!");
            }, 1000);
        }
    </script>
</body>
</html>
