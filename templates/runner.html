<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neon Rider 3D Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{
    margin:0; overflow:hidden;
    font-family:'Rajdhani',sans-serif;
    background:black; color:white;
    touch-action:none;
}
canvas{display:block;width:100%;height:100%;}

#ui-layer{position:absolute;inset:0;z-index:10;pointer-events:none;}
.hud{display:flex;justify-content:space-between;padding:16px;pointer-events:auto;}
.badge{
    background:linear-gradient(135deg,#00f3ff,#ff00de);
    padding:10px 22px;border-radius:50px;
    border:2px solid rgba(255,255,255,.6);
    box-shadow:0 0 20px rgba(0,243,255,.8);
    font-weight:900;font-size:18px;
    display:flex;gap:8px;align-items:center;
    text-shadow:2px 2px 0 black;
}

#start,#gameover{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;pointer-events:auto;
}
#gameover{display:none;width:320px;padding:25px;
    border-radius:20px;border:3px solid #00f3ff;
    background:linear-gradient(135deg,#12002a,#02000a);
    box-shadow:0 0 60px rgba(0,243,255,.7);
}
.logo{
    font-family:'Audiowide';
    font-size:60px;line-height:1;
    background:linear-gradient(180deg,#00f3ff,#ff00de);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px #00f3ff);
}
.btn{
    margin-top:20px;
    background:linear-gradient(135deg,#fff,#ffd700);
    border:none;border-radius:40px;
    padding:14px 0;width:220px;
    font-family:'Audiowide';font-size:18px;
    cursor:pointer;
    box-shadow:0 0 25px #ffd700;
}
.btn:active{transform:scale(.95);}
</style>
</head>
<body>

<div id="ui-layer">
    <div class="hud" id="hud" style="display:none;">
        <div class="badge">🪙 <span id="coin-ui">0</span></div>
        <div class="badge">⚡ <span id="power-ui">NONE</span></div>
    </div>

    <div id="start">
        <div class="logo">NEON<br>RIDER</div>
        <div style="letter-spacing:3px;opacity:.85;margin:20px 0;">SWIPE / ARROWS TO MOVE • UP TO JUMP</div>
        <button class="btn" onclick="startGame()">PLAY</button>
    </div>

    <div id="gameover">
        <h1 style="color:#ff4444;font-family:'Audiowide';margin:0;">WIPEOUT</h1>
        <p>COINS: <b id="final-coins">0</b></p>
        <p>RATE: $10</p>
        <h2 style="color:#00f3ff;">TOTAL: $<span id="final-money">0</span></h2>
        <button class="btn" id="claim-btn" onclick="claimReward()">CLAIM & RESTART</button>
    </div>
</div>

<canvas id="game"></canvas>

<!-- AUDIO -->
<audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c8b3a1c54.mp3?filename=cyberpunk-110624.mp3">
</audio>
<audio id="coin-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5fa4b27c10.mp3?filename=collect-coin-110634.mp3"></audio>
<audio id="hit-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_79897f95c6.mp3?filename=error-110437.mp3"></audio>
<audio id="power-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3d9b51d6b2.mp3?filename=powerup-110640.mp3"></audio>

<script>
/* ================= CORE ================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
window.addEventListener("resize",resize);resize();

let game=false,frame=0,score=0,speed=14;

/* ================= CAMERA ================= */
const FOV=480, CAM_H=380, HORIZON=0.32, LANE_W=200;

/* ================= AUDIO ================= */
const bgm=document.getElementById("bgm");
const coinSFX=document.getElementById("coin-sfx");
const hitSFX=document.getElementById("hit-sfx");
const powerSFX=document.getElementById("power-sfx");

/* ================= PLAYER ================= */
const player={
    lane:0,x:0,y:0,vy:0,
    gravity:1.6,jumpPower:28,
    jumping:false,run:0,
    shield:false,magnet:false,slow:false,
    powerTimer:0
};

/* ================= BACKGROUND MODES ================= */
const BG_MODES=["CYBER","DESERT","SPACE"];
let bgMode=0;

/* ================= INPUT ================= */
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;});
document.addEventListener("touchend",e=>{
    if(!game)return;
    let dx=e.changedTouches[0].screenX-tx;
    let dy=e.changedTouches[0].screenY-ty;
    if(Math.abs(dy)>Math.abs(dx)&&dy<-40)jump();
    else if(Math.abs(dx)>40)move(dx>0?1:-1);
});
document.addEventListener("keydown",e=>{
    if(!game)return;
    if(e.key==="ArrowLeft")move(-1);
    if(e.key==="ArrowRight")move(1);
    if(e.key==="ArrowUp"||e.key===" ")jump();
});
function move(d){let t=player.lane+d;if(t>=-1&&t<=1)player.lane=t;}
function jump(){if(!player.jumping){player.jumping=true;player.vy=player.jumpPower;}}

/* ================= OBJECTS ================= */
let objects=[];
class Obj{
    constructor(){
        this.lane=Math.floor(Math.random()*3)-1;
        this.z=3000;
        const r=Math.random();
        if(r<0.25)this.type="coin";
        else if(r<0.35)this.type="power";
        else this.type="obs";
        this.kind=Math.random()<.5?"barrier":"wall";
        this.active=true;
    }
    update(){
        this.z-=player.slow?speed*.5:speed;
        if(this.z<-300)this.active=false;

        if(this.active && this.z<240 && this.z>120 && this.lane===player.lane){
            if(this.type==="coin"){
                this.active=false;score++;
                coinSFX.currentTime=0;coinSFX.play();
                document.getElementById("coin-ui").innerText=score;
            }
            else if(this.type==="power"){
                this.active=false;
                activatePower();
            }
            else{
                if(player.shield){
                    player.shield=false;
                    document.getElementById("power-ui").innerText="NONE";
                }else{
                    hitSFX.play();
                    gameOver();
                }
            }
        }
    }
    draw(){
        const sc=FOV/(FOV+this.z);
        const x=W/2+(this.lane*LANE_W*sc);
        const y=(H*HORIZON)+(CAM_H*sc);
        const s=140*sc;

        if(this.type==="coin"){
            ctx.fillStyle="#ffd700";ctx.shadowBlur=25;ctx.shadowColor="gold";
            ctx.beginPath();ctx.arc(x,y-s*.5,s*.3,0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=0;
        }
        else if(this.type==="power"){
            ctx.fillStyle="#00f3ff";ctx.shadowBlur=25;ctx.shadowColor="#00f3ff";
            ctx.fillRect(x-s/2,y-s,s,s);
            ctx.shadowBlur=0;
        }
        else{
            ctx.fillStyle=this.kind==="barrier"?"#ff3333":"#ff8800";
            ctx.fillRect(x-s/2,y-s,s,s);
        }
    }
}

/* ================= POWERUPS ================= */
function activatePower(){
    powerSFX.play();
    const r=Math.random();
    if(r<.33){player.shield=true;player.magnet=false;player.slow=false;setPower("SHIELD");}
    else if(r<.66){player.magnet=true;player.shield=false;player.slow=false;setPower("MAGNET");}
    else{player.slow=true;player.shield=false;player.magnet=false;setPower("SLOW");}
    player.powerTimer=600;
}
function setPower(t){document.getElementById("power-ui").innerText=t;}

/* ================= DRAW BACKGROUND ================= */
function drawBackground(){
    if(BG_MODES[bgMode]==="CYBER"){
        let g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#20004a");
        g.addColorStop(HORIZON,"#ff00de");
        g.addColorStop(1,"#05000d");
        ctx.fillStyle=g;
    }
    if(BG_MODES[bgMode]==="DESERT"){
        let g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#ffcc66");
        g.addColorStop(1,"#ff6600");
        ctx.fillStyle=g;
    }
    if(BG_MODES[bgMode]==="SPACE"){
        ctx.fillStyle="black";
    }
    ctx.fillRect(0,0,W,H);
}

/* ================= ROAD ================= */
function drawRoad(){
    const hy=H*HORIZON;
    ctx.strokeStyle="rgba(0,243,255,.6)";
    ctx.lineWidth=2;
    const cx=W/2;
    for(let i=-3;i<=3;i++){
        ctx.beginPath();
        ctx.moveTo(cx+i*20,hy);
        ctx.lineTo(cx+i*W*.6,H);
        ctx.stroke();
    }
}

/* ================= PLAYER (REALISTIC HUMANOID) ================= */
function drawPlayer(){
    const tx=player.lane*LANE_W;
    player.x+=(tx-player.x)*.25;
    const sc=FOV/(FOV+200);
    const x=W/2+(player.x*sc);
    const y=(H*HORIZON)+(CAM_H*sc)-(player.y*sc);
    const s=120*sc;

    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.beginPath();ctx.ellipse(x,(H*HORIZON)+(CAM_H*sc),s*.45,s*.18,0,0,Math.PI*2);ctx.fill();

    player.run+=.25;
    const legL=player.jumping?-10:Math.sin(player.run)*22;
    const legR=player.jumping?10:Math.sin(player.run+Math.PI)*22;

    ctx.strokeStyle="#222";ctx.lineWidth=16*sc;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x-12*sc,y-s*.3);ctx.lineTo(x-12*sc,y+legL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+12*sc,y-s*.3);ctx.lineTo(x+12*sc,y+legR);ctx.stroke();

    ctx.fillStyle=player.shield?"#00ffcc":"#00f3ff";
    ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(x-s*.28,y-s*.9,s*.56,s*.6);
    ctx.shadowBlur=0;

    ctx.fillStyle="#ffccaa";
    ctx.beginPath();ctx.arc(x,y-s,s*.22,0,Math.PI*2);ctx.fill();
}

/* ================= GAME ================= */
function startGame(){
    document.getElementById("start").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("gameover").style.display="none";
    bgMode=(bgMode+1)%BG_MODES.length;
    game=true;frame=0;score=0;speed=15;
    objects=[];player.lane=0;player.y=0;
    bgm.volume=.5;bgm.play();
    loop();
}
function gameOver(){
    game=false;
    bgm.pause();
    document.getElementById("hud").style.display="none";
    document.getElementById("gameover").style.display="block";
    document.getElementById("final-coins").innerText=score;
    document.getElementById("final-money").innerText=(score*10).toLocaleString();
}
function loop(){
    if(!game)return;

    if(player.jumping){
        player.y+=player.vy;player.vy-=player.gravity;
        if(player.y<=0){player.y=0;player.jumping=false;}
    }
    if(player.powerTimer>0){player.powerTimer--;}
    else{player.shield=player.magnet=player.slow=false;setPower("NONE");}

    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawRoad();

    if(frame%35===0)objects.push(new Obj());
    objects.sort((a,b)=>b.z-a.z);
    objects.forEach(o=>{o.update();o.draw();});
    objects=objects.filter(o=>o.active);

    drawPlayer();
    frame++;speed+=.002;
    requestAnimationFrame(loop);
}

/* ================= API ================= */
async function claimReward(){
    const btn=document.getElementById("claim-btn");
    btn.innerText="SAVING...";btn.disabled=true;
    try{
        const res=await fetch("/api/games/runner/payout",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({coins:score})
        });
        const data=await res.json();
        if(data.status==="success")location.reload();
        else{alert("Save Failed");btn.disabled=false;}
    }catch(e){alert("Offline");btn.disabled=false;}
}
</script>
</body>
</html>
