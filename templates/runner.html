<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Runner – Cyberpunk Subway</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;}
canvas{display:block;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;color:white;pointer-events:none;}
.hud{display:flex;justify-content:space-between;padding:12px;}
.badge{
  background:rgba(0,0,0,.55);border:2px solid #00f3ff;
  padding:8px 18px;border-radius:30px;
  box-shadow:0 0 15px #00f3ff;font-weight:bold;
}
.panel{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.85);border:2px solid #00f3ff;
  padding:25px;border-radius:20px;text-align:center;display:none;
  pointer-events:auto;width:260px;
}
button{
  background:linear-gradient(135deg,#00f3ff,#ff00de);
  border:none;padding:12px 25px;border-radius:30px;
  color:white;font-size:16px;margin:10px;cursor:pointer;
  box-shadow:0 0 15px #00f3ff;
}
</style>
</head>
<body>

<div id="ui">
  <div class="hud">
    <div class="badge">🪙 <span id="coins">0</span></div>
    <div class="badge">❤️ <span id="life">3</span></div>
    <div class="badge">⚡ <span id="power">NONE</span></div>
  </div>

  <div id="start" class="panel" style="display:block;">
    <h1>NEON RUNNER</h1>
    <p>Cyberpunk Subway • Male Runner</p>
    <button onclick="startGame()">PLAY</button>
    <button onclick="openShop()">SHOP</button>
  </div>

  <div id="shop" class="panel">
    <h2>SHOP</h2>
    <p>Coins: <span id="shopCoins">0</span></p>
    <button onclick="buyUpgrade('speed')">Speed + (150)</button>
    <button onclick="buyUpgrade('shield')">Shield + (200)</button>
    <button onclick="buyUpgrade('magnet')">Magnet (250)</button>
    <br>
    <button onclick="closeShop()">CLOSE</button>
  </div>

  <div id="gameover" class="panel">
    <h2>GAME OVER</h2>
    <p>Coins: <span id="finalCoins">0</span></p>
    <p>Earnings: $<span id="finalMoney">0</span></p>
    <button onclick="location.reload()">RESTART</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* ================= PATHS ================= */
const MODEL_BASE = "https://raw.githubusercontent.com/playpasscanada-ctrl/Testingbot/main/templates/assets/models/";
const AUDIO_BASE = "https://raw.githubusercontent.com/playpasscanada-ctrl/Testingbot/main/templates/assets/audio/";

/* ================= AUDIO ================= */
const sounds = {
  bgm: new Audio(AUDIO_BASE+"bgm.mp3"),
  coin: new Audio(AUDIO_BASE+"coin.mp3"),
  hit: new Audio(AUDIO_BASE+"hit.mp3"),
  power: new Audio(AUDIO_BASE+"power.mp3")
};
sounds.bgm.loop = true;
sounds.bgm.volume = 0.5;

/* ================= CORE ================= */
let scene,camera,renderer;
let player,mixer,clock=new THREE.Clock();
let coins=[],obstacles=[],enemy;
let lane=0,speed=0.35;
let score=0,life=3;
let game=false;
let inventory={upgrades:{speed:0,shield:0,magnet:0}};
const loader=new THREE.GLTFLoader();

/* ================= INIT ================= */
init();
function init(){
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x050010,10,120);

  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,3,8);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setClearColor(0x050010);
  document.body.appendChild(renderer.domElement);

  window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  const light=new THREE.DirectionalLight(0x00f3ff,1);
  light.position.set(10,20,10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x8844ff,0.6));

  createGround();
  loadPlayer();
  spawnEnemy();
  animate();
}

/* ================= GROUND ================= */
function createGround(){
  const geo=new THREE.PlaneGeometry(500,500);
  const mat=new THREE.MeshStandardMaterial({color:0x111111});
  const ground=new THREE.Mesh(geo,mat);
  ground.rotation.x=-Math.PI/2;
  scene.add(ground);
}

/* ================= PLAYER ================= */
function loadPlayer(){
  loader.load(
    MODEL_BASE+"player.glb",
    gltf=>{
      player=gltf.scene;
      player.scale.set(1.2,1.2,1.2);
      player.position.set(0,0,0);
      scene.add(player);
      mixer=new THREE.AnimationMixer(player);
      if(gltf.animations.length){
        mixer.clipAction(gltf.animations[0]).play();
      }
    },
    undefined,
    ()=>{
      const geo=new THREE.BoxGeometry(1,2,1);
      const mat=new THREE.MeshStandardMaterial({color:0x00f3ff});
      player=new THREE.Mesh(geo,mat);
      scene.add(player);
    }
  );
}

/* ================= COINS (LINE) ================= */
function spawnCoinLine(){
  for(let i=0;i<12;i++){
    loader.load(MODEL_BASE+"coin.glb",gltf=>{
      const c=gltf.scene;
      c.scale.set(0.4,0.4,0.4);
      c.position.set(lane*2,1.2,-i*3-15);
      scene.add(c);
      coins.push(c);
    });
  }
}

/* ================= OBSTACLES ================= */
function spawnObstacle(type="train"){
  const path = type==="train"? MODEL_BASE+"train.glb" : MODEL_BASE+"barrier.glb";
  loader.load(path,gltf=>{
    const o=gltf.scene;
    o.scale.set(0.6,0.6,0.6);
    o.position.set(lane*2,0,-30);
    o.userData.type=type;
    scene.add(o);
    obstacles.push(o);
  });
}

/* ================= BOSS / ENEMY ================= */
function spawnEnemy(){
  const geo=new THREE.BoxGeometry(2,3,2);
  const mat=new THREE.MeshStandardMaterial({color:0xaa00ff,emissive:0x5500aa});
  enemy=new THREE.Mesh(geo,mat);
  enemy.position.set(0,1.5,-40);
  scene.add(enemy);
}
function enemyAI(){
  if(!game)return;
  enemy.position.z+=0.06;
  if(enemy.position.z>-2){
    hitPlayer();
    enemy.position.z=-40;
  }
}

/* ================= CONTROLS ================= */
window.addEventListener("keydown",e=>{
  if(!game)return;
  if(e.key==="ArrowLeft")lane=Math.max(-1,lane-1);
  if(e.key==="ArrowRight")lane=Math.min(1,lane+1);
  if(e.key==="ArrowUp")jump();
  if(e.key==="ArrowDown")slide();
});

/* ===== MOBILE SWIPE ===== */
let sx=0,sy=0;
window.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];
  sx=t.clientX; sy=t.clientY;
});
window.addEventListener("touchend",e=>{
  if(!game)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-sx;
  const dy=t.clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>40) lane=Math.min(1,lane+1);
    if(dx<-40) lane=Math.max(-1,lane-1);
  }else{
    if(dy<-40) jump();
    if(dy>40) slide();
  }
});

/* ================= JUMP / SLIDE ================= */
let y=0,vy=0,jumping=false,sliding=false;
function jump(){ if(!jumping){vy=0.6;jumping=true;} }
function slide(){
  if(!sliding && !jumping){
    sliding=true;
    setTimeout(()=>sliding=false,500);
  }
}

/* ================= HIT ================= */
function hitPlayer(){
  sounds.hit.currentTime=0; sounds.hit.play();
  if(inventory.upgrades.shield>0){
    inventory.upgrades.shield--;
  }else{
    life--;
    document.getElementById("life").innerText=life;
    if(life<=0)endGame();
  }
}

/* ================= SHOP ================= */
function openShop(){
  document.getElementById("shop").style.display="block";
  document.getElementById("shopCoins").innerText=score;
}
function closeShop(){document.getElementById("shop").style.display="none";}
function buyUpgrade(type){
  if(type==="speed"&&score>=150){score-=150;inventory.upgrades.speed++;sounds.power.play();}
  if(type==="shield"&&score>=200){score-=200;inventory.upgrades.shield++;sounds.power.play();}
  if(type==="magnet"&&score>=250){score-=250;inventory.upgrades.magnet++;sounds.power.play();}
}

/* ================= GAME ================= */
function startGame(){
  document.getElementById("start").style.display="none";
  game=true;
  spawnCoinLine();
  spawnObstacle("train");
  sounds.bgm.play();
}
function endGame(){
  game=false;
  sounds.bgm.pause();
  document.getElementById("gameover").style.display="block";
  document.getElementById("finalCoins").innerText=score;
  document.getElementById("finalMoney").innerText=(score*10).toLocaleString();
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  if(mixer)mixer.update(clock.getDelta());

  if(player){
    player.position.x+=(lane*2-player.position.x)*0.1;
    if(jumping){
      y+=vy;vy-=0.03;
      if(y<=0){y=0;jumping=false;}
    }
    player.position.y=y;
  }

  coins.forEach((c,i)=>{
    c.position.z+=speed;
    if(inventory.upgrades.magnet>0){
      c.position.x+=(player.position.x-c.position.x)*0.05;
    }
    if(c.position.z>2){
      score++;
      sounds.coin.currentTime=0; sounds.coin.play();
      document.getElementById("coins").innerText=score;
      scene.remove(c);
      coins.splice(i,1);
    }
  });

  obstacles.forEach((o,i)=>{
    o.position.z+=speed;
    if(o.position.z>1){
      hitPlayer();
      scene.remove(o);
      obstacles.splice(i,1);
    }
  });

  enemyAI();
  renderer.render(scene,camera);
}
</script>
</body>
</html>
