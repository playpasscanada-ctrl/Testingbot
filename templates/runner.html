<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Surf 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #1a0b2e; font-family: 'Rajdhani', sans-serif; touch-action: none; }

        /* UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* HUD */
        .hud { 
            display: flex; justify-content: space-between; padding: 20px; 
            font-size: 24px; font-weight: bold; color: white;
            text-shadow: 0 0 10px #00f3ff;
        }
        .score-pill { 
            background: rgba(0,0,0,0.5); padding: 10px 25px; border-radius: 30px; 
            border: 2px solid #ff00de; box-shadow: 0 0 15px #ff00de;
            display: flex; align-items: center; gap: 10px;
        }

        /* GAME OVER SCREEN */
        #game-over {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(20,0,20,0.95), rgba(0,0,0,0.95)); 
            border: 3px solid #ff00de; padding: 40px; text-align: center; width: 85%; max-width: 350px;
            border-radius: 20px; box-shadow: 0 0 50px rgba(255, 0, 222, 0.5); pointer-events: auto;
        }
        
        .btn-claim {
            background: linear-gradient(to right, #00f3ff, #0066ff); border: none; padding: 15px 40px; 
            font-size: 20px; font-family: 'Black Ops One'; color: white; border-radius: 50px; 
            margin-top: 20px; cursor: pointer; box-shadow: 0 0 20px #00f3ff; transition: 0.2s;
            width: 100%;
        }
        .btn-claim:active { transform: scale(0.95); }

        /* START SCREEN */
        #start-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            text-align: center; pointer-events: auto; width: 100%;
        }
        .title-text { 
            font-family: 'Black Ops One'; font-size: 50px; 
            background: linear-gradient(to bottom, #00f3ff, #ff00de); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,243,255,0.5));
        }
        .pulse-btn {
            background: white; color: black; border: none; padding: 15px 50px; 
            font-size: 22px; font-weight: 900; border-radius: 50px; cursor: pointer;
            animation: pulse 1.5s infinite; font-family: 'Rajdhani';
        }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255,255,255,0); } 100% { transform: scale(1); } }

        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud" id="hud" style="display:none;">
            <div class="score-pill">🪙 <span id="coin-display">0</span></div>
            <div class="score-pill">🏦 $<span id="bal-display">{{ "{:,}".format(balance) }}</span></div>
        </div>
        
        <div id="game-over">
            <h1 style="color:#ff0044; font-family:'Black Ops One'; margin:0; font-size: 40px;">WIPEOUT!</h1>
            <div style="margin: 20px 0;">
                <div style="color:gold; font-size:18px;">COINS COLLECTED</div>
                <div style="font-size:40px; font-weight:900;" id="final-coins">0</div>
            </div>
            <div style="color:#00f3ff; font-size:20px;">VALUE: $<span id="final-money">0</span></div>
            <button onclick="claimReward()" id="claim-btn" class="btn-claim">CLAIM CASH</button>
            <p id="status-msg" style="font-size:12px; color:gray; margin-top:10px;"></p>
        </div>
        
        <div id="start-screen">
            <div class="title-text">NEON SURF</div>
            <p style="color:white; font-size:18px; margin-bottom:30px;">
                👆 SWIPE UP TO JUMP<br>
                👈 SWIPE LEFT/RIGHT TO DODGE
            </p>
            <button class="pulse-btn" onclick="startGame()">TAP TO START</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CONFIG ---
        let width, height;
        let gameActive = false;
        let frame = 0;
        let score = 0;
        let speed = 8; // Faster base speed
        
        // --- PLAYER ---
        const player = {
            lane: 0, // -1 (Left), 0 (Middle), 1 (Right)
            y: 0,    // Jump height (0 = ground)
            vy: 0,   // Vertical velocity
            gravity: 1.2,
            jumpPower: 22,
            isJumping: false,
            color: '#00f3ff',
            animY: 0
        };

        // --- WORLD ---
        let objects = []; // Coins & Obstacles
        const laneWidth = 120; // Virtual width of a lane
        const horizonY = 0.35; // Where the road disappears (0 to 1)

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- INPUTS ---
        let touchX = 0, touchY = 0;
        
        document.addEventListener('keydown', e => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft') moveLane(-1);
            if (e.key === 'ArrowRight') moveLane(1);
            if ((e.key === 'ArrowUp' || e.key === ' ') && !player.isJumping) jump();
        });

        document.addEventListener('touchstart', e => {
            touchX = e.changedTouches[0].screenX;
            touchY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            if (!gameActive) return;
            let endX = e.changedTouches[0].screenX;
            let endY = e.changedTouches[0].screenY;
            let dx = endX - touchX;
            let dy = endY - touchY;

            // Priority: Vertical Swipe (Jump) > Horizontal Swipe
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40 && dy < 0) {
                if (!player.isJumping) jump();
            } else if (Math.abs(dx) > 40) {
                if (dx > 0) moveLane(1);
                else moveLane(-1);
            }
        });

        function moveLane(dir) {
            let target = player.lane + dir;
            if (target >= -1 && target <= 1) player.lane = target;
        }

        function jump() {
            player.isJumping = true;
            player.vy = player.jumpPower;
        }

        // --- GAME OBJECTS ---
        class GameObject {
            constructor() {
                this.lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
                this.z = 2000; // Start far away
                // 40% Coin, 60% Obstacle
                this.type = Math.random() < 0.4 ? 'coin' : 'obstacle'; 
                
                if(this.type === 'obstacle') {
                    // 50% Low Barrier (Jumpable), 50% Tall Wall (Must Dodge)
                    this.obsType = Math.random() < 0.5 ? 'barrier' : 'wall';
                }
                this.active = true;
            }

            update() {
                this.z -= speed;
                if (this.z < -100) this.active = false;

                // --- COLLISION DETECTION ---
                // Player is at z ~ 100.
                if (this.active && Math.abs(this.z - 100) < 50 && this.lane === player.lane) {
                    
                    if (this.type === 'coin') {
                        collectCoin(this);
                    } else if (this.type === 'obstacle') {
                        if (this.obsType === 'barrier') {
                            // Player must be high enough to clear barrier
                            if (player.y < 40) gameOver(); // Crash if not jumping high
                        } else {
                            // Wall cannot be jumped
                            gameOver();
                        }
                    }
                }
            }

            draw() {
                // PERSPECTIVE MATH
                // k = Scale factor (Distance fade)
                const k = 400 / (400 + this.z); 
                
                const x = width / 2 + (this.lane * laneWidth * k * 3);
                const y = height * horizonY + ((height - height * horizonY) * k * 0.5) + (height * 0.4 * k);
                
                const w = 80 * k;
                const h = 80 * k;

                if (this.type === 'coin') {
                    // Floating Coin
                    const floatY = y - (100 * k) - (Math.sin(frame * 0.1) * 10 * k);
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 20; ctx.shadowColor = 'gold';
                    ctx.beginPath(); ctx.arc(x, floatY, w/2, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // Detail
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(x, floatY, w/3, 0, Math.PI*2); ctx.fill();
                } 
                else if (this.type === 'obstacle') {
                    if (this.obsType === 'barrier') {
                        // LOW BARRIER (Red)
                        const barH = h * 0.6;
                        const barY = y - barH;
                        drawBox(x, barY, w, barH, '#ff3333', '#990000');
                        // Symbol for Jump
                        ctx.fillStyle = 'white';
                        ctx.font = `${20*k}px Arial`; ctx.textAlign = 'center';
                        ctx.fillText('⬆️', x, barY + barH/2);
                    } else {
                        // TALL WALL (Orange)
                        const wallH = h * 1.5;
                        const wallY = y - wallH;
                        drawBox(x, wallY, w, wallH, '#ff8800', '#cc6600');
                    }
                }
            }
        }

        // Draw pseudo-3D box
        function drawBox(x, y, w, h, colorFront, colorTop) {
            // Front Face
            ctx.fillStyle = colorFront;
            ctx.fillRect(x - w/2, y, w, h);
            
            // Top Face (Visual Depth)
            ctx.fillStyle = colorTop;
            ctx.beginPath();
            ctx.moveTo(x - w/2, y);
            ctx.lineTo(x + w/2, y);
            ctx.lineTo(x + (w/4), y - (h/4));
            ctx.lineTo(x - (w/4), y - (h/4));
            ctx.fill();
        }

        // --- GAME LOOP ---
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            gameActive = true;
            score = 0;
            frame = 0;
            speed = 10;
            objects = [];
            
            // Player reset
            player.lane = 0;
            player.y = 0;
            player.vy = 0;
            player.isJumping = false;
            
            document.getElementById('coin-display').innerText = '0';
            update();
        }

        function spawnObjects() {
            if (frame % 40 === 0) { // Spawn every 40 frames
                objects.push(new GameObject());
            }
        }

        function update() {
            if (!gameActive) return;

            // Player Physics (Jump)
            if (player.isJumping) {
                player.y += player.vy;
                player.vy -= player.gravity;
                if (player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                    player.isJumping = false;
                }
            }

            // Clean Canvas
            // Sky Gradient
            let grd = ctx.createLinearGradient(0, 0, 0, height);
            grd.addColorStop(0, "#2b0f54"); // Deep Purple
            grd.addColorStop(1, "#ff00de"); // Neon Pink horizon
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Draw Ground (Perspective Grid)
            drawRoad();

            // Spawn & Update Objects
            spawnObjects();
            
            // Sort by Z (Painters Algorithm - Draw far objects first)
            objects.sort((a, b) => b.z - a.z);
            objects.forEach(obj => {
                obj.update();
                obj.draw();
            });
            objects = objects.filter(o => o.active);

            // Draw Player
            drawPlayer();

            frame++;
            speed += 0.002; // Slow acceleration
            requestAnimationFrame(update);
        }

        function drawRoad() {
            const hY = height * horizonY;
            
            // Floor
            let floorGrd = ctx.createLinearGradient(0, hY, 0, height);
            floorGrd.addColorStop(0, "#000033");
            floorGrd.addColorStop(1, "#001144");
            ctx.fillStyle = floorGrd;
            ctx.fillRect(0, hY, width, height - hY);

            // Lanes (Moving grid)
            ctx.strokeStyle = "rgba(0, 243, 255, 0.3)";
            ctx.lineWidth = 2;
            
            // Vertical Lines
            const centerX = width/2;
            const spread = width * 1.5; // How wide the road gets at bottom
            
            for(let i=-1.5; i<=1.5; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, hY);
                ctx.lineTo(centerX + (i * spread), height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            const speedOffset = (frame * speed * 5) % 100;
            for(let z=0; z<height; z+=100) {
                // Perspective spacing log curve
                let y = hY + Math.pow(z + speedOffset, 1.5) / 100;
                if(y > height) continue;
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawPlayer() {
            // Player visual position calculation
            // Base X position + Lane Offset + slight sway animation
            const centerX = width / 2;
            const laneOffset = player.lane * (width / 3.5); 
            // Lerp logic would be here, direct mapping for responsiveness
            const px = centerX + laneOffset;
            const py = height - 150 - player.y; // Apply Jump Height

            // Shadow (Stays on ground)
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(px, height - 120, 30 - (player.y/5), 10 - (player.y/10), 0, 0, Math.PI*2);
            ctx.fill();

            // Player Character (Robot/Surfer Style)
            // Body
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 20; ctx.shadowColor = player.color;
            ctx.fillRect(px - 20, py - 60, 40, 60);
            
            // Head
            ctx.fillStyle = 'white';
            ctx.fillRect(px - 15, py - 90, 30, 25);
            
            // Jetpack Flame (If jumping)
            if(player.isJumping) {
                ctx.fillStyle = 'orange';
                ctx.beginPath();
                ctx.moveTo(px - 10, py);
                ctx.lineTo(px + 10, py);
                ctx.lineTo(px, py + 30);
                ctx.fill();
            }
            
            ctx.shadowBlur = 0;
        }

        function collectCoin(coin) {
            coin.active = false;
            score++;
            document.getElementById('coin-display').innerText = score;
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('hud').style.display = 'none';
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-coins').innerText = score;
            document.getElementById('final-money').innerText = "{:,}".format(score * 10);
        }

        async function claimReward() {
            const btn = document.getElementById('claim-btn');
            const msg = document.getElementById('status-msg');
            btn.disabled = true; btn.innerText = "SAVING...";

            try {
                const res = await fetch('/api/games/runner/payout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ coins: score })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    msg.innerText = "Reward Claimed!"; msg.style.color = 'lime';
                    setTimeout(() => location.reload(), 1000);
                } else {
                    msg.innerText = "Error!"; btn.disabled = false;
                }
            } catch(e) {
                msg.innerText = "Offline?"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
