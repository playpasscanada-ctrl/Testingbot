<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grand Turf Derby Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Ops+One&family=Chakra+Petch:wght@600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. CORE VARIABLES & RESET
           ========================================= */
        :root {
            --grass-light: #5ba326;
            --grass-dark: #4a8a1e;
            --dirt-track: #8d6e63;
            --sky-top: #00b4db;
            --sky-bot: #0083b0;
            --ui-dark: #0f0f0f;
            --gold: #ffcc00;
            --neon-green: #39ff14;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; /* No Body Scroll */
            background: #000;
            font-family: 'Oswald', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================================
           2. MOBILE LANDSCAPE ENFORCER
           ========================================= */
        #orientation-lock {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 10000;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: #ff4757; text-align: center;
        }
        .rotate-svg {
            width: 80px; height: 80px; fill: #ff4757;
            animation: rotateDevice 2s infinite ease-in-out;
            margin-bottom: 20px;
        }
        @keyframes rotateDevice {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        /* CSS Media Query to Detect Portrait */
        @media screen and (orientation: portrait) {
            #main-interface { display: none !important; }
            #orientation-lock { display: flex !important; }
        }

        /* =========================================
           3. MAIN LAYOUT STRUCTURE
           ========================================= */
        #main-interface {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: #222; overflow: hidden;
        }

        /* --- TOP HUD (Fixed) --- */
        #top-hud {
            height: 10vh; min-height: 50px;
            background: rgba(0,0,0,0.85);
            border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 2vw; z-index: 50;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .user-pill {
            display: flex; align-items: center; gap: 10px;
            background: #1a1a1a; padding: 5px 15px; border-radius: 30px;
            border: 1px solid #333;
        }
        .balance-pill {
            background: linear-gradient(90deg, #11998e, #38ef7d);
            padding: 5px 20px; border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(56, 239, 125, 0.4);
        }

        /* --- TICKER TAPE --- */
        #news-ticker {
            height: 4vh; background: #000;
            border-bottom: 1px solid #333;
            display: flex; align-items: center;
            overflow: hidden; white-space: nowrap;
            z-index: 40;
        }
        #scrolling-text {
            color: var(--gold); font-family: 'Chakra Petch', monospace;
            font-size: 1.8vh; letter-spacing: 1px;
            padding-left: 100%;
            animation: scrollText 20s linear infinite;
        }
        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200%); }
        }

        /* =========================================
           4. GAME WORLD (Middle)
           ========================================= */
        #viewport {
            flex: 1; /* Fills remaining space */
            position: relative; overflow: hidden;
            background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
        }

        /* --- SCENERY (CSS Art Mountains - No Images) --- */
        .mountain-bg {
            position: absolute; bottom: 40%; left: 0; width: 100%; height: 50%;
            z-index: 1; pointer-events: none;
        }
        .mountain-1 {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #7f8c8d 0%, transparent 100%);
            clip-path: polygon(0% 100%, 15% 30%, 30% 80%, 45% 40%, 60% 90%, 75% 20%, 90% 80%, 100% 100%);
            opacity: 0.8;
        }
        .mountain-2 {
            position: absolute; bottom: 0; left: -50px; width: 110%; height: 80%;
            background: linear-gradient(to bottom, #2c3e50 0%, transparent 100%);
            clip-path: polygon(0% 100%, 20% 40%, 40% 90%, 55% 50%, 70% 80%, 100% 100%);
            opacity: 0.9;
        }

        /* Clouds */
        .cloud-puff {
            position: absolute; background: rgba(255,255,255,0.7);
            border-radius: 50px; filter: blur(3px);
            animation: moveClouds linear infinite;
        }
        @keyframes moveClouds { from { left: 100%; } to { left: -200px; } }

        /* Grandstand / Crowd Blur */
        .crowd-layer {
            position: absolute; bottom: 45%; left: 0; width: 100%; height: 10%;
            background: 
                repeating-linear-gradient(90deg, 
                    #e74c3c 0, #e74c3c 2px, 
                    #fff 2px, #fff 4px,
                    #3498db 4px, #3498db 6px
                );
            opacity: 0.6; z-index: 2;
        }

        /* --- TURF TRACK --- */
        #track-surface {
            position: absolute; bottom: 0; width: 100%; height: 55%; /* Fixed height for track */
            background: repeating-linear-gradient(
                0deg,
                var(--grass-dark) 0%,
                var(--grass-dark) 9.5%,
                var(--grass-light) 10%
            );
            border-top: 4px solid #fff;
            perspective: 1000px; z-index: 5;
            padding-top: 2%; /* FIX: Space for top horse name */
            padding-bottom: 2%;
        }

        /* Finish Line Banner (New) */
        #finish-gate {
            position: absolute; top: 0; right: -200px; /* Hidden */
            height: 100%; width: 50px;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 20px 20px;
            background-color: #fff;
            z-index: 20;
            border-left: 4px solid #f1c40f;
            display: none;
        }
        .gate-post {
            position: absolute; top: -20%; right: -5px; width: 8px; height: 140%;
            background: #c0392b; z-index: 21;
        }

        /* =========================================
           5. RACERS (Horses)
           ========================================= */
        .racer-container {
            position: absolute; left: 2%; 
            /* Top will be set by JS loop */
            width: 80px; height: 8%; /* Dynamic height relative to track */
            z-index: 10;
            transition: left 0.1s linear; /* Fast updates */
        }

        .horse-visual {
            font-size: 5vh; /* Responsive font size */
            transform: scaleX(-1); /* Face right */
            filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.5));
            animation: gallop 0.4s infinite alternate ease-in-out;
            line-height: 1;
        }
        
        .name-tag {
            position: absolute; top: -1.5vh; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 1px 6px; border-radius: 4px;
            font-size: 1.5vh; font-family: 'Chakra Petch', sans-serif;
            border: 1px solid var(--gold); white-space: nowrap;
        }

        @keyframes gallop {
            0% { transform: scaleX(-1) translateY(0); }
            100% { transform: scaleX(-1) translateY(-10%); }
        }

        /* =========================================
           6. CONTROL PANEL (Bottom - Hides on Start)
           ========================================= */
        #betting-dock {
            height: 20vh; width: 100%;
            background: #111; border-top: 3px solid #333;
            display: flex; align-items: center; justify-content: center;
            gap: 3vw; padding: 10px;
            z-index: 100;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Class to hide menu */
        .dock-hidden { transform: translateY(120%); }

        .ctl-group { display: flex; flex-direction: column; align-items: center; }
        .ctl-label { color: #888; font-size: 1.5vh; letter-spacing: 1px; margin-bottom: 5px; }

        /* Fancy Inputs */
        select {
            background: #222; color: #fff; padding: 1vh 2vw; border: 1px solid #555;
            font-family: 'Oswald', sans-serif; font-size: 2vh; border-radius: 5px; outline: none;
        }

        .wager-box { display: flex; background: #000; border-radius: 5px; border: 1px solid #444; }
        .adj-btn {
            background: #333; color: #fff; border: none; width: 40px; font-size: 2vh; cursor: pointer;
        }
        .adj-btn:active { background: #555; }
        #wager-display {
            background: transparent; border: none; color: var(--gold); width: 100px;
            text-align: center; font-size: 2.5vh; font-weight: bold;
        }

        #start-btn {
            height: 8vh; padding: 0 4vw;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            color: #fff; border: none; border-radius: 5px;
            font-family: 'Black Ops One', cursive; font-size: 3vh;
            letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 5px 0 #7f2a1f;
        }
        #start-btn:active { transform: translateY(4px); box-shadow: none; }
        #start-btn:disabled { background: #333; color: #555; box-shadow: none; cursor: not-allowed; }

        /* =========================================
           7. COUNTDOWN OVERLAY
           ========================================= */
        #countdown-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 80;
            display: none; align-items: center; justify-content: center;
        }
        #countdown-txt {
            font-family: 'Black Ops One', cursive; font-size: 15vw;
            color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from{transform: scale(0);} to{transform: scale(1);} }

        /* =========================================
           8. SCROLLABLE LEADERBOARD (Fixed)
           ========================================= */
        #results-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }

        .results-card {
            background: #151515; width: 80%; max-width: 600px;
            height: 80vh; /* Fixed height relative to screen */
            border: 2px solid var(--gold); border-radius: 10px;
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            animation: slideUp 0.5s ease-out;
        }

        .card-header {
            padding: 20px; background: var(--gold); color: #000;
            text-align: center; font-family: 'Black Ops One', cursive; font-size: 2rem;
        }

        /* SCROLLABLE AREA */
        .card-body {
            flex: 1; /* Takes remaining space */
            overflow-y: auto; /* ENABLE SCROLL */
            padding: 20px;
        }
        
        /* Custom Scrollbar */
        .card-body::-webkit-scrollbar { width: 8px; }
        .card-body::-webkit-scrollbar-track { background: #111; }
        .card-body::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .res-row {
            display: flex; justify-content: space-between;
            padding: 15px; border-bottom: 1px solid #333;
            color: #ccc; font-size: 1.2rem;
        }
        .res-row:nth-child(1) { color: var(--gold); font-weight: bold; border: 1px solid var(--gold); background: rgba(255,215,0,0.1); }
        .res-row.user-won { border: 2px solid #2ecc71; background: rgba(46,204,113,0.1); }

        /* BUTTON INSIDE SCROLL AREA (AT BOTTOM) */
        .replay-section {
            padding: 20px; text-align: center; margin-top: 20px;
        }
        .replay-btn {
            background: #fff; color: #000; padding: 15px 40px;
            border: none; font-size: 1.5rem; font-family: 'Oswald', sans-serif;
            font-weight: bold; cursor: pointer; border-radius: 50px;
            transition: 0.2s;
        }
        .replay-btn:hover { transform: scale(1.05); background: var(--neon-green); }

    </style>
</head>
<body>

    <div id="orientation-lock">
        <svg class="rotate-svg" viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
        <h1 class="text-3xl font-bold">ROTATE DEVICE</h1>
        <p>Landscape Mode Required</p>
    </div>

    <div id="main-interface">
        
        <div id="top-hud">
            <div class="user-pill">
                <span class="text-gray-400 text-xs mr-2">PLAYER</span>
                <span class="text-white font-bold uppercase">{{ user.username }}</span>
            </div>
            
            <div class="balance-pill">
                <span class="text-xs text-white opacity-80 mr-2">CREDITS</span>
                <span class="text-2xl font-bold text-white">$<span id="balance-val">{{ balance }}</span></span>
            </div>
        </div>

        <div id="news-ticker">
            <div id="scrolling-text">
                GRAND DERBY LIVE • HIGHEST PAYOUTS • MIN BET $1000 • WINNER TAKES ALL • GOOD LUCK PLAYERS •
            </div>
        </div>

        <div id="viewport">
            
            <div id="sky-container"></div>
            
            <div class="mountain-bg">
                <div class="mountain-1"></div>
                <div class="mountain-2"></div>
            </div>

            <div class="crowd-layer"></div>

            <div id="track-surface">
                <div id="finish-gate">
                    <div class="gate-post"></div>
                </div>
                </div>

            <div id="countdown-layer">
                <div id="countdown-txt">3</div>
            </div>

        </div>

        <div id="betting-dock">
            <div class="ctl-group">
                <span class="ctl-label">CHOOSE WINNER</span>
                <select id="horse-selector"></select>
            </div>

            <div class="ctl-group">
                <span class="ctl-label">WAGER (MIN $1000)</span>
                <div class="wager-box">
                    <button class="adj-btn" onclick="adjWager(-1000)">-</button>
                    <input type="number" id="wager-display" value="1000" readonly>
                    <button class="adj-btn" onclick="adjWager(1000)">+</button>
                </div>
            </div>

            <div class="text-xs text-gray-500 text-center">
                <div class="text-yellow-400 font-bold">1st: 5x</div>
                <div>2nd: 2x</div>
                <div>3rd: 1.2x</div>
            </div>

            <button id="start-btn" onclick="preStartSequence()">START RACE</button>
        </div>

    </div>

    <div id="results-modal">
        <div class="results-card">
            <div class="card-header" id="res-header">RESULTS</div>
            
            <div class="card-body">
                <div id="res-list">
                    </div>
                
                <div class="replay-section">
                    <button class="replay-btn" onclick="resetGame()">PLAY AGAIN ↺</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // --- CONFIG ---
        const config = {
            duration: 60, // 60s Race
            fps: 30,
            minBet: 1000
        };

        const horses = [
            { id: 0, name: 'Saksham', icon: '🐎', color: '#e74c3c' },
            { id: 1, name: 'Muskan', icon: '🦄', color: '#9b59b6' },
            { id: 2, name: 'Zoro', icon: '🦓', color: '#f1c40f' },
            { id: 3, name: 'Dev', icon: '🐆', color: '#e67e22' },
            { id: 4, name: 'Subhu', icon: '🐅', color: '#d35400' },
            { id: 5, name: 'Chemical', icon: '🧪', color: '#2ecc71' },
            { id: 6, name: 'Cutiee', icon: '🐇', color: '#ff7979' },
            { id: 7, name: 'Snackieee', icon: '🍟', color: '#f39c12' },
            { id: 8, name: 'Mayan', icon: '🐃', color: '#34495e' },
            { id: 9, name: 'Haru', icon: '🐕', color: '#95a5a6' }
        ];

        // --- STATE ---
        let positions = new Array(10).fill(0);
        let speeds = new Array(10).fill(0);
        let raceInterval = null;
        let serverResult = null;
        let userPick = "";
        let isRunning = false;

        // --- INIT ---
        const track = document.getElementById('track-surface');
        const selector = document.getElementById('horse-selector');
        const sky = document.getElementById('sky-container');

        // Build Track & Dropdown
        horses.forEach((h, i) => {
            // Dropdown
            let opt = document.createElement('option');
            opt.value = h.name;
            opt.innerText = `${h.icon} ${h.name}`;
            selector.appendChild(opt);

            // Horse on Track
            let wrap = document.createElement('div');
            wrap.className = 'racer-container';
            wrap.id = `racer-${i}`;
            
            // Dynamic Top Position (0% to 90% of track height)
            let topPos = (i * 9) + 2; // +2% padding
            wrap.style.top = topPos + '%';
            
            wrap.innerHTML = `
                <div class="name-tag" style="border-color:${h.color}">${h.name}</div>
                <div class="horse-visual">${h.icon}</div>
            `;
            track.appendChild(wrap);
        });

        // Add Clouds
        for(let j=0; j<5; j++) {
            let c = document.createElement('div');
            c.className = 'cloud-puff';
            c.style.width = Math.random()*100 + 50 + 'px';
            c.style.height = Math.random()*40 + 20 + 'px';
            c.style.top = Math.random()*30 + '%';
            c.style.animationDuration = Math.random()*30 + 20 + 's';
            sky.appendChild(c);
        }

        // --- FUNCTIONS ---

        function adjWager(val) {
            if(isRunning) return;
            let el = document.getElementById('wager-display');
            let v = parseInt(el.value) + val;
            if(v >= config.minBet) el.value = v;
        }

        function preStartSequence() {
            if(isRunning) return;
            const amt = parseInt(document.getElementById('wager-display').value);
            userPick = document.getElementById('horse-selector').value;

            if(amt < config.minBet) {
                alert("Minimum bet is $1000"); return;
            }

            isRunning = true;

            // 1. HIDE MENU (Slide Down)
            document.getElementById('betting-dock').classList.add('dock-hidden');

            // 2. SHOW COUNTDOWN
            const cdLayer = document.getElementById('countdown-layer');
            const cdTxt = document.getElementById('countdown-txt');
            cdLayer.style.display = 'flex';
            
            let count = 3;
            cdTxt.innerText = count;

            let cdInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    cdTxt.innerText = count;
                    // Reset animation
                    cdTxt.style.animation = 'none';
                    void cdTxt.offsetWidth;
                    cdTxt.style.animation = 'popIn 0.5s';
                } else {
                    clearInterval(cdInterval);
                    cdTxt.innerText = "GO!";
                    setTimeout(() => {
                        cdLayer.style.display = 'none';
                        startActualRace(amt);
                    }, 500);
                }
            }, 1000);
        }

        function startActualRace(amt) {
            updateTicker("RACE STARTED! HORSES ARE THUNDERING DOWN THE TRACK!");
            socket.emit('start_horse_race', { amount: amt, horse_name: userPick });
        }

        // --- SOCKET HANDLERS ---
        socket.on('balance_update', d => {
            document.getElementById('balance-val').innerText = d.balance;
        });

        socket.on('race_error', d => {
            alert(d.msg);
            resetGame();
        });

        socket.on('race_result', data => {
            serverResult = data;
            runAnimationLoop();
        });

        // --- MAIN LOOP ---
        function runAnimationLoop() {
            let frame = 0;
            const totalFrames = config.duration * config.fps;
            const intervalTime = 1000 / config.fps;

            raceInterval = setInterval(() => {
                frame++;
                let progress = frame / totalFrames; // 0.0 -> 1.0

                if (progress < 0.9) {
                    modeChaos();
                } else {
                    modeFinish(progress);
                }

                renderPositions();

                if (frame % 100 === 0) updateTickerRandom();

                if (progress >= 1) {
                    finishRace();
                }

            }, intervalTime);
        }

        function modeChaos() {
            for(let i=0; i<10; i++) {
                speeds[i] += (Math.random() - 0.5) * 2;
                if(speeds[i] > 2) speeds[i] = 2;
                if(speeds[i] < -2) speeds[i] = -2;
                
                positions[i] += speeds[i];
                
                // Keep mainly in middle
                if(positions[i] < 5) { positions[i] = 5; speeds[i] += 1; }
                if(positions[i] > 80) { positions[i] = 80; speeds[i] -= 1; }
            }
        }

        function modeFinish(p) {
            // Show Gate
            const gate = document.getElementById('finish-gate');
            gate.style.display = 'block';
            gate.style.right = '10%'; 

            // Move to final ranks
            for(let i=0; i<10; i++) {
                let name = horses[i].name;
                let rank = serverResult.ranking.indexOf(name); // 0 = 1st
                
                // 1st place -> 90%, Last -> 40%
                let target = 90 - (rank * 5);
                let diff = target - positions[i];
                positions[i] += diff * 0.05;
            }
        }

        function renderPositions() {
            for(let i=0; i<10; i++) {
                const el = document.getElementById(`racer-${i}`);
                el.style.left = positions[i] + '%';
            }
        }

        function finishRace() {
            clearInterval(raceInterval);
            
            // Build Results
            const list = document.getElementById('res-list');
            const header = document.getElementById('res-header');
            list.innerHTML = '';

            let userWon = (serverResult.win_amount > 0);
            
            if(userWon) {
                header.innerText = "VICTORY!";
                header.style.color = "#2ecc71";
                document.getElementById('balance-val').innerText = serverResult.final_balance;
            } else {
                header.innerText = "RACE OVER";
                header.style.color = "#fff";
            }

            // Populate Rows
            serverResult.ranking.forEach((name, idx) => {
                let rank = idx + 1;
                let isUser = (name === userPick);
                
                let row = document.createElement('div');
                row.className = 'res-row';
                if(isUser && userWon) row.classList.add('user-won');

                let payout = "-";
                if(rank === 1) payout = "5x";
                if(rank === 2) payout = "2x";
                if(rank === 3) payout = "1.2x";

                if(isUser && userWon) payout = `+$${serverResult.win_amount}`;

                row.innerHTML = `
                    <div style="width:30px">#${rank}</div>
                    <div style="flex:1; padding-left:10px">${name}</div>
                    <div>${payout}</div>
                `;
                list.appendChild(row);
            });

            // Show Modal
            document.getElementById('results-modal').style.display = 'flex';
        }

        function resetGame() {
            document.getElementById('results-modal').style.display = 'none';
            document.getElementById('finish-gate').style.display = 'none';
            
            // Show Menu again
            document.getElementById('betting-dock').classList.remove('dock-hidden');
            
            // Reset Horses
            positions.fill(0);
            renderPositions();
            
            isRunning = false;
            updateTicker("PLACE YOUR BETS FOR THE NEXT EVENT!");
        }

        function updateTicker(txt) {
            document.getElementById('scrolling-text').innerText = txt;
        }

        function updateTickerRandom() {
            const msgs = ["WHAT A RACE!", "LOOK AT THEM GO!", "NECK AND NECK!", "SPEEDING UP!", "WHO WILL WIN?"];
            updateTicker(msgs[Math.floor(Math.random()*msgs.length)]);
        }

    </script>
