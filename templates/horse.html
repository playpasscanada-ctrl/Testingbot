<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grand Turf Derby</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. CORE RESET & VARIABLES
           ========================================= */
        :root {
            --turf-light: #4caf50;
            --turf-dark: #388e3c;
            --sky-gradient: linear-gradient(180deg, #2980b9, #6dd5fa);
            --gold: #ffd700;
            --danger: #e74c3c;
            --ui-bg: #111;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Oswald', sans-serif;
            user-select: none;
            touch-action: none;
        }

        /* =========================================
           2. MOBILE ROTATION LOCK
           ========================================= */
        #rotate-lock {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f0f0f; z-index: 9999;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: #ff5252; text-align: center;
        }
        .rotate-anim {
            font-size: 5rem; margin-bottom: 20px;
            animation: phoneSpin 2s infinite ease-in-out;
        }
        @keyframes phoneSpin { 
            0%, 100% { transform: rotate(0deg); } 
            50% { transform: rotate(90deg); } 
        }
        
        @media screen and (orientation: portrait) {
            #game-wrapper { display: none !important; }
            #rotate-lock { display: flex !important; }
        }

        /* =========================================
           3. GAME LAYOUT
           ========================================= */
        #game-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- HUD (Top Bar) --- */
        #hud-bar {
            height: 12%; width: 100%;
            background: rgba(0,0,0,0.9);
            border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 50; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        
        .player-badge {
            display: flex; align-items: center; gap: 10px;
            background: #222; padding: 5px 15px; border-radius: 50px;
            border: 1px solid #444;
        }
        .bal-box {
            background: linear-gradient(135deg, #1e8449, #117a65);
            padding: 5px 20px; border-radius: 5px;
            border: 2px solid #2ecc71;
            text-shadow: 1px 1px 0 #000;
        }

        /* --- COMMENTARY TICKER --- */
        #ticker-wrap {
            position: absolute; top: 12%; left: 0; width: 100%; height: 30px;
            background: rgba(0,0,0,0.8); z-index: 40;
            display: flex; align-items: center; overflow: hidden;
            border-bottom: 1px solid #444;
        }
        #ticker-text {
            white-space: nowrap; color: var(--gold);
            font-family: 'Chakra Petch', sans-serif; letter-spacing: 1px;
            font-size: 0.9rem; padding-left: 100%;
            animation: tickerScroll 15s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-200%, 0, 0); }
        }

        /* =========================================
           4. RACETRACK ENVIRONMENT
           ========================================= */
        #world-stage {
            flex: 1; position: relative; overflow: hidden;
            background: var(--sky-gradient);
        }

        /* Sky Elements */
        .cloud {
            position: absolute; background: #fff; border-radius: 50px;
            opacity: 0.8; filter: blur(5px);
            animation: drift linear infinite;
        }
        @keyframes drift { from { transform: translateX(100vw); } to { transform: translateX(-200px); } }

        /* Background Mountains */
        .scenery {
            position: absolute; bottom: 55%; /* Raised higher */
            width: 200%; height: 40%;
            background: url('https://i.imgur.com/G3t1h0s.png') repeat-x bottom;
            background-size: contain; opacity: 0.9;
            z-index: 1;
        }
        
        /* Grandstand / Fence */
        .grandstand {
            position: absolute; bottom: 55%; width: 100%; height: 30px;
            background: repeating-linear-gradient(90deg, #fff 0, #fff 5px, #d32f2f 5px, #d32f2f 10px);
            z-index: 2; box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        /* --- THE TRACK (Green Turf) --- */
        #turf-track {
            position: absolute; bottom: 0; width: 100%; height: 60%; /* Increased Height */
            background: repeating-linear-gradient(
                0deg, 
                var(--turf-dark) 0%, 
                var(--turf-dark) 9%, 
                var(--turf-light) 10%
            ); /* Striped Grass Effect */
            perspective: 800px; z-index: 5;
            border-top: 5px solid #fff;
            overflow: hidden;
        }

        /* Lane Markers */
        .lane-line {
            position: absolute; width: 100%; height: 1px;
            background: rgba(255,255,255,0.3); z-index: 6;
        }

        /* Finish Line Banner */
        #finish-banner {
            position: absolute; top: 0; right: -150px; /* Hidden initially */
            height: 100%; width: 60px;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-color: #fff;
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            z-index: 20;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
            display: none;
            border-left: 5px solid #ffeb3b;
        }
        
        /* Finish Pole */
        .finish-pole {
            position: absolute; top: -20px; right: -10px; width: 10px; height: 120%;
            background: #d32f2f; z-index: 21;
        }

        /* =========================================
           5. HORSES & SPRITES
           ========================================= */
        .racer-group {
            position: absolute; left: 50px;
            width: 80px; height: 50px;
            transition: left 0.5s linear; /* Linear for smooth race */
            z-index: 10;
        }
        
        .horse-body {
            font-size: 3rem; 
            transform: scaleX(-1); /* Face Right */
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.4));
            animation: runCycle 0.4s infinite alternate ease-in-out;
        }
        
        .name-pill {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 2px 8px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold; white-space: nowrap;
            border: 1px solid var(--gold); z-index: 12;
        }
        
        /* Dirt Particles */
        .dirt-kick {
            position: absolute; bottom: 5px; left: -10px;
            width: 6px; height: 6px; background: #5d4037;
            border-radius: 50%; opacity: 0;
        }
        .running .dirt-kick { animation: kickDirt 0.3s infinite; }

        @keyframes runCycle {
            0% { transform: scaleX(-1) translateY(0) rotate(0deg); }
            100% { transform: scaleX(-1) translateY(-5px) rotate(3deg); }
        }
        @keyframes kickDirt {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(-30px, -20px) scale(2); opacity: 0; }
        }

        /* =========================================
           6. CONTROL PANEL (Bottom)
           ========================================= */
        #control-deck {
            height: 18%; width: 100%;
            background: #111; border-top: 4px solid #333;
            display: flex; align-items: center; justify-content: center;
            gap: 40px; padding: 10px; z-index: 50;
        }
        
        .c-group { display: flex; flex-direction: column; align-items: center; }
        .c-label { color: #888; font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 5px; }
        
        /* Dropdown */
        #horse-picker {
            background: #222; color: #fff; padding: 10px; border: 1px solid #444;
            border-radius: 5px; font-family: 'Oswald', sans-serif; font-size: 1.1rem;
            width: 180px; outline: none;
        }

        /* Bet Adjuster */
        .bet-mod {
            display: flex; background: #000; border: 1px solid #444; border-radius: 5px;
        }
        .b-btn {
            background: #333; color: #fff; width: 45px; border: none; font-size: 1.2rem; cursor: pointer;
        }
        .b-btn:active { background: #555; }
        #wager-input {
            background: transparent; border: none; color: var(--gold);
            width: 100px; text-align: center; font-size: 1.2rem; font-weight: bold;
        }

        /* START BUTTON */
        #launch-btn {
            background: linear-gradient(180deg, #d32f2f, #b71c1c);
            color: #fff; padding: 0 50px; height: 50px;
            font-family: 'Anton', sans-serif; font-size: 1.8rem;
            border: none; border-radius: 5px; box-shadow: 0 5px 0 #7f0000;
            letter-spacing: 2px; cursor: pointer; transform: skewX(-5deg);
        }
        #launch-btn:active { transform: skewX(-5deg) translateY(4px); box-shadow: none; }
        #launch-btn:disabled { background: #333; color: #555; box-shadow: none; cursor: not-allowed; }

        /* =========================================
           7. RESULTS LEADERBOARD (Premium Modal)
           ========================================= */
        #results-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        
        .board-card {
            background: #1a1a1a; width: 60%; max-width: 600px;
            border: 2px solid var(--gold); border-radius: 10px;
            overflow: hidden; box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }
        
        .board-header {
            background: var(--gold); color: #000; padding: 15px;
            text-align: center; font-family: 'Anton', sans-serif; font-size: 2.5rem;
            text-transform: uppercase;
        }
        
        .board-content { padding: 20px; }
        
        .result-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #333; color: #fff;
            font-size: 1.2rem;
        }
        .result-row:first-child { background: rgba(255, 215, 0, 0.1); color: var(--gold); font-weight: bold; }
        .result-row.user-pick { border: 1px solid #2ecc71; background: rgba(46, 204, 113, 0.1); }
        
        .rank-num { width: 30px; font-weight: bold; }
        .r-name { flex: 1; text-align: left; padding-left: 20px; }
        .r-payout { font-weight: bold; }

        .close-board {
            width: 100%; padding: 15px; background: #333; color: #fff;
            border: none; font-size: 1.2rem; cursor: pointer;
            text-transform: uppercase; font-weight: bold;
        }
        .close-board:hover { background: #444; }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <div id="rotate-lock">
        <div class="rotate-anim">📱</div>
        <h1>PLEASE ROTATE DEVICE</h1>
        <p>Premium experience requires landscape mode.</p>
    </div>

    <div id="game-wrapper">
        
        <div id="hud-bar">
            <div class="player-badge">
                <span>👤</span>
                <span class="text-sm text-gray-300 ml-2 uppercase">{{ user.username }}</span>
            </div>
            
            <div class="bal-box">
                <span class="text-xs text-green-200 mr-2">CREDITS</span>
                <span class="text-xl font-bold text-white">$<span id="bal-display">{{ balance }}</span></span>
            </div>
        </div>

        <div id="ticker-wrap">
            <div id="ticker-text">WELCOME TO THE GRAND TURF DERBY • PLACE YOUR BETS NOW • MINIMUM WAGER $1000 • WIN BIG PRIZES • GOOD LUCK!</div>
        </div>

        <div id="world-stage">
            <div id="sky-layer"></div> <div class="scenery" id="scenery-bg"></div>
            <div class="grandstand"></div>

            <div id="turf-track">
                <div id="finish-banner">
                    <div class="finish-pole"></div>
                </div>
                </div>
        </div>

        <div id="control-deck">
            <div class="c-group">
                <span class="c-label">SELECT RACER</span>
                <select id="horse-picker"></select>
            </div>

            <div class="c-group">
                <span class="c-label">BET AMOUNT (MIN $1000)</span>
                <div class="bet-mod">
                    <button class="b-btn" onclick="modBet(-1000)">-</button>
                    <input type="number" id="wager-input" value="1000" readonly>
                    <button class="b-btn" onclick="modBet(1000)">+</button>
                </div>
            </div>

            <button id="launch-btn" onclick="initRace()">RACE</button>
        </div>

    </div>

    <div id="results-modal">
        <div class="board-card">
            <div class="board-header" id="board-title">RACE RESULTS</div>
            <div class="board-content" id="board-list">
                </div>
            <button class="close-board" onclick="resetTable()">CLOSE & RACE AGAIN</button>
        </div>
    </div>

    <script>
        const socket = io();

        // --- CONFIG ---
        const config = {
            duration: 60, // 60 Seconds Race
            fps: 30,      // Animation Smoothness
            minBet: 1000
        };

        const horses = [
            { id: 0, name: 'Saksham', icon: '🐎', color: '#e74c3c' },
            { id: 1, name: 'Muskan', icon: '🦄', color: '#9b59b6' },
            { id: 2, name: 'Zoro', icon: '🦓', color: '#f1c40f' },
            { id: 3, name: 'Dev', icon: '🐆', color: '#e67e22' },
            { id: 4, name: 'Subhu', icon: '🐅', color: '#d35400' },
            { id: 5, name: 'Chemical', icon: '🧪', color: '#2ecc71' },
            { id: 6, name: 'Cutiee', icon: '🐇', color: '#ff7979' },
            { id: 7, name: 'Snackieee', icon: '🍟', color: '#f39c12' },
            { id: 8, name: 'Mayan', icon: '🐃', color: '#34495e' },
            { id: 9, name: 'Haru', icon: '🐕', color: '#95a5a6' }
        ];

        // --- STATE ---
        let raceActive = false;
        let positions = new Array(10).fill(0); // 0-100%
        let speeds = new Array(10).fill(0);
        let raceTimer = null;
        let raceResult = null; // Server Data
        let userPick = "";

        // --- SETUP ---
        const track = document.getElementById('turf-track');
        const picker = document.getElementById('horse-picker');
        const sky = document.getElementById('sky-layer');

        // 1. Build Lanes & Horses
        horses.forEach((h, i) => {
            // Dropdown
            let opt = document.createElement('option');
            opt.value = h.name;
            opt.innerText = `${h.icon} ${h.name}`;
            picker.appendChild(opt);

            // Visual Lane
            // Lane height calculation: 100% / 10 = 10%
            let laneY = i * 10; 
            
            // Lane Marker
            let line = document.createElement('div');
            line.className = 'lane-line';
            line.style.top = laneY + '%';
            track.appendChild(line);

            // Horse Container
            let wrap = document.createElement('div');
            wrap.className = 'racer-group';
            wrap.id = `racer-${i}`;
            wrap.style.top = (laneY + 1) + '%'; // Slight offset
            wrap.innerHTML = `
                <div class="name-pill" style="border-color:${h.color}">${h.name}</div>
                <div class="horse-body">${h.icon}</div>
                <div class="dirt-kick"></div>
            `;
            track.appendChild(wrap);
        });

        // 2. Add Clouds
        for(let j=0; j<6; j++) {
            let c = document.createElement('div');
            c.className = 'cloud';
            c.style.width = Math.random()*150 + 50 + 'px';
            c.style.height = Math.random()*50 + 20 + 'px';
            c.style.top = Math.random()*80 + 'px';
            c.style.animationDuration = Math.random()*20 + 20 + 's';
            sky.appendChild(c);
        }

        // --- GAMEPLAY LOGIC ---

        function modBet(val) {
            if(raceActive) return;
            let inp = document.getElementById('wager-input');
            let v = parseInt(inp.value) + val;
            if(v >= config.minBet) inp.value = v;
        }

        function initRace() {
            if(raceActive) return;
            
            const amt = parseInt(document.getElementById('wager-input').value);
            userPick = document.getElementById('horse-picker').value;

            if(amt < config.minBet) {
                alert(`Minimum Bet is $${config.minBet}`);
                return;
            }

            // Lock UI
            raceActive = true;
            document.getElementById('launch-btn').disabled = true;
            document.getElementById('launch-btn').innerText = "RACING IN PROGRESS...";
            
            // Start Scenery Scroll
            document.getElementById('scenery-bg').style.animation = "drift 60s linear infinite";

            // Server Request
            socket.emit('start_horse_race', { amount: amt, horse_name: userPick });
        }

        // --- SOCKETS ---
        socket.on('balance_update', d => {
            document.getElementById('bal-display').innerText = d.balance;
        });

        socket.on('race_error', d => {
            alert(d.msg);
            resetTable();
        });

        socket.on('race_result', data => {
            raceResult = data;
            startAnimationLoop();
        });

        // --- MAIN ANIMATION LOOP (60 Seconds) ---
        function startAnimationLoop() {
            updateTicker("THE GATES ARE OPEN! THEY ARE RACING! 🏁");
            
            let frame = 0;
            const totalFrames = config.duration * config.fps;
            const updateInterval = 1000 / config.fps;

            raceTimer = setInterval(() => {
                frame++;
                const progress = frame / totalFrames; // 0.0 to 1.0

                // Phase Logic
                if (progress < 0.90) {
                    runChaosMode(); // Random shuffle
                } else {
                    runFinishMode(progress); // Sort to positions
                }

                render();

                // Commentary
                if(frame % 150 === 0) randomCommentary();

                // End
                if(progress >= 1) {
                    endRace();
                }

            }, updateInterval);
        }

        function runChaosMode() {
            // Jitter positions to simulate overtaking
            for(let i=0; i<10; i++) {
                // Random speed change
                speeds[i] += (Math.random() - 0.5) * 2;
                // Cap speed
                if(speeds[i] > 3) speeds[i] = 3;
                if(speeds[i] < -2) speeds[i] = -2;
                
                positions[i] += speeds[i];
                
                // Keep within view bounds (10% - 80%)
                if(positions[i] < 5) { positions[i] = 5; speeds[i] += 1; }
                if(positions[i] > 75) { positions[i] = 75; speeds[i] -= 1; }
            }
        }

        function runFinishMode(progress) {
            // Show Finish Line Banner
            const banner = document.getElementById('finish-banner');
            banner.style.display = 'block';
            banner.style.right = '10%'; // Move into view

            // Move horses to their final ranks
            for(let i=0; i<10; i++) {
                let hName = horses[i].name;
                let rank = raceResult.ranking.indexOf(hName); // 0 = 1st
                
                // Target: 1st place -> 90%, Last -> 40%
                let targetPos = 90 - (rank * 5);
                
                // Lerp current to target
                let diff = targetPos - positions[i];
                positions[i] += diff * 0.05; // Smooth slide
            }
        }

        function render() {
            for(let i=0; i<10; i++) {
                const el = document.getElementById(`racer-${i}`);
                el.style.left = positions[i] + '%';
                
                // Add dust effect
                el.classList.add('running');
            }
        }

        function endRace() {
            clearInterval(raceTimer);
            document.getElementById('scenery-bg').style.animation = "none";
            
            // Show Modal
            showLeaderboard();
        }

        // --- LEADERBOARD LOGIC ---
        function showLeaderboard() {
            const modal = document.getElementById('results-modal');
            const title = document.getElementById('board-title');
            const list = document.getElementById('board-list');
            
            list.innerHTML = ''; // Clear old

            // Did user win?
            if (raceResult.win_amount > 0) {
                title.innerText = "🏆 VICTORY!";
                title.style.color = "#ffd700";
                updateTicker(`CONGRATULATIONS! YOU WON $${raceResult.win_amount.toLocaleString()}!`);
                // Update Balance visually
                document.getElementById('bal-display').innerText = raceResult.final_balance;
            } else {
                title.innerText = "RACE OVER";
                title.style.color = "#fff";
                updateTicker(`BETTER LUCK NEXT TIME. WINNER WAS ${raceResult.winner.toUpperCase()}.`);
            }

            // Generate Rows (Top 10)
            raceResult.ranking.forEach((name, idx) => {
                let rank = idx + 1;
                let row = document.createElement('div');
                
                // Is this the user's horse?
                let isUser = (name === userPick);
                let extraClass = isUser ? 'user-pick' : '';
                
                let payoutText = "";
                if(rank === 1) payoutText = "WINNER (5x)";
                else if(rank === 2) payoutText = "2nd (2x)";
                else if(rank === 3) payoutText = "3rd (1.2x)";
                else payoutText = "-";

                // Highlight user winnings
                if(isUser && raceResult.win_amount > 0) {
                    payoutText = `+$${raceResult.win_amount.toLocaleString()}`;
                }

                row.className = `result-row ${extraClass}`;
                row.innerHTML = `
                    <div class="rank-num">#${rank}</div>
                    <div class="r-name">${name}</div>
                    <div class="r-payout">${payoutText}</div>
                `;
                list.appendChild(row);
            });

            modal.style.display = 'flex';
        }

        function resetTable() {
            document.getElementById('results-modal').style.display = 'none';
            document.getElementById('launch-btn').disabled = false;
            document.getElementById('launch-btn').innerText = "RACE";
            document.getElementById('finish-banner').style.display = 'none';
            
            raceActive = false;
            positions.fill(0);
            render(); // Reset positions visually
            
            updateTicker("PLACE YOUR BETS FOR THE NEXT RACE!");
        }

        function updateTicker(txt) {
            document.getElementById('ticker-text').innerText = txt;
        }

        function randomCommentary() {
            const phrases = [
                "LOOK AT THAT SPEED!", "THEY ARE BUNCHED UP TIGHT!",
                "WHO WILL TAKE THE LEAD?", "IT'S ANYONE'S GAME!",
                "NECK AND NECK!", "THUNDERING DOWN THE TURF!"
            ];
            updateTicker(phrases[Math.floor(Math.random()*phrases.length)]);
        }

    </script>
</body>
</html>
