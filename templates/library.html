<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DORAEMON STREAMING HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 1. PREMIUM BACKGROUND & ANIMATIONS --- */
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Moving Stars Background */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('http://www.script-tutorials.com/demos/360/images/stars.png') repeat top center;
            z-index: -2;
            opacity: 0.6;
            animation: move-stars 200s linear infinite;
        }
        .twinkling {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('http://www.script-tutorials.com/demos/360/images/twinkling.png') repeat top center;
            z-index: -1;
            opacity: 0.4;
            animation: move-twinkling 200s linear infinite;
        }

        @keyframes move-stars { from {background-position:0 0;} to {background-position:-10000px 5000px;} }
        @keyframes move-twinkling { from {background-position:0 0;} to {background-position:10000px 5000px;} }

        /* CRT Scanline Effect */
        .scanline {
            width: 100%; height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 170, 255, 0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            background-size: 100% 100%;
            position: fixed; bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            80% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        /* --- 2. TOUCH TRAIL ANIMATION --- */
        .trail {
            position: absolute;
            height: 8px; width: 8px;
            border-radius: 50%;
            background: #00aaff;
            pointer-events: none;
            box-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
            animation: fadeOut 1s linear forwards;
            z-index: 9999;
        }
        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- 3. MOBILE OPTIMIZED CARDS --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00aaff; border-radius: 4px; }

        .ep-card {
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid rgba(0, 170, 255, 0.2);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        /* Mobile Active State */
        .ep-card:active, .ep-card:hover {
            background: rgba(0, 170, 255, 0.15);
            border-color: #00aaff;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
        }

        .btn-watch {
            background: linear-gradient(90deg, #0088cc 0%, #005f8f 100%);
            color: white; padding: 8px 16px; border-radius: 6px;
            font-weight: 700; font-family: 'Orbitron'; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-watch:active { transform: scale(0.95); }

        /* Neon Text Glow */
        .neon-text {
            text-shadow: 0 0 5px rgba(0, 170, 255, 0.8), 0 0 10px rgba(0, 170, 255, 0.5);
        }
    </style>
</head>
<body class="p-4 pb-20 md:p-10 max-w-4xl mx-auto selection:bg-blue-500 selection:text-white">

    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="scanline"></div>

    <div class="flex flex-col md:flex-row justify-between items-center mb-8 md:mb-12 border-b border-blue-900/50 pb-6 relative">
        <div class="text-center md:text-left w-full">
            <h1 class="text-4xl md:text-6xl font-black font-[Orbitron] text-transparent bg-clip-text bg-gradient-to-t from-blue-500 to-cyan-300 neon-text tracking-tighter">
                DORAEMON
            </h1>
            <div class="flex items-center justify-center md:justify-start gap-2 mt-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <div class="text-blue-400 tracking-[4px] text-xs font-bold uppercase">
                    DATABASE // {{ current_season }}
                </div>
            </div>
        </div>
        
        <a href="https://t.me/+0Wpciy5U1-c3NDBl" target="_blank" class="mt-5 w-full md:w-auto text-center bg-blue-900/30 border border-blue-500/50 text-blue-200 text-xs px-4 py-3 rounded-lg hover:bg-blue-500 hover:text-white transition animate-pulse">
            ⚠️ JOIN CHANNEL TO UNLOCK
        </a>
    </div>

    <div class="flex flex-col gap-3">
        {% for ep in episodes %}
        <div class="ep-card group cursor-pointer" onclick="window.location='{{ ep.telegram_link }}'">
            <div class="flex items-center gap-4 overflow-hidden">
                <div class="h-10 w-10 min-w-[2.5rem] rounded-lg bg-black/50 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-[Orbitron] text-sm shadow-[0_0_10px_rgba(0,170,255,0.2)]">
                    #{{ loop.index }}
                </div>
                <div class="flex flex-col truncate pr-2">
                    <div class="text-base font-bold text-gray-100 truncate group-hover:text-blue-300 transition">{{ ep.title }}</div>
                    <div class="text-[10px] text-gray-400 font-mono flex gap-2">
                        <span class="bg-blue-900/40 px-1 rounded text-blue-300">HD</span>
                        <span class="bg-purple-900/40 px-1 rounded text-purple-300">DUAL</span>
                    </div>
                </div>
            </div>
            
            <button class="btn-watch">
                ▶
            </button>
        </div>
        {% else %}
        <div class="flex flex-col items-center justify-center py-20 border border-dashed border-gray-800 rounded-xl bg-black/40 backdrop-blur-sm">
            <div class="text-5xl mb-4">🛸</div>
            <h2 class="text-2xl font-bold text-gray-500 font-[Orbitron]">NO SIGNAL</h2>
            <p class="text-gray-600 text-sm text-center px-4">Admin is calibrating the satellite.<br>Check back later!</p>
        </div>
        {% endfor %}
    </div>

    <div class="text-center text-gray-700 text-[10px] mt-10 mb-4 font-mono uppercase tracking-widest">
        Secure Stream • Render • Supabase
    </div>

    <script>
        document.addEventListener('mousemove', function(e) { createTrail(e.clientX, e.clientY); });
        document.addEventListener('touchmove', function(e) { createTrail(e.touches[0].clientX, e.touches[0].clientY); });

        function createTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'trail';
            trail.style.left = x + 'px';
            trail.style.top = y + 'px';
            document.body.appendChild(trail);

            setTimeout(() => {
                trail.remove();
            }, 1000);
        }
    </script>
</body>
</html>
