<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-purple: #bc13fe; 
            --neon-cyan: #00f3ff; 
            --neon-red: #ff0044; 
            --gold: #ffd700;
            --bg: #020205; 
            --glass: rgba(20, 20, 30, 0.6);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: white; margin: 0; 
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column;
        }

        /* --- ANIMATED BACKGROUND --- */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* --- HEADER --- */
        .navbar {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn { 
            text-decoration: none; color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 14px; 
            border: 1px solid var(--neon-cyan); padding: 5px 15px; border-radius: 20px; transition: 0.3s;
        }
        .back-btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }
        
        .balance-container { text-align: right; }
        .balance-label { font-size: 10px; color: #888; display: block; }
        .balance-val { font-size: 20px; color: var(--gold); font-family: 'Orbitron'; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* --- MAIN CONTAINER --- */
        .main-container {
            width: 100%; max-width: 600px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; gap: 40px;
        }

        /* --- GAME CARD STYLES --- */
        .game-panel {
            background: var(--glass); border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; backdrop-filter: blur(15px);
            transition: transform 0.3s;
        }
        .game-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
        }

        /* --- SLOTS --- */
        .panel-slots { color: var(--neon-purple); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .game-title { font-family: 'Orbitron'; font-size: 24px; color: white; text-shadow: 0 0 10px currentColor; margin: 0; }
        .game-tag { font-size: 10px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid currentColor; color: currentColor; }

        .slot-machine-frame {
            background: #000; border: 2px solid #333; border-radius: 15px; padding: 10px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8); margin-bottom: 20px;
        }
        .reels-container { display: flex; justify-content: space-between; gap: 5px; }
        .reel {
            flex: 1; height: 100px; background: #111; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 45px;
            border: 1px solid #222; overflow: hidden; position: relative;
        }
        .reel::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent 40%, transparent 60%, rgba(0,0,0,0.8));
            pointer-events: none;
        }
        
        .spinning { animation: blurAnim 0.1s infinite; filter: blur(4px); }
        @keyframes blurAnim { 0% { transform: translateY(-2px); } 50% { transform: translateY(2px); } 100% { transform: translateY(-2px); } }

        .action-btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            font-family: 'Orbitron'; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s; color: white; text-transform: uppercase;
            letter-spacing: 1px; position: relative; overflow: hidden;
        }
        .btn-purple { background: linear-gradient(45deg, #8900ff, #ff00de); box-shadow: 0 5px 20px rgba(188, 19, 254, 0.3); }
        .btn-purple:hover { box-shadow: 0 0 30px rgba(188, 19, 254, 0.6); }
        .btn-red { background: linear-gradient(45deg, #ff0000, #ff4444); box-shadow: 0 5px 20px rgba(255, 0, 68, 0.3); }
        .btn-red:hover { box-shadow: 0 0 30px rgba(255, 0, 68, 0.6); }
        
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        /* --- DEATH ROLL --- */
        .panel-death { color: var(--neon-red); }
        
        .bet-input-container { position: relative; margin: 25px 0; }
        .bet-label { position: absolute; top: -10px; left: 15px; background: #13131a; padding: 0 5px; color: #888; font-size: 10px; }
        .bet-input {
            width: 100%; background: transparent; border: 1px solid #444; color: white;
            padding: 15px; border-radius: 8px; font-family: 'Orbitron'; font-size: 20px;
            text-align: center; outline: none; transition: 0.3s;
        }
        .bet-input:focus { border-color: var(--neon-red); box-shadow: 0 0 15px rgba(255, 0, 68, 0.2); }

        .risk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .risk-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 15px 10px;
            border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .risk-val { font-family: 'Orbitron'; font-size: 20px; display: block; margin-bottom: 5px; color: #aaa; }
        .risk-sub { font-size: 10px; color: #555; text-transform: uppercase; }
        
        .risk-card:hover { border-color: #555; background: rgba(255,255,255,0.05); }
        .risk-card.active { border-color: var(--neon-red); background: rgba(255, 0, 68, 0.1); box-shadow: 0 0 20px rgba(255, 0, 68, 0.2); }
        .risk-card.active .risk-val { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        .risk-card.active .risk-sub { color: #fff; }

        /* --- STATUS MESSAGES --- */
        .status-msg { text-align: center; font-size: 12px; margin-top: 10px; min-height: 15px; color: #666; letter-spacing: 1px; }

        /* --- WIN MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .win-modal {
            background: rgba(10,10,15,0.95); border: 2px solid var(--gold);
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .win-title { font-family: 'Orbitron'; font-size: 30px; margin: 0; color: white; }
        .win-amount { font-family: 'Orbitron'; font-size: 45px; margin: 15px 0; color: var(--gold); text-shadow: 0 0 20px var(--gold); }
        .modal-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 30px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s;
        }
        .modal-btn:hover { background: var(--gold); color: black; box-shadow: 0 0 20px var(--gold); }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="navbar">
        <a href="/" class="back-btn">← LOBBY</a>
        <div class="balance-container">
            <span class="balance-label">LIQUID ASSETS</span>
            <div class="balance-val">$<span id="bal">{{ "{:,}".format(balance) }}</span></div>
        </div>
    </div>

    <div class="main-container">

        <div class="game-panel panel-slots">
            <div class="panel-header">
                <h2 class="game-title">NEON SLOTS</h2>
                <span class="game-tag">JACKPOT: 10M</span>
            </div>

            <div class="slot-machine-frame">
                <div class="reels-container">
                    <div class="reel" id="r1">🍒</div>
                    <div class="reel" id="r2">💎</div>
                    <div class="reel" id="r3">🍒</div>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:12px; color:#888; margin-bottom:15px;">
                <span>ENTRY: $50,000</span>
                <span id="slot-status">SYSTEM READY</span>
            </div>

            <button class="action-btn btn-purple" id="btn-spin" onclick="spinSlots()">SPIN REELS</button>
        </div>

        <div class="game-panel panel-death">
            <div class="panel-header">
                <h2 class="game-title" style="color:var(--neon-red)">DEATH ROLL</h2>
                <span class="game-tag" style="border-color:var(--neon-red); color:var(--neon-red)">HIGH RISK</span>
            </div>

            <div class="bet-input-container">
                <span class="bet-label">WAGER AMOUNT</span>
                <input type="number" id="betInput" class="bet-input" placeholder="0">
            </div>

            <div class="risk-grid">
                <div class="risk-card" onclick="selectMult(2, this)">
                    <span class="risk-val">2x</span>
                    <span class="risk-sub">10% CHANCE</span>
                </div>
                <div class="risk-card" onclick="selectMult(3, this)">
                    <span class="risk-val">3x</span>
                    <span class="risk-sub">7% CHANCE</span>
                </div>
                <div class="risk-card" onclick="selectMult(5, this)">
                    <span class="risk-val">5x</span>
                    <span class="risk-sub">5% CHANCE</span>
                </div>
                <div class="risk-card" onclick="selectMult(10, this)">
                    <span class="risk-val">10x</span>
                    <span class="risk-sub">1% CHANCE</span>
                </div>
            </div>

            <div class="status-msg" id="death-msg">SELECT MULTIPLIER TO BEGIN</div>

            <button class="action-btn btn-red" id="btn-roll" onclick="playDeathRoll()">EXECUTE ROLL</button>
        </div>

    </div>

    <div class="modal-overlay" id="winModal">
        <div class="win-modal">
            <h2 class="win-title">BIG WIN!</h2>
            <div class="win-amount" id="winDisplay">+$0</div>
            <button class="modal-btn" onclick="document.getElementById('winModal').style.display='none'">CLAIM</button>
        </div>
    </div>

    <script>
        // --- ANIMATED BACKGROUND ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() { 
                this.x = Math.random() * width; 
                this.y = Math.random() * height; 
                this.size = Math.random() * 2; 
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5;
            }
            update() { 
                this.x += this.speedX; this.y += this.speedY; 
                if (this.x < 0) this.x = width; if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height; if (this.y > height) this.y = 0;
            }
            draw() { 
                ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
            }
        }
        
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        function animateBg() { 
            ctx.clearRect(0, 0, width, height); 
            particles.forEach(p => { p.update(); p.draw(); }); 
            requestAnimationFrame(animateBg); 
        }
        animateBg();

        // --- GAME LOGIC ---
        function updateBal(val) { document.getElementById('bal').innerText = val.toLocaleString(); }
        function showWin(amt) {
            document.getElementById('winDisplay').innerText = "+$" + amt.toLocaleString();
            document.getElementById('winModal').style.display = 'flex';
        }

        // --- SLOTS ---
        async function spinSlots() {
            const btn = document.getElementById('btn-spin');
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            const msg = document.getElementById('slot-status');

            // Prevent Double Click
            btn.disabled = true;
            msg.innerText = "SPINNING..."; msg.style.color = "#ccc";
            reels.forEach(r => r.classList.add('spinning'));

            let interval = setInterval(() => {
                const icons = ["💎","🍎","🥭","7️⃣","🏆","🍒"];
                reels.forEach(r => r.innerText = icons[Math.floor(Math.random()*icons.length)]);
            }, 60);

            try {
                const res = await fetch('/api/spin', { method: 'POST' });
                const data = await res.json();

                setTimeout(() => {
                    clearInterval(interval);
                    reels.forEach(r => r.classList.remove('spinning'));
                    
                    if(data.status === 'error') {
                        msg.innerText = data.msg; msg.style.color = '#ff3333';
                    } else {
                        reels[0].innerText = data.slots[0];
                        reels[1].innerText = data.slots[1];
                        reels[2].innerText = data.slots[2];
                        updateBal(data.balance);
                        
                        msg.innerText = data.msg;
                        msg.style.color = data.win > 0 ? '#00ff00' : '#ccc';
                        
                        if(data.win > 0) showWin(data.win);
                    }
                    btn.disabled = false;
                }, 1500); 
            } catch(e) {
                btn.disabled = false;
                msg.innerText = "Connection Error";
            }
        }

        // --- DEATH ROLL ---
        let selectedMult = 0;

        function selectMult(val, el) {
            selectedMult = val;
            document.querySelectorAll('.risk-card').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('death-msg').innerText = `TARGET LOCKED: ${val}x MULTIPLIER`;
        }

        async function playDeathRoll() {
            const btn = document.getElementById('btn-roll');
            const amt = document.getElementById('betInput').value;
            const msg = document.getElementById('death-msg');

            if(!amt || amt <= 0) { msg.innerText = "INVALID AMOUNT"; msg.style.color = "#ff3333"; return; }
            if(!selectedMult) { msg.innerText = "SELECT RISK LEVEL"; msg.style.color = "#ff3333"; return; }

            btn.disabled = true;
            btn.innerHTML = "CALCULATING FATE...";
            msg.innerText = "PROCESSING TRANSACTION..."; msg.style.color = "#ccc";

            try {
                const res = await fetch('/api/satta', {
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ amount: amt, multiplier: selectedMult })
                });
                const data = await res.json();

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = "EXECUTE ROLL";
                    
                    if(data.status === 'error') {
                        msg.innerText = data.msg; msg.style.color = "#ff3333";
                    } else {
                        updateBal(data.balance);
                        msg.innerText = data.msg;
                        msg.style.color = data.won ? "#00ff00" : "#ff3333";
                        if(data.won) showWin(amt * selectedMult);
                    }
                }, 1000); 
            } catch(e) {
                btn.disabled = false;
                btn.innerHTML = "EXECUTE ROLL";
                msg.innerText = "Network Error";
            }
        }
    </script>
</body>
</html>
