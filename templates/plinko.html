<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLINKO: SQUARE GRID</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CORE STYLES & VARIABLES
           ========================================= */
        :root {
            --neon-pink: #ff0055;
            --neon-cyan: #00ffff;
            --neon-gold: #ffd700;
            --neon-purple: #bc13fe;
            --void-bg: #020205;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--void-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh; width: 100vw;
            touch-action: none; /* Critical for mobile game feel */
        }

        /* =========================================
           2. LAYERS (Z-INDEX MANAGEMENT)
           ========================================= */
        
        /* Layer 1: Background Animation (Stars) */
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        /* Layer 2: Physics Game Container */
        #game-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* Layer 3: Touch/Mouse Trails */
        #trailCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        /* Layer 4: UI Overlay */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column;
        }

        /* =========================================
           3. UI COMPONENTS
           ========================================= */

        /* Header */
        .header {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }

        .game-title {
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.5rem;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--neon-cyan);
        }

        .balance-pill {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid var(--neon-gold);
            padding: 5px 15px; border-radius: 30px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }
        .bal-val {
            font-family: 'Share Tech Mono'; font-size: 1.3rem; color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold);
        }

        /* Controls Area */
        .controls-wrapper {
            margin-top: auto; /* Push to bottom */
            background: rgba(5, 5, 10, 0.95);
            border-top: 2px solid var(--neon-purple);
            padding: 20px; padding-bottom: 30px;
            pointer-events: auto;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Neon Glow Line on top of controls */
        .controls-wrapper::before {
            content: ''; position: absolute; top: -2px; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
            animation: borderRun 2s linear infinite;
        }
        @keyframes borderRun { 0% {filter: hue-rotate(0deg);} 100% {filter: hue-rotate(360deg);} }

        /* Bet Controls */
        .bet-control-row {
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .btn-qty {
            width: 50px; height: 50px; background: #1a1a2e; border: 1px solid #333;
            color: white; border-radius: 12px; font-size: 1.5rem; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 0 #000;
        }
        .btn-qty:active { transform: translateY(4px); box-shadow: none; }

        .bet-input-display {
            flex: 1; max-width: 150px;
            background: #000; border: 2px solid #333;
            color: white; text-align: center;
            font-family: 'Orbitron'; font-size: 1.5rem;
            padding: 10px; border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* DROP BUTTON (The Big One) */
        .btn-drop {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--neon-pink) 0%, #ff00aa 100%);
            border: none; border-radius: 12px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.4rem; letter-spacing: 2px;
            color: white; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4), 0 6px 0 #990033;
            transition: all 0.1s; position: relative; overflow: hidden;
        }
        .btn-drop:active { transform: translateY(6px); box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        
        /* Shine effect on button */
        .btn-drop::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% {left: -100%;} 20% {left: 200%;} 100% {left: 200%;} }

        /* Win Popup */
        #win-popup {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-family: 'Orbitron'; font-weight: 900; font-size: 3rem;
            color: white; text-shadow: 0 0 20px white;
            pointer-events: none; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; display: flex; flex-direction: column; align-items: center;
        }
        .win-sub { font-size: 1.2rem; color: var(--neon-gold); font-family: 'Rajdhani'; }

    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div id="game-container"></div>

    <canvas id="trailCanvas"></canvas>

    <div class="ui-layer">
        
        <div class="header">
            <div class="game-title">PLINKO <span style="font-size:0.8em; color:var(--neon-cyan)">// SQUARE</span></div>
            <div class="balance-pill">
                <span style="font-size:0.8rem; opacity:0.7;">BAL</span>
                <span id="bal" class="bal-val">{{ "{:,}".format(balance) }}</span>
            </div>
        </div>

        <div style="flex: 1;"></div>

        <div id="win-popup">
            <span id="win-mult">10x</span>
            <span id="win-amt" class="win-sub">+$10,000</span>
        </div>

        <div class="controls-wrapper">
            <div class="bet-control-row">
                <button class="btn-qty" onclick="adjBet(-1000)">-</button>
                <input type="number" id="bet-input" class="bet-input-display" value="1000" readonly>
                <button class="btn-qty" onclick="adjBet(1000)">+</button>
            </div>
            <div class="text-center text-gray-500 text-xs font-mono tracking-widest mt-1 mb-2">
                ROWS: 16 | LAYOUT: FULL GRID | MAX: 10x
            </div>
            <button class="btn-drop" onclick="dropBall()">DEPLOY BALL</button>
        </div>
    </div>

    <script>
        // =========================================
        // 1. CONFIGURATION & CONSTANTS
        // =========================================
        const CONFIG = {
            rows: 16,               // Number of rows deep
            cols: 17,               // Number of columns wide (buckets)
            pegSize: 3.5,           // Slightly larger pegs for grid
            ballSize: 5.5,          // Ball size
            gravity: 1.5,           // Standard gravity
            restitution: 0.5,       // Bounciness 
            friction: 0.002,        // Air resistance
            colors: {
                ball: '#ff0055',
                peg: '#ffffff',
                pegActive: '#00ffff'
            }
        };

        // NEW MULTIPLIERS (Max 10x, Square Grid Distribution)
        // 17 Buckets. High on edges, low in middle.
        const MULTIPLIERS = [
            10, 5, 3, 2, 1.5, 1, 0.5, 0.2, 0.2, 0.2, 0.5, 1, 1.5, 2, 3, 5, 10
        ];
        
        // New Color Mapping (Red=High, Yellow=Mid, Cyan=Low)
        const BUCKET_COLORS = [
            '#ff0000', '#ff4400', '#ff8800', '#ffcc00', '#ffff00', '#aaff00', 
            '#00ffff', '#00ffff', '#00ffff', '#00ffff', '#00ffff', 
            '#aaff00', '#ffff00', '#ffcc00', '#ff8800', '#ff4400', '#ff0000'
        ];

        // =========================================
        // 2. MATTER.JS SETUP
        // =========================================
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Composite = Matter.Composite,
              Bodies = Matter.Bodies,
              Events = Matter.Events,
              Body = Matter.Body,
              Vector = Matter.Vector;

        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = CONFIG.gravity;

        // Custom Canvas Renderer Setup
        const container = document.getElementById('game-container');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        container.appendChild(canvas);

        let width, height;
        let pins = [];
        let buckets = [];
        let particles = []; // Explosion particles
        let spawnWidthRange = 0;

        function resizeGame() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            initBoard();
        }
        window.addEventListener('resize', resizeGame);

        // =========================================
        // 3. BOARD GENERATION (SQUARE GRID)
        // =========================================
        function initBoard() {
            Composite.clear(world);
            pins = [];
            buckets = [];
            
            // Calculate Spacing for Square Grid
            const padding = width * 0.05;
            const usableWidth = width - (padding * 2);
            // Spacing based on number of columns
            const spacing = usableWidth / CONFIG.cols; 
            
            const startY = height * 0.1; // Start 10% down
            const startX = (width - usableWidth) / 2 + (spacing/2);

            // 1. GENERATE PINS (SQUARE GRID WITH OFFSET)
            for (let row = 0; row < CONFIG.rows; row++) {
                // Offset every other row for classic Pachinko grid
                const rowOffset = (row % 2 === 1) ? spacing / 2 : 0;
                
                // Adjust column count for offset rows to keep edges clean
                let colsInRow = CONFIG.cols;
                if(row % 2 === 1) colsInRow = CONFIG.cols - 1;

                for (let col = 0; col < colsInRow; col++) {
                    const x = startX + (col * spacing) + rowOffset;
                    const y = startY + (row * spacing);
                    
                    const pin = Bodies.circle(x, y, CONFIG.pegSize, {
                        isStatic: true,
                        label: 'pin',
                        render: { visible: false },
                        restitution: 0.5,
                        friction: 0
                    });
                    
                    pin.glow = 0;
                    pins.push(pin);
                    Composite.add(world, pin);
                }
            }

            // Define spawn range for ball drop (full width of grid)
            spawnWidthRange = (CONFIG.cols - 2) * spacing;

            // 2. GENERATE BUCKETS
            const bucketY = startY + (CONFIG.rows * spacing) + (spacing/2);
            const bucketW = spacing - 2;
            
            for (let i = 0; i < MULTIPLIERS.length; i++) {
                // Align buckets beneath the columns
                const x = startX + (i * spacing);

                const bucket = Bodies.rectangle(x, bucketY + 50, bucketW, 100, {
                    isStatic: true,
                    isSensor: true,
                    label: `bucket-${i}`,
                    render: { visible: false }
                });
                
                buckets.push({
                    body: bucket,
                    val: MULTIPLIERS[i],
                    color: BUCKET_COLORS[i],
                    x: x,
                    y: bucketY,
                    w: bucketW,
                    pulse: 0
                });
                
                Composite.add(world, bucket);

                // Splitter Walls
                const wall = Bodies.rectangle(x + spacing/2, bucketY + 50, 2, 100, {
                    isStatic: true,
                    render: {visible: false},
                    chamfer: { radius: 1 }
                });
                Composite.add(world, wall);
            }

            // Side Walls to keep ball in grid
            Composite.add(world, [
                Bodies.rectangle(startX - spacing, height/2, spacing, height, { isStatic: true, render: { visible: false } }),
                Bodies.rectangle(startX + (CONFIG.cols * spacing), height/2, spacing, height, { isStatic: true, render: { visible: false } })
            ]);
        }

        // Initialize immediately
        resizeGame();

        // =========================================
        // 4. GAMEPLAY LOGIC
        // =========================================
        
        function adjBet(val) {
            const el = document.getElementById('bet-input');
            let v = parseInt(el.value) + val;
            if(v < 100) v = 100;
            if(v > 100000) v = 100000;
            el.value = v;
        }

        async function dropBall() {
            const betInput = document.getElementById('bet-input');
            const balEl = document.getElementById('bal');
            let bet = parseInt(betInput.value);
            let balance = parseInt(balEl.innerText.replace(/,/g, ''));

            if (bet > balance) {
                const btn = document.querySelector('.btn-drop');
                btn.style.transform = 'translateX(10px)';
                setTimeout(()=>btn.style.transform='translateX(0)', 100);
                setTimeout(()=>btn.style.transform='translateX(-10px)', 200);
                setTimeout(()=>btn.style.transform='translateX(0)', 300);
                return;
            }

            balEl.innerText = (balance - bet).toLocaleString();

            // Spawn Ball randomly across the grid width
            const randXOffset = (Math.random() - 0.5) * spawnWidthRange;
            const spawnX = (width / 2) + randXOffset;

            const ball = Bodies.circle(spawnX, 30, CONFIG.ballSize, {
                restitution: CONFIG.restitution,
                friction: CONFIG.friction,
                density: 1,
                label: 'ball',
                collisionFilter: { group: -1 }
            });
            
            ball.betAmt = bet;
            ball.trail = [];
            
            Composite.add(world, ball);
        }

        // =========================================
        // 5. PHYSICS EVENTS & RESULT HANDLING
        // =========================================
        
        Events.on(engine, 'collisionStart', (evt) => {
            evt.pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;
                const ball = bodyA.label === 'ball' ? bodyA : (bodyB.label === 'ball' ? bodyB : null);
                const other = bodyA === ball ? bodyB : bodyA;
                
                if(!ball) return;

                // 1. BALL HIT PIN
                if (other.label === 'pin') {
                    other.glow = 15;
                    spawnExplosion(ball.position.x, ball.position.y, '#00ffff', 3);
                }

                // 2. BALL HIT BUCKET
                if (other.label.startsWith('bucket')) {
                    const idx = parseInt(other.label.split('-')[1]);
                    const mult = MULTIPLIERS[idx];
                    handleResult(ball, mult, idx);
                }
            });
        });

        async function handleResult(ball, mult, bucketIdx) {
            Composite.remove(world, ball);
            buckets[bucketIdx].pulse = 20;
            spawnExplosion(buckets[bucketIdx].x, buckets[bucketIdx].y, buckets[bucketIdx].color, 15);

            try {
                const res = await fetch('/api/plinko/result', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ bet: ball.betAmt, multiplier: mult })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    document.getElementById('bal').innerText = data.new_balance.toLocaleString();
                    showWinPopup(mult, data.won);
                }
            } catch(e) { console.error(e); }
        }

        function showWinPopup(mult, amount) {
            const popup = document.getElementById('win-popup');
            const multEl = document.getElementById('win-mult');
            const amtEl = document.getElementById('win-amt');

            multEl.innerText = `${mult}x`;
            amtEl.innerText = `+$${amount.toLocaleString()}`;
            
            if(mult >= 10) multEl.style.color = '#ff0055'; // Red
            else if (mult >= 2) multEl.style.color = '#ffd700'; // Gold
            else multEl.style.color = '#fff'; // White

            popup.style.transform = 'translate(-50%, -50%) scale(1)';
            setTimeout(() => {
                popup.style.transform = 'translate(-50%, -50%) scale(0)';
            }, 1500);
        }

        // =========================================
        // 6. VISUAL ENGINE (CANVAS DRAWING)
        // =========================================
        
        function spawnExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Main Render Loop
        (function render() {
            ctx.clearRect(0, 0, width, height);
            
            // A. DRAW BUCKETS
            buckets.forEach(b => {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(b.x - b.w/2, b.y, b.w, 40);
                ctx.font = 'bold 10px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 5; ctx.shadowColor = b.color;
                ctx.fillText(`${b.val}x`, b.x, b.y + 25);
                ctx.shadowBlur = 0;

                if(b.pulse > 0) {
                    ctx.fillStyle = b.color; ctx.globalAlpha = b.pulse / 20;
                    ctx.fillRect(b.x - b.w/2, b.y, b.w, 40);
                    ctx.globalAlpha = 1; b.pulse--;
                }
            });

            // B. DRAW PINS
            pins.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.position.x, p.position.y, CONFIG.pegSize, 0, Math.PI*2);
                ctx.fillStyle = CONFIG.colors.peg;
                
                if(p.glow > 0) {
                    ctx.shadowBlur = 15; ctx.shadowColor = CONFIG.colors.pegActive;
                    ctx.fillStyle = CONFIG.colors.pegActive;
                    ctx.strokeStyle = CONFIG.colors.pegActive; ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.position.x, p.position.y, CONFIG.pegSize + (15 - p.glow), 0, Math.PI*2);
                    ctx.stroke();
                    p.glow--;
                } else { ctx.shadowBlur = 0; }
                ctx.fill();
            });

            // C. DRAW BALLS
            const bodies = Composite.allBodies(world);
            bodies.forEach(b => {
                if(b.label === 'ball') {
                    b.trail.push({x: b.position.x, y: b.position.y});
                    if(b.trail.length > 10) b.trail.shift();
                    ctx.beginPath();
                    for(let i=0; i<b.trail.length; i++) { ctx.lineTo(b.trail[i].x, b.trail[i].y); }
                    ctx.strokeStyle = CONFIG.colors.ball; ctx.lineWidth = 2; ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(b.position.x, b.position.y, CONFIG.ballSize, 0, Math.PI*2);
                    ctx.fillStyle = CONFIG.colors.ball;
                    ctx.shadowBlur = 10; ctx.shadowColor = CONFIG.colors.ball;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            });

            // D. DRAW PARTICLES
            for(let i=0; i<particles.length; i++) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if(p.life > 0) {
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                } else { particles.splice(i, 1); i--; }
            }
            ctx.globalAlpha = 1;

            Engine.update(engine, 1000/60);
            requestAnimationFrame(render);
        })();

        Runner.run(Runner.create(), engine);

        // =========================================
        // 7. BACKGROUND ANIMATION
        // =========================================
        (function() {
            const c = document.getElementById('bgCanvas'); const x = c.getContext('2d');
            let w, h; function resizeBg() { w=c.width=window.innerWidth; h=c.height=window.innerHeight; }
            window.addEventListener('resize', resizeBg); resizeBg();
            const stars = Array(200).fill().map(() => ({ x: Math.random()*w, y: Math.random()*h, z: Math.random()*2 + 0.5 }));
            function loop() {
                x.fillStyle = '#020205'; x.fillRect(0,0,w,h); x.fillStyle = '#fff';
                stars.forEach(s => { s.y += s.z; if(s.y > h) s.y = 0; const size = s.z * 1.5; x.globalAlpha = s.z / 2.5; x.fillRect(s.x, s.y, size, size); });
                x.globalAlpha = 1; requestAnimationFrame(loop);
            } loop();
        })();

        // =========================================
        // 8. INTERACTIVE TRAIL
        // =========================================
        (function() {
            const c = document.getElementById('trailCanvas'); const x = c.getContext('2d');
            let w, h; let trailPoints = [];
            function resizeT() { w=c.width=window.innerWidth; h=c.height=window.innerHeight; }
            window.addEventListener('resize', resizeT); resizeT();
            function addPoint(px, py) { trailPoints.push({ x: px, y: py, life: 1.0, angle: Math.random() * Math.PI * 2, color: Math.random() > 0.5 ? '#00ffff' : '#ff0055' }); }
            window.addEventListener('mousemove', e => addPoint(e.clientX, e.clientY));
            window.addEventListener('touchmove', e => { for(let i=0; i<e.touches.length; i++) addPoint(e.touches[i].clientX, e.touches[i].clientY); });
            function renderTrail() {
                x.clearRect(0,0,w,h);
                for(let i=0; i<trailPoints.length; i++) {
                    let p = trailPoints[i]; p.life -= 0.05;
                    if(p.life > 0) {
                        x.save(); x.translate(p.x, p.y); x.rotate(p.life * 2);
                        x.fillStyle = p.color; x.shadowBlur = 10; x.shadowColor = p.color; x.globalAlpha = p.life;
                        const size = 5 * p.life; x.fillRect(-size/2, -size/2, size, size); x.restore();
                    } else { trailPoints.splice(i, 1); i--; }
                } requestAnimationFrame(renderTrail);
            } renderTrail();
        })();
    </script>
</body>
</html>
