<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d0d0d; 
            color: white; 
            overflow: hidden; /* Scroll rokne ke liye */
            font-family: 'Roboto Mono', monospace;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Zoom rokne ke liye */
        }

        /* --- BACKGROUND STARS --- */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png') repeat;
            z-index: -1; opacity: 0.5;
        }

        /* --- GAME CANVAS --- */
        #game-area {
            position: relative;
            width: 100%;
            height: 60vh; /* Screen ka 60% hissa graph ke liye */
            border-bottom: 2px solid #333;
            background: radial-gradient(circle at bottom left, #1a1a1a, #000);
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- CENTER MULTIPLIER --- */
        .center-hud {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .big-multiplier {
            font-size: 4.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .status-badge {
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* --- CONTROLS PANEL (Fixed Bottom) --- */
        .control-panel {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 40vh; /* Screen ka 40% hissa controls ke liye */
            background: #151515;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        /* --- INPUTS --- */
        .input-group {
            display: flex;
            background: #000;
            border-radius: 12px;
            padding: 5px;
            border: 1px solid #333;
        }
        .btn-minus, .btn-plus {
            width: 50px; height: 50px;
            background: #222; border-radius: 8px;
            font-size: 1.5rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .bet-input {
            flex: 1;
            background: transparent;
            text-align: center;
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
            border: none; outline: none;
        }

        /* --- MAIN BUTTON --- */
        #action-btn {
            width: 100%;
            height: 70px;
            border-radius: 15px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        #action-btn:active { transform: scale(0.97); }
        
        /* State Colors */
        .btn-green { background: linear-gradient(to bottom, #2ecc71, #27ae60); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-red { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: white; }
        .btn-wait { background: #333; color: #777; }
        .btn-orange { background: linear-gradient(to bottom, #f1c40f, #f39c12); color: black; }

        /* --- ANIMATIONS --- */
        .crashed-text { color: #e74c3c !important; text-shadow: 0 0 20px red; animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translate(-50%, -50%) translateX(0);} 25% {transform: translate(-50%, -50%) translateX(-5px);} 75% {transform: translate(-50%, -50%) translateX(5px);} }

        /* --- TOP BAR --- */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px;
            display: flex; justify-content: space-between;
            z-index: 20;
        }
        .balance-box {
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="top-bar">
        <div class="text-pink-500 font-bold text-xl tracking-wider">CRASH 🚀</div>
        <div class="balance-box">
            <span class="text-xs text-gray-400">BALANCE</span>
            <span class="text-green-400 font-bold ml-1">$<span id="balance">Loading...</span></span>
        </div>
    </div>

    <div id="game-area">
        <canvas id="graph"></canvas>
        
        <div class="center-hud">
            <div id="status-text" class="status-badge">CONNECTING...</div>
            <div id="multiplier" class="big-multiplier">1.00x</div>
        </div>
    </div>

    <div class="control-panel">
        
        <div class="input-group">
            <div class="btn-minus" onclick="adjustBet(-100)">-</div>
            <input type="number" id="bet-amount" value="1000" class="bet-input" readonly>
            <div class="btn-plus" onclick="adjustBet(100)">+</div>
        </div>

        <button id="action-btn" class="btn-wait" onclick="handleAction()" disabled>
            WAITING...
        </button>

        <div class="text-center text-xs text-gray-500 mt-2">
            AUTO CASH OUT IS DISABLED • 10x LOSS PENALTY ACTIVE
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');
        const multDisplay = document.getElementById('multiplier');
        const statusDisplay = document.getElementById('status-text');
        const actionBtn = document.getElementById('action-btn');

        // --- GAME VARIABLES ---
        let gameState = 'WAITING';
        let myBet = 0;
        let isBetting = false;
        let dataPoints = [];
        let animationFrame;
        
        // Plane Image (Emoji fallback for safety)
        const planeImg = new Image();
        planeImg.src = 'https://cdn-icons-png.flaticon.com/512/7893/7893979.png'; // Red Plane Icon

        // --- RESIZE LOGIC ---
        function resize() {
            canvas.width = document.getElementById('game-area').clientWidth;
            canvas.height = document.getElementById('game-area').clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING ENGINE (The "Game" Look) ---
        function drawGame(currentMult, status) {
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);

            // 1. Draw Grid (Tech Look)
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<w; x+=50) { ctx.moveTo(x,0); ctx.lineTo(x,h); }
            for(let y=0; y<h; y+=50) { ctx.moveTo(0,y); ctx.lineTo(w,y); }
            ctx.stroke();

            if (dataPoints.length < 2) return;

            // 2. Calculate Scales (Zoom Out Effect)
            // Jaise jaise multiplier badhega, graph chhota hoga taaki fit aaye
            const maxValX = Math.max(dataPoints.length, 100); // Time axis
            const maxValY = Math.max(currentMult * 1.5, 2);   // Multiplier axis

            // 3. Draw The Curve
            ctx.beginPath();
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = status === 'CRASHED' ? '#e74c3c' : '#f1c40f'; // Red or Yellow line

            let lastX = 0, lastY = h;

            for (let i = 0; i < dataPoints.length; i++) {
                const x = (i / maxValX) * w;
                // Y axis logic: Bottom (h) is 1.00x, Top (0) is maxValY
                const normalizedY = (dataPoints[i] - 1) / (maxValY - 1);
                const y = h - (normalizedY * h) - 40; // -40 padding bottom

                if (i === 0) ctx.moveTo(x, y);
                else {
                    // Smooth curve
                    const cpX = (lastX + x) / 2;
                    ctx.quadraticCurveTo(lastX, lastY, cpX, (lastY + y)/2);
                    ctx.lineTo(x, y);
                }
                lastX = x;
                lastY = y;
            }
            ctx.stroke();

            // 4. Fill Area Under Graph
            ctx.lineTo(lastX, h);
            ctx.lineTo(0, h);
            ctx.fillStyle = status === 'CRASHED' 
                ? 'rgba(231, 76, 60, 0.2)' 
                : 'rgba(241, 196, 15, 0.1)';
            ctx.fill();

            // 5. Draw Plane at Tip
            if (status === 'RUNNING') {
                const pSize = 40;
                ctx.save();
                ctx.translate(lastX, lastY); // Move to tip
                ctx.rotate(-0.2); // Thoda sa tilt
                ctx.drawImage(planeImg, -pSize/2, -pSize/2, pSize, pSize);
                ctx.restore();
            }
        }

        // --- SOCKET EVENTS ---
        socket.on('balance_update', d => {
            document.getElementById('balance').innerText = d.balance.toLocaleString();
        });

        socket.on('crash_update', d => {
            gameState = d.status;
            
            // UI Updates
            if (gameState === 'WAITING') {
                multDisplay.innerText = "1.00x";
                multDisplay.classList.remove('crashed-text');
                statusDisplay.innerText = `NEXT ROUND: ${Math.ceil(d.time_left)}s`;
                statusDisplay.style.color = '#aaa';
                
                dataPoints = []; // Reset Graph
                ctx.clearRect(0,0,canvas.width,canvas.height);

                if (!isBetting) {
                    actionBtn.innerText = "PLACE BET";
                    actionBtn.disabled = false;
                    actionBtn.className = "btn-green";
                }
            }
            else if (gameState === 'RUNNING') {
                multDisplay.innerText = d.multiplier.toFixed(2) + "x";
                statusDisplay.innerText = "FLYING...";
                statusDisplay.style.color = '#f1c40f';

                // Add Point to Graph
                dataPoints.push(d.multiplier);
                drawGame(d.multiplier, 'RUNNING');

                if (isBetting) {
                    const profit = Math.floor(myBet * d.multiplier);
                    actionBtn.innerText = `CASH OUT ($${profit})`;
                    actionBtn.className = "btn-orange";
                    actionBtn.disabled = false;
                } else {
                    actionBtn.innerText = "GAME IN PROGRESS";
                    actionBtn.className = "btn-wait";
                    actionBtn.disabled = true;
                }
            }
            else if (gameState === 'CRASHED') {
                multDisplay.innerText = "FLEW AWAY";
                multDisplay.classList.add('crashed-text');
                statusDisplay.innerText = `CRASHED @ ${d.multiplier.toFixed(2)}x`;
                statusDisplay.style.color = '#e74c3c';
                
                drawGame(d.multiplier, 'CRASHED');

                if (isBetting) {
                    actionBtn.innerText = "YOU LOST (10x PENALTY)";
                    actionBtn.className = "btn-red";
                    actionBtn.disabled = true;
                    isBetting = false;
                }
            }
        });

        socket.on('bet_ok', d => {
            isBetting = true;
            myBet = d.amount;
            actionBtn.innerText = "BET PLACED";
            actionBtn.className = "btn-wait";
            actionBtn.disabled = true;
        });

        socket.on('cashout_ok', d => {
            isBetting = false;
            actionBtn.innerText = `WON $${d.win}`;
            actionBtn.className = "btn-green";
            actionBtn.disabled = true;
        });

        // --- BUTTON LOGIC ---
        function adjustBet(amount) {
            const el = document.getElementById('bet-amount');
            let current = parseInt(el.value);
            if (current + amount >= 100) {
                el.value = current + amount;
            }
        }

        function handleAction() {
            const val = document.getElementById('bet-amount').value;
            if (gameState === 'WAITING' && !isBetting) {
                socket.emit('crash_bet', { amount: val });
            } else if (gameState === 'RUNNING' && isBetting) {
                socket.emit('crash_cashout');
            }
        }
    </script>
</body>
</html>
