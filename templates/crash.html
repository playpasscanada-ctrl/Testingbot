<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Elite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE --- */
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: manipulation; /* Prevent zoom on mobile taps */
        }

        /* --- PREMIUM ANIMATED BACKGROUND (Moving Stars) --- */
        .star-field {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 0;
        }
        .stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            box-shadow: 
                10vw 10vh #fff, 20vw 80vh #fff, 40vw 40vh #fff, 
                60vw 90vh #fff, 80vw 20vh #fff, 90vw 60vh #fff,
                15vw 50vh #aaa, 35vw 85vh #aaa, 55vw 15vh #aaa, 
                75vw 55vh #aaa, 95vw 95vh #aaa;
            animation: spaceFly 10s linear infinite;
            opacity: 0.6;
        }
        .stars::after {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            box-shadow: 
                5vw 5vh #fff, 25vw 75vh #fff, 45vw 35vh #fff, 
                65vw 85vh #fff, 85vw 15vh #fff, 
                10vw 40vh #888, 30vw 80vh #888, 50vw 10vh #888;
            animation: spaceFly 15s linear infinite; /* Slower layer */
            opacity: 0.4;
        }
        
        @keyframes spaceFly {
            from { transform: translateY(0); }
            to { transform: translateY(100vh); }
        }

        /* --- UI LAYOUT --- */
        .app-container {
            position: relative; z-index: 10;
            height: 100%; display: flex; flex-direction: column;
        }

        /* TOP BAR */
        .top-bar {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            border-bottom: 1px solid #333;
        }
        .logo { color: #e74c3c; font-size: 1.4rem; font-weight: 900; font-style: italic; }
        .balance-box {
            background: #111; padding: 5px 15px; border-radius: 20px; border: 1px solid #444;
            font-family: 'Chakra Petch', sans-serif; font-size: 1.1rem; color: #2ecc71;
        }

        /* GAME AREA (CANVAS) */
        .game-stage {
            flex: 1; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { width: 100%; height: 100%; }

        /* MULTIPLIER (Center) */
        .mult-display {
            position: absolute; font-family: 'Chakra Petch', sans-serif;
            font-size: 4rem; font-weight: 700; color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .status-msg {
            position: absolute; top: 20%;
            background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 10px;
            font-size: 0.9rem; color: #aaa; letter-spacing: 1px;
            border: 1px solid #333;
        }

        /* CONTROLS (Bottom) */
        .controls {
            background: #161616; border-top: 2px solid #e74c3c;
            padding: 20px; padding-bottom: 30px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        }

        /* INPUT ROW */
        .input-group {
            display: flex; gap: 10px; background: #000;
            padding: 5px; border-radius: 10px; border: 1px solid #333;
        }
        .qty-btn {
            width: 50px; height: 50px; background: #222; border: none; color: white;
            font-size: 1.5rem; border-radius: 8px; cursor: pointer;
        }
        .qty-btn:active { background: #333; }
        
        .bet-input {
            flex: 1; background: transparent; border: none; color: white;
            text-align: center; font-size: 1.5rem; font-family: 'Chakra Petch';
            outline: none; font-weight: bold;
        }
        /* Remove arrows from input */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* ACTION BUTTONS */
        .action-btn {
            width: 100%; height: 70px; border-radius: 10px; border: none;
            font-family: 'Oswald', sans-serif; font-size: 1.8rem; letter-spacing: 1px;
            color: white; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s;
            display: none; /* Hidden by default, JS controls visibility */
        }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }

        #btn-bet { 
            background: linear-gradient(180deg, #2ecc71, #27ae60); 
            display: block; /* Default visible */
        }
        #btn-cashout { 
            background: linear-gradient(180deg, #f1c40f, #d35400); 
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            border: 2px solid #f39c12;
        }
        #btn-wait {
            background: #333; color: #777; cursor: not-allowed;
        }

        /* CRASH EFFECT */
        .crashed { color: #e74c3c !important; animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform:translateX(0);} 25% {transform:translateX(-5px);} 75% {transform:translateX(5px);} }

    </style>
</head>
<body>

    <div class="star-field">
        <div class="stars"></div>
    </div>

    <div class="app-container">
        
        <div class="top-bar">
            <div class="logo">AVIATOR</div>
            <div class="balance-box">$<span id="balance">---</span></div>
        </div>

        <div class="game-stage" id="stage">
            <canvas id="gameCanvas"></canvas>
            <div class="status-msg" id="status-text">WAITING FOR NEXT ROUND</div>
            <div class="mult-display" id="mult-num">1.00x</div>
        </div>

        <div class="controls">
            
            <div class="input-group">
                <button class="qty-btn" onclick="adjBet(-100)">-</button>
                <input type="number" id="bet-amt" class="bet-input" value="1000" placeholder="Amount">
                <button class="qty-btn" onclick="adjBet(100)">+</button>
            </div>

            <button id="btn-bet" class="action-btn" onclick="placeBet()">
                PLACE BET
            </button>

            <button id="btn-cashout" class="action-btn" onclick="doCashout()">
                CASH OUT
            </button>
            
            <button id="btn-wait" class="action-btn" disabled>
                WAITING...
            </button>

        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');

        // Elements
        const elMult = document.getElementById('mult-num');
        const elStatus = document.getElementById('status-text');
        const inpBet = document.getElementById('bet-amt');

        // Buttons
        const btnBet = document.getElementById('btn-bet');
        const btnCash = document.getElementById('btn-cashout');
        const btnWait = document.getElementById('btn-wait');

        // Game State
        let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED
        let myBet = 0;          // Amount bet
        let isPlaying = false;  // Currently flying with a bet?
        let nextRoundBet = false; // Bet placed for UPCOMING round?
        let points = [];        // Graph data

        // Plane Image
        const plane = new Image();
        plane.src = "https://i.ibb.co/3r5MvK8/plane-red.png";

        // Resize Canvas
        function resize() {
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- BUTTON LOGIC (Show/Hide) ---
        function updateUI() {
            // Hide all first
            btnBet.style.display = 'none';
            btnCash.style.display = 'none';
            btnWait.style.display = 'none';

            if (gameState === 'IDLE') {
                // Plane hasn't started
                if (nextRoundBet) {
                    btnWait.style.display = 'block';
                    btnWait.innerText = "BET PLACED (" + inpBet.value + ")";
                    btnWait.style.border = "1px solid #e74c3c"; // Red border to show active
                    btnWait.style.color = "#fff";
                } else {
                    btnBet.style.display = 'block';
                    btnBet.innerText = "START / PLACE BET";
                }
            } 
            else if (gameState === 'RUNNING') {
                // Plane flying
                if (isPlaying) {
                    // You are in the game!
                    btnCash.style.display = 'block';
                    const curr = parseFloat(elMult.innerText);
                    const win = (myBet * curr).toFixed(0);
                    btnCash.innerText = `CASH OUT ($${win})`;
                } else {
                    // You are watching
                    if(nextRoundBet) {
                        btnWait.style.display = 'block';
                        btnWait.innerText = "BET PLACED FOR NEXT";
                    } else {
                        btnBet.style.display = 'block';
                        btnBet.innerText = "BET FOR NEXT ROUND";
                        btnBet.style.background = "#333"; // Darker to show it's for next
                    }
                }
            } 
            else {
                // Crashed
                btnWait.style.display = 'block';
                btnWait.innerText = "CRASHED";
            }
        }

        // --- DRAWING ENGINE ---
        function render(mult) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            if (gameState !== 'RUNNING' && gameState !== 'CRASHED') return;
            if (points.length < 1) return;

            // Scale logic
            const maxTime = Math.max(points.length, 200);
            const maxVal = Math.max(mult * 1.2, 2);

            ctx.beginPath();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#e74c3c';
            ctx.lineCap = 'round';

            let px = 0, py = h;

            for (let i = 0; i < points.length; i++) {
                const x = (i / maxTime) * w;
                // Y goes from bottom (h) to top (0)
                const yVal = (points[i] - 1) / (maxVal - 1);
                const y = h - (yVal * h * 0.8) - 20;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                px = x; py = y;
            }
            ctx.stroke();

            // Fill
            ctx.lineTo(px, h);
            ctx.lineTo(0, h);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fill();

            // Draw Plane
            if (gameState === 'RUNNING') {
                const pSize = 50;
                ctx.save();
                ctx.translate(px, py);
                ctx.drawImage(plane, -pSize/2, -pSize/2, pSize, pSize);
                ctx.restore();
            }
        }

        // --- ACTIONS ---
        function adjBet(v) {
            let val = parseInt(inpBet.value) || 0;
            if (val + v >= 100) inpBet.value = val + v;
        }

        function placeBet() {
            const amt = parseInt(inpBet.value);
            if (amt < 100) { alert("Min bet is 100"); return; }

            // Decide intent based on state
            if (gameState === 'IDLE') {
                // Immediate join
                isPlaying = true; // Client prediction
                nextRoundBet = false;
                socket.emit('crash_bet', {amount: amt});
            } else {
                // Queue for next
                nextRoundBet = true;
                socket.emit('crash_bet', {amount: amt}); // Server handles queue logic
            }
            updateUI();
        }

        function doCashout() {
            if(!isPlaying) return;
            socket.emit('crash_cashout');
            isPlaying = false; // Client side stop
            updateUI();
        }

        // --- SOCKET HANDLERS ---
        socket.on('balance_update', d => {
            document.getElementById('balance').innerText = d.balance.toLocaleString();
        });

        socket.on('bet_ok', d => {
            // Confirmation from server
            myBet = d.amount;
            if(gameState === 'IDLE') isPlaying = true;
            else nextRoundBet = true;
            updateUI();
        });

        socket.on('cashout_ok', d => {
            isPlaying = false;
            // Visual feedback
            const winBox = document.createElement('div');
            winBox.innerText = `+$${d.win}`;
            winBox.style.cssText = "position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); background:#2ecc71; color:white; font-size:2rem; padding:10px 20px; border-radius:10px; z-index:100; animation: fadeUp 2s forwards;";
            document.body.appendChild(winBox);
            setTimeout(() => winBox.remove(), 2000);
            updateUI();
        });

        socket.on('crash_update', d => {
            gameState = d.status;

            if (d.status === 'WAITING') {
                gameState = 'IDLE';
                points = [];
                ctx.clearRect(0,0,canvas.width, canvas.height);
                elMult.innerText = "1.00x";
                elMult.classList.remove('crashed');
                elStatus.innerText = `NEXT ROUND IN ${Math.ceil(d.time_left)}s`;
                elStatus.style.color = "#3498db";
                
                // If we queued a bet, now we are playing
                if (nextRoundBet) {
                    isPlaying = true;
                    nextRoundBet = false;
                } else {
                    isPlaying = false;
                }
            } 
            else if (d.status === 'RUNNING') {
                points.push(d.multiplier);
                elMult.innerText = d.multiplier.toFixed(2) + "x";
                elStatus.innerText = "FLYING...";
                elStatus.style.color = "#f1c40f";
                render(d.multiplier);
            } 
            else if (d.status === 'CRASHED') {
                elMult.innerText = d.multiplier.toFixed(2) + "x";
                elMult.classList.add('crashed');
                elStatus.innerText = "PLANE FLEW AWAY";
                elStatus.style.color = "#e74c3c";
                render(d.multiplier);
                
                // Reset flags
                isPlaying = false;
            }
            updateUI();
        });

        // CSS Animation for win popup
        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeUp { 0% {opacity:1; transform:translate(-50%,-50%);} 100% {opacity:0; transform:translate(-50%,-100%);} }`;
        document.head.appendChild(style);

    </script>
</body>
</html>
