<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Elite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #000; 
            color: white; 
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* --- BACKGROUND LAYER (Runway & Sky) --- */
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 100%, #1a1a2e 0%, #000000 100%);
            z-index: 0;
        }
        
        /* Grid Effect (Simulates Speed) */
        .grid-lines {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* --- GAME CANVAS --- */
        #game-wrapper {
            position: relative;
            width: 100%;
            height: 65vh; /* Graph area */
            z-index: 10;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- CENTER HUD (The Big Multiplier) --- */
        .hud-container {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .big-multiplier {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transition: color 0.2s;
        }
        .status-pill {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            backdrop-filter: blur(4px);
        }

        /* --- CONTROL PANEL (Bottom) --- */
        .control-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 35vh;
            background: #141414;
            border-top: 2px solid #222;
            padding: 15px 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 30;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }

        /* Bet Controls */
        .bet-row {
            display: flex; gap: 10px; align-items: center; justify-content: center;
            background: #0a0a0a; border-radius: 15px; padding: 5px;
            border: 1px solid #333;
        }
        .btn-circle {
            width: 45px; height: 45px; border-radius: 12px;
            background: #252525; border: none; color: white; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .btn-circle:active { transform: scale(0.9); }
        .bet-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: white; font-size: 1.5rem; text-align: center; font-weight: bold;
            font-family: 'Chakra Petch', sans-serif;
        }

        /* MAIN BUTTON (The Hero) */
        #main-btn {
            width: 100%; height: 80px;
            border-radius: 15px;
            border: none;
            font-size: 1.6rem; font-weight: 900;
            text-transform: uppercase;
            color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            transition: all 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            line-height: 1.1;
        }
        #main-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .sub-text { font-size: 0.9rem; font-weight: 500; opacity: 0.9; }

        /* Button Colors */
        .btn-green { background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-orange { background: linear-gradient(180deg, #f1c40f 0%, #d35400 100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); border: 2px solid #f39c12; }
        .btn-red { background: linear-gradient(180deg, #c0392b 0%, #8e44ad 100%); opacity: 0.8; }
        .btn-disabled { background: #333; color: #777; cursor: not-allowed; }

        /* --- TOP BAR --- */
        .top-nav {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }
        .logo { color: #e74c3c; font-weight: 900; font-size: 1.2rem; font-style: italic; letter-spacing: -1px; }
        .balance-pill {
            background: #111; padding: 5px 15px; border-radius: 30px; border: 1px solid #333;
            font-family: 'Chakra Petch', sans-serif;
        }

        /* --- CRASH ANIMATION --- */
        .crashed-effect { color: #e74c3c !important; animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }

    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="grid-lines"></div>
    </div>

    <div class="top-nav">
        <div class="logo">AVIATOR <span class="text-white not-italic">PRO</span></div>
        <div class="balance-pill">
            <span class="text-gray-500 text-xs mr-1">USD</span>
            <span class="text-green-400 font-bold text-lg" id="balance">---</span>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud-container">
            <div id="status-badge" class="status-pill">LOADING SERVER...</div>
            <div id="multiplier" class="big-multiplier">1.00x</div>
        </div>
    </div>

    <div class="control-panel">
        
        <div class="bet-row">
            <button class="btn-circle" onclick="adjBet(-100)">-</button>
            <input type="number" id="bet-amt" value="1000" class="bet-input" readonly>
            <button class="btn-circle" onclick="adjBet(100)">+</button>
        </div>

        <div class="text-center">
            <span id="game-tip" class="text-xs text-gray-500 font-mono">WAIT FOR NEXT ROUND TO START</span>
        </div>

        <button id="main-btn" class="btn-disabled" onclick="handleBtnAction()" disabled>
            <span>PLACE BET</span>
        </button>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const elMult = document.getElementById('multiplier');
        const elStatus = document.getElementById('status-badge');
        const elBtn = document.getElementById('main-btn');
        const elTip = document.getElementById('game-tip');

        // State
        let gameState = 'CONNECTING';
        let myBet = 0;
        let isBetting = false; // Is the user *in* the current round?
        let hasBetNext = false; // Did user bet for the *upcoming* round?
        let dataPoints = [];
        
        // --- ASSETS ---
        // Red Aviator Plane Image
        const planeImg = new Image();
        planeImg.src = "https://i.ibb.co/3r5MvK8/plane-red.png"; 

        // --- RESIZE ---
        function resize() {
            canvas.width = document.getElementById('game-wrapper').clientWidth;
            canvas.height = document.getElementById('game-wrapper').clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- VISUAL ENGINE ---
        function draw(currentMult, status) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // 1. Dynamic Scaling (Camera Zoom Out)
            // As multiplier grows, the Y-axis max value increases so the plane stays in view
            // As time (points) grows, X-axis scales
            const maxX = Math.max(dataPoints.length, 150); 
            const maxY = Math.max(currentMult * 1.3, 2.0); 

            if(dataPoints.length < 2) return;

            // 2. Draw Curve (Smooth)
            ctx.beginPath();
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#e74c3c'; // Aviator Red

            let px = 0, py = h;

            for(let i=0; i<dataPoints.length; i++) {
                // Normalize Coordinates
                const x = (i / maxX) * w;
                // Y logic: 1.00x is at Bottom (h), MaxY is at Top (0)
                const val = dataPoints[i];
                const normalizedY = (val - 1) / (maxY - 1); 
                const y = h - (normalizedY * h * 0.9) - 20; // 0.9 keeps it from hitting exact top

                if(i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y); // Straight lines are faster/cleaner for crash graphs

                px = x; py = y;
            }
            ctx.stroke();

            // 3. Fill Area (Gradient)
            ctx.lineTo(px, h);
            ctx.lineTo(0, h);
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(231, 76, 60, 0.4)');
            grad.addColorStop(1, 'rgba(231, 76, 60, 0.0)');
            ctx.fillStyle = grad;
            ctx.fill();

            // 4. DRAW PLANE (Rotated)
            if(status === 'RUNNING') {
                const size = 60;
                ctx.save();
                ctx.translate(px, py);
                
                // Calculate Angle based on slope
                // Simple tilt logic: Steep at start, flattens slightly
                let angle = -Math.atan((h*0.5) / (w*0.5)); 
                if (dataPoints.length > 50) angle = -0.3; // Steady cruise angle
                
                ctx.rotate(angle);
                ctx.drawImage(planeImg, -size/2, -size/2, size, size);
                
                // Rocket Trail Effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#f39c12";
                ctx.restore();
            }
        }

        // --- BUTTON STATES ---
        function updateButton() {
            // SCENARIO 1: WAITING PHASE
            if (gameState === 'WAITING') {
                if (hasBetNext) {
                    // User already clicked Bet for this round
                    elBtn.className = "btn-red";
                    elBtn.innerHTML = `<span>CANCEL BET</span><span class='sub-text'>$${document.getElementById('bet-amt').value}</span>`;
                    elBtn.disabled = false;
                } else {
                    // User needs to bet
                    elBtn.className = "btn-green";
                    elBtn.innerHTML = `<span>BET</span><span class='sub-text'>NEXT ROUND</span>`;
                    elBtn.disabled = false;
                }
            } 
            // SCENARIO 2: PLANE IS FLYING
            else if (gameState === 'RUNNING') {
                if (isBetting) {
                    // User is in the game -> SHOW CASH OUT
                    const currentM = parseFloat(elMult.innerText);
                    const profit = (myBet * currentM).toFixed(0);
                    
                    elBtn.className = "btn-orange";
                    elBtn.innerHTML = `<span>CASH OUT</span><span class='sub-text'>WIN $${profit}</span>`;
                    elBtn.disabled = false;
                } else {
                    // User is watching (didn't bet) -> Bet for NEXT round
                    if (hasBetNext) {
                        elBtn.className = "btn-red";
                        elBtn.innerHTML = `<span>WAITING...</span><span class='sub-text'>BET PLACED</span>`;
                        elBtn.disabled = true;
                    } else {
                        elBtn.className = "btn-green";
                        elBtn.innerHTML = `<span>BET</span><span class='sub-text'>FOR NEXT ROUND</span>`;
                        elBtn.disabled = false;
                    }
                }
            }
            // SCENARIO 3: CRASHED
            else {
                elBtn.className = "btn-disabled";
                elBtn.innerHTML = `<span>CRASHED</span>`;
                elBtn.disabled = true;
            }
        }

        // --- SOCKET LISTENERS ---
        socket.on('balance_update', d => {
            document.getElementById('balance').innerText = d.balance.toLocaleString();
        });

        socket.on('crash_update', d => {
            gameState = d.status;

            if (gameState === 'WAITING') {
                elMult.innerText = "1.00x";
                elMult.style.color = "white";
                elMult.classList.remove('crashed-effect');
                
                elStatus.innerText = `PREPARING PLANE: ${Math.ceil(d.time_left)}s`;
                elStatus.style.color = "#3498db";
                
                dataPoints = []; 
                ctx.clearRect(0,0,canvas.width,canvas.height);
                
                // If round resets, 'isBetting' becomes false for everyone
                // 'hasBetNext' stays true if they queued a bet
                if(isBetting) isBetting = false; 
                
                // Auto-bet logic execution (Mock)
                if(hasBetNext && !isBetting) {
                    // Logic handled in 'bet_ok'
                }
            }
            else if (gameState === 'RUNNING') {
                const m = d.multiplier.toFixed(2);
                elMult.innerText = m + "x";
                elStatus.innerText = "FLYING";
                elStatus.style.color = "#f1c40f";

                dataPoints.push(d.multiplier);
                draw(d.multiplier, 'RUNNING');
            }
            else if (gameState === 'CRASHED') {
                elMult.innerText = d.multiplier.toFixed(2) + "x";
                elMult.classList.add('crashed-effect');
                elMult.style.color = "#e74c3c";
                
                elStatus.innerText = "PLANE FLEW AWAY";
                elStatus.style.color = "#e74c3c";
                
                draw(d.multiplier, 'CRASHED');
                
                // Reset betting flags for lost users
                if(isBetting) {
                    isBetting = false;
                    // Logic for loss handled by server balance update
                }
                hasBetNext = false; // Reset queue
            }
            updateButton();
        });

        socket.on('bet_ok', d => {
            if(gameState === 'WAITING') {
                isBetting = true; // In the game now
                hasBetNext = false;
            } else {
                hasBetNext = true; // Queued for next
            }
            myBet = d.amount;
            updateButton();
        });

        socket.on('cashout_ok', d => {
            isBetting = false;
            elBtn.className = "btn-green";
            elBtn.innerHTML = `<span>WON $${d.win}</span>`;
            elBtn.disabled = true;
            setTimeout(updateButton, 2000);
        });

        // --- ACTIONS ---
        function adjBet(val) {
            const el = document.getElementById('bet-amt');
            let v = parseInt(el.value) + val;
            if(v >= 100) el.value = v;
        }

        function handleBtnAction() {
            const amt = document.getElementById('bet-amt').value;

            if (gameState === 'WAITING') {
                if(hasBetNext) {
                    // Cancel logic (optional, for now just reset flag locally)
                    hasBetNext = false; updateButton();
                } else {
                    socket.emit('crash_bet', {amount: amt});
                }
            }
            else if (gameState === 'RUNNING') {
                if (isBetting) {
                    socket.emit('crash_cashout');
                } else {
                    // Place bet for NEXT round
                    if(!hasBetNext) {
                        hasBetNext = true;
                        // Technically we should tell server, but for UI feedback:
                        updateButton();
                        // Send bet when round restarts or send now and server queues it
                        // For this simple version, we assume user clicks again or we hold intent
                        socket.emit('crash_bet', {amount: amt}); 
                    }
                }
            }
        }
    </script>
</body>
</html>
