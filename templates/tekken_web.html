<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tekken 3 Arena</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        #game-wrapper {
            position: relative; width: 100%; height: 75vh;
            border-bottom: 3px solid gold; background: #000;
        }
        #game-holder { width: 100%; height: 100%; }

        /* Loader Overlay */
        #custom-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999;
        }
        .spinner {
            border: 5px solid #333; border-top: 5px solid #00ff00; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header-bet {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background: #222; font-size: 14px;
        }
        .btn-win { 
            width: 90%; padding: 15px; font-size: 22px; border: none; cursor: pointer; 
            border-radius: 12px; background: linear-gradient(45deg, #00ff00, #00cc00); font-weight: bold; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header-bet">
        <span style="color:cyan">👤 {{ match.p1_name }}</span>
        <span style="color:gold;">💰 ${{ "{:,}".format(match.amount) }}</span>
        <span style="color:orange">{{ match.p2_name }} 👤</span>
    </div>

    <div id="game-wrapper">
        <div id="custom-loader">
            <div class="spinner"></div>
            <div style="color:#00ff00; font-weight:bold;">DOWNLOADING GAME DATA...</div>
            <div style="color:#aaa; font-size:12px;">(Connecting to Dropbox...)</div>
            <div style="color:orange; margin-top:5px; font-size:11px;">Please Wait & Don't Close</div>
        </div>

        <div id="game-holder"></div>
        
        <script>
            EJS_player = '#game-holder';
            EJS_core = 'psx'; 
            EJS_gameName = "Tekken 3";
            EJS_biosUrl = 'https://archive.org/download/psx_bios_scph1001/scph1001.bin'; 
            
            // ✅ YOUR FIXED DROPBOX LINK
            // Maine 'www.dropbox.com' ko 'dl.dropboxusercontent.com' kar diya hai
            EJS_gameUrl = 'https://dl.dropboxusercontent.com/scl/fi/e76utc45hw2cpswr05qch/tekken_3.zip?rlkey=oq9d34t8deisfe25y6wsp5l1f&st=no5efd5u'; 
            
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_startOnLoaded = true;
            EJS_CONFIG = { mobileControls: true };
            EJS_netplayUrl = "wss://netplay.emulatorjs.org"; 
            
            // Game start hone par loader hatt jayega
            EJS_onGameStart = function() {
                document.getElementById('custom-loader').style.display = 'none';
            };
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </div>

    <div style="padding:15px; background:#1a1a1a;">
        <input type="text" id="uid" placeholder="Discord ID" style="padding:10px; width:90%;">
        <button class="btn-win" onclick="claimWin()">🏆 I WON</button>
    </div>

    <script>
        async function claimWin() {
            const uid = document.getElementById('uid').value;
            if(!uid) return alert("ID Required");
            fetch('/api/tekken_web/report', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ match_id: "{{ match_id }}", winner_id: uid })
            }).then(r=>r.json()).then(d=>alert(d.msg));
        }
    </script>
</body>
</html>
