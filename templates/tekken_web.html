<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tekken 3 Arena</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Game Container Wrapper */
        #game-wrapper {
            position: relative;
            width: 100%;
            height: 75vh;
            border-bottom: 3px solid gold;
            background: #000;
        }

        #game-holder {
            width: 100%;
            height: 100%;
        }

        /* 🔥 LOADING OVERLAY STYLE */
        #custom-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); /* Thoda transparent black */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999; /* Game ke upar dikhega */
        }

        .spinner {
            border: 5px solid #333;
            border-top: 5px solid #00ff00; /* Neon Green */
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-text {
            color: #00ff00; font-size: 18px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .sub-text { color: #aaa; font-size: 12px; margin-top: 5px; }

        .header-bet {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background: linear-gradient(to bottom, #222, #111);
            font-size: 14px;
        }

        .controls-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; }
        .btn-win { 
            width: 90%; padding: 15px; font-size: 22px; border: none; cursor: pointer; 
            border-radius: 12px; font-weight: bold; margin-top: 15px;
            background: linear-gradient(45deg, #00ff00, #00cc00); color: black;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-bet">
        <span style="color:cyan">👤 {{ match.p1_name }}</span>
        <span style="color:gold; font-weight:900;">💰 ${{ "{:,}".format(match.amount) }}</span>
        <span style="color:orange">{{ match.p2_name }} 👤</span>
    </div>

    <div id="game-wrapper">
        
        <div id="custom-loader">
            <div class="spinner"></div>
            <div class="loading-text">Downloading Game Data...</div>
            <div class="sub-text">Size: 450 MB (Takes 3-5 Mins)</div>
            <div class="sub-text" style="color:orange; margin-top:10px;">Please do not close this page</div>
        </div>

        <div id="game-holder"></div>
        
        <script>
            EJS_player = '#game-holder';
            EJS_core = 'psx'; 
            EJS_gameName = "Tekken 3";
            EJS_biosUrl = 'https://archive.org/download/psx_bios_scph1001/scph1001.bin'; 
            
            // ✅ ORIGINAL LINK
            EJS_gameUrl = 'https://archive.org/download/Tekken3_201905/Tekken3.zip'; 
            
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_startOnLoaded = true;
            EJS_CONFIG = { mobileControls: true };
            EJS_netplayUrl = "wss://netplay.emulatorjs.org"; 
            
            // 🔥 JADU: Jab Game Start Hoga, Loader Gayab Ho Jayega
            EJS_onGameStart = function() {
                document.getElementById('custom-loader').style.display = 'none';
                console.log("Game Started! Loader Hidden.");
            };
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </div>

    <div class="controls-area">
        <div style="color:#aaa; font-size:12px; margin-bottom:10px;">
            <b>Instructions:</b><br>
            1. Wait for loading to finish.<br>
            2. Player 1: Menu > Netplay > Create Room.<br>
            3. Player 2: Menu > Netplay > Join Room.<br>
        </div>
        
        <input type="text" id="uid" placeholder="Enter Your Discord ID" style="padding:12px; width:90%; border-radius:8px; border:1px solid #444; background:#333; color:white; text-align:center;">
        <br>
        <button class="btn-win" onclick="claimWin()">🏆 I WON THE MATCH</button>
    </div>

    <script>
        async function claimWin() {
            const uid = document.getElementById('uid').value;
            if(!uid) return alert("⚠️ Enter Discord ID first!");
            if(!confirm("Sure you won? Fake claims = Ban.")) return;

            const res = await fetch('/api/tekken_web/report', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ match_id: "{{ match_id }}", winner_id: uid })
            });
            const data = await res.json();
            alert(data.msg);
            if(data.status === 'success') window.close();
        }
    </script>
</body>
</html>
