<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tekken 3 Arena</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        #game-holder {
            width: 100%;
            height: 75vh;
            background: #000;
            border-bottom: 3px solid gold;
            position: relative;
        }

        /* Loading Text Style */
        #loader-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffd700; font-size: 18px; font-weight: bold;
            animation: blink 1s infinite; pointer-events: none; z-index: 0;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        .header-bet {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background: linear-gradient(to bottom, #222, #111);
            font-size: 14px;
        }

        .controls-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; }
        .btn-win { 
            width: 90%; padding: 15px; font-size: 22px; border: none; cursor: pointer; 
            border-radius: 12px; font-weight: bold; margin-top: 15px;
            background: linear-gradient(45deg, #00ff00, #00cc00); color: black;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-bet">
        <span style="color:cyan">👤 {{ match.p1_name }}</span>
        <span style="color:gold; font-weight:900;">💰 ${{ "{:,}".format(match.amount) }}</span>
        <span style="color:orange">{{ match.p2_name }} 👤</span>
    </div>

    <div id="game-holder">
        <div id="loader-msg">Downloading Tekken 3...<br>(Wait 2-3 mins)<br>Please stay on this page.</div>
        
        <script>
            EJS_player = '#game-holder';
            EJS_core = 'psx'; 
            EJS_gameName = "Tekken 3";
            
            // ✅ NEW: BIOS ADDED (Black screen fix)
            EJS_biosUrl = 'https://archive.org/download/psx_bios_scph1001/scph1001.bin'; 
            
            // ✅ GAME LINK (USA Version)
            EJS_gameUrl = 'https://archive.org/download/Tekken3_201905/Tekken3.zip'; 
            
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_startOnLoaded = true;
            EJS_CONFIG = { mobileControls: true }; // Controls On
            EJS_netplayUrl = "wss://netplay.emulatorjs.org"; 
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </div>

    <div class="controls-area">
        <div style="color:#aaa; font-size:12px; margin-bottom:10px;">
            <b>Instructions:</b><br>
            • Wait for "Sony" logo (Downloading 450MB).<br>
            • Use <b>Netplay</b> in menu to connect with friend.<br>
        </div>
        
        <input type="text" id="uid" placeholder="Enter Your Discord ID" style="padding:12px; width:90%; border-radius:8px; border:1px solid #444; background:#333; color:white; text-align:center;">
        <br>
        <button class="btn-win" onclick="claimWin()">🏆 I WON THE MATCH</button>
    </div>

    <script>
        async function claimWin() {
            const uid = document.getElementById('uid').value;
            if(!uid) return alert("⚠️ Enter Discord ID first!");
            if(!confirm("Sure you won? Fake claims = Ban.")) return;

            const res = await fetch('/api/tekken_web/report', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ match_id: "{{ match_id }}", winner_id: uid })
            });
            const data = await res.json();
            alert(data.msg);
            if(data.status === 'success') window.close();
        }
    </script>
</body>
</html>
