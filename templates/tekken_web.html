<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tekken 3 Mobile Arena</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        /* GAME CONTAINER - Full Width on Mobile */
        #game-holder {
            width: 100%;
            height: 75vh; /* Screen ka 75% height */
            background: #000;
            border-bottom: 3px solid gold;
        }

        /* --- 📱 PRO MOBILE CONTROLS CSS --- */
        /* Controller Container */
        .ejs--touch-controls {
            opacity: 0.6 !important; /* थोड़े पारदर्शी ताकि गेम दिखे */
            z-index: 999 !important;
        }

        /* D-PAD & Buttons Style */
        .ejs--dpad-button, .ejs--controller-button {
            background: rgba(50, 50, 50, 0.8) !important;
            border: 2px solid rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 0 10px rgba(0,0,0,0.5) !important;
        }
        
        /* PlayStation Button Colors */
        .ejs--button-triangle { color: #00ff00 !important; } /* Green */
        .ejs--button-circle { color: #ff3300 !important; }   /* Red */
        .ejs--button-cross { color: #0099ff !important; }    /* Blue */
        .ejs--button-square { color: #ff66cc !important; }   /* Pink */

        /* Start/Select Buttons */
        .ejs--button-start, .ejs--button-select {
            border-radius: 20px !important;
            font-size: 12px !important;
            background: rgba(0,0,0,0.8) !important;
        }
        /* ---------------------------------- */

        .header-bet {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background: linear-gradient(to bottom, #222, #111);
            font-size: 14px;
        }

        .controls-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; }
        .btn-win { 
            width: 90%; padding: 15px; font-size: 22px; border: none; cursor: pointer; 
            border-radius: 12px; font-weight: bold; margin-top: 15px;
            background: linear-gradient(45deg, #00ff00, #00cc00); color: black;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .info { color: #aaa; font-size: 12px; margin-bottom: 10px; text-align: left; display: inline-block; }
    </style>
</head>
<body>

    <div class="header-bet">
        <span style="color:cyan">👤 {{ match.p1_name }}</span>
        <span style="color:gold; font-weight:900;">💰 ${{ "{:,}".format(match.amount) }}</span>
        <span style="color:orange">{{ match.p2_name }} 👤</span>
    </div>

    <div id="game-holder">
        <script>
            EJS_player = '#game-holder';
            EJS_core = 'psx'; 
            EJS_gameName = "Tekken 3";
            EJS_biosUrl = ''; 
            
            // ✅ 100% WORKING DIRECT LINK (USA Version)
            EJS_gameUrl = 'https://archive.org/download/Tekken3_201905/Tekken3.zip'; 
            
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_startOnLoaded = true;
            // Mobile controls on by default
            EJS_CONFIG = { mobile controls: true };
            EJS_netplayUrl = "wss://netplay.emulatorjs.org"; 
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </div>

    <div class="controls-area">
        <div class="info">
            Start Menu > <b>Netplay</b> (Multiplayer)<br>
            • Player 1: Create Room & Send Code.<br>
            • Player 2: Join Room & Enter Code.<br>
        </div>
        
        <input type="text" id="uid" placeholder="Enter Your Discord ID to Claim" style="padding:12px; width:90%; border-radius:8px; border:1px solid #444; background:#333; color:white; text-align:center;">
        <br>
        <button class="btn-win" onclick="claimWin()">🏆 I WON THE MATCH</button>
    </div>

    <script>
        // Fullscreen on touch (Optional fix for address bar)
        document.addEventListener('touchstart', function() {
             if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                 // document.documentElement.requestFullscreen(); // Uncomment if you want forced fullscreen
             }
        }, {once: true});

        async function claimWin() {
            const uid = document.getElementById('uid').value;
            if(!uid) return alert("⚠️ Please enter your Discord ID first!");
            
            if(!confirm("Are you sure you won? Lying will result in a ban.")) return;

            const res = await fetch('/api/tekken_web/report', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    match_id: "{{ match_id }}",
                    winner_id: uid
                })
            });
            
            const data = await res.json();
            alert(data.msg);
            if(data.status === 'success') window.close();
        }
    </script>
</body>
</html>
