<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Rewards</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE SETTINGS --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --dark-bg: #050505;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: white; font-family: 'Share Tech Mono', monospace;
            overflow: hidden; height: 100vh; width: 100vw;
        }

        /* --- ANIMATED BACKGROUND --- */
        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            pointer-events: none; z-index: 0;
        }
        
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000 80%);
            z-index: 1; pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* --- HUD HEADER (FIXED) --- */
        .hud-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            height: 70px; padding: 0 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(10px); z-index: 50;
        }
        
        .user-pill {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 243, 255, 0.1); padding: 5px 10px;
            border: 1px solid var(--neon-blue); border-radius: 30px;
        }
        .u-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; }
        .u-name { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #fff; letter-spacing: 1px; }
        
        .bal-display {
            font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* --- MAIN STAGE --- */
        .stage {
            position: relative; z-index: 10;
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* --- QR CARD --- */
        .qr-wrapper {
            position: relative; padding: 4px;
            background: linear-gradient(180deg, var(--neon-blue), var(--neon-pink));
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.4);
            animation: float 4s ease-in-out infinite;
        }
        
        .qr-inner {
            background: #000; padding: 20px; border-radius: 18px;
            width: 280px; height: 280px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Scanner Line */
        .scanner-beam {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink);
            animation: scan 2s linear infinite; z-index: 20;
        }

        .status-text {
            margin-top: 30px; text-align: center;
        }
        .status-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: #fff;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .status-sub {
            color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 5px;
        }

        /* Animations */
        @keyframes scan { 0% {top: 10px; opacity:0;} 50% {opacity:1;} 100% {top: 270px; opacity:0;} }
        @keyframes float { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="particles"></div>

    <div class="hud-bar">
        <div class="user-pill">
            <img src="{{ user.avatar_url }}" class="u-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="u-name">{{ user.username }}</div>
        </div>
        <div class="bal-display">
            $ {{ "{:,}".format(balance) }}
        </div>
    </div>

    <div class="stage">
        
        <div class="qr-wrapper">
            <div class="qr-inner" id="qrcode-container">
                <div class="scanner-beam"></div>
            </div>
        </div>

        <div class="status-text">
            <div class="status-title">Scan to Claim</div>
            <div class="status-sub">
                SECURE CONNECTION ESTABLISHED <br>
                <span style="color:var(--neon-pink)">JACKPOT CHANCE: 0.01%</span>
            </div>
        </div>

    </div>

    <script>
        // Server URL
        const scanUrl = "{{ scan_url }}"; 
        
        // Generate QR
        new QRCode(document.getElementById("qrcode-container"), {
            text: scanUrl,
            width: 240,
            height: 240,
            colorDark : "#ffffff", // Inverted for Dark Mode
            colorLight : "#000000",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 3D Tilt Effect on Mouse Move
        const card = document.querySelector('.qr-wrapper');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
