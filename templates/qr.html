<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Rewards // ULTRA</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE VARIABLES & RESET --- */
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #bc13fe;
            --neon-gold: #ffd700;
            --void-bg: #020205;
            --glass: rgba(255, 255, 255, 0.03);
            --border-glow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }
        
        * { box-sizing: border-box; user-select: none; cursor: none; /* Hide default cursor */ }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--void-bg);
            color: white; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            perspective: 1000px;
        }

        /* --- 2. BACKGROUND LAYERS --- */
        #starCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        /* CRT Scanline Overlay (Retro Hacker Feel) */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 99; pointer-events: none; opacity: 0.6;
        }
        
        /* Vignette (Dark Corners) */
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, black 150%);
            z-index: 98; pointer-events: none;
        }

        /* --- 3. CUSTOM CURSOR & TRAIL --- */
        #cursor {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1000;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.2s, height 0.2s;
            mix-blend-mode: difference;
        }
        
        .trail-dot {
            position: fixed; width: 6px; height: 6px; background: var(--neon-pink);
            border-radius: 50%; pointer-events: none; z-index: 999;
            box-shadow: 0 0 10px var(--neon-pink);
            animation: fadeTrail 0.8s linear forwards;
        }

        @keyframes fadeTrail {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* --- 4. HUD HEADER --- */
        .hud-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 50;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .user-chip {
            display: flex; align-items: center; gap: 15px;
            padding: 8px 20px; background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--neon-cyan); border-radius: 4px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }
        
        .u-avatar { width: 40px; height: 40px; border: 2px solid white; border-radius: 4px; }
        .u-info h3 { margin: 0; font-family: 'Orbitron'; font-size: 14px; letter-spacing: 1px; color: white; }
        .u-info span { font-size: 10px; color: var(--neon-cyan); text-transform: uppercase; }

        .bal-display {
            font-family: 'Share Tech Mono'; font-size: 24px; color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold);
            border-bottom: 2px solid var(--neon-gold); padding-bottom: 5px;
        }

        /* --- 5. MAIN STAGE (3D SCENE) --- */
        .stage {
            height: 100vh; width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; z-index: 10;
        }

        /* The Holographic Card */
        .holo-card {
            position: relative; width: 340px; height: 420px;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
        }

        /* Tech Corners (Brackets) */
        .corner {
            position: absolute; width: 30px; height: 30px;
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: all 0.3s;
        }
        .tl { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .tr { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .bl { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .br { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        .holo-card:hover .corner { width: 40px; height: 40px; box-shadow: 0 0 20px var(--neon-pink); border-color: var(--neon-pink); }

        /* QR Container */
        .qr-box {
            background: white; padding: 15px; border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            position: relative; overflow: hidden;
            transform: translateZ(50px); /* Popping out in 3D */
        }

        /* Laser Scanner */
        .laser-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            animation: scanAnim 2.5s ease-in-out infinite;
            z-index: 20; opacity: 0.8;
        }

        @keyframes scanAnim {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Text Styles */
        .scan-title {
            margin-top: 40px; font-family: 'Orbitron'; font-weight: 900; font-size: 28px;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 4px;
            transform: translateZ(30px);
        }
        
        .scan-sub {
            font-family: 'Share Tech Mono'; color: rgba(255,255,255,0.6);
            font-size: 14px; margin-top: 10px; text-align: center;
            transform: translateZ(20px);
        }
        
        .glitch-text { animation: glitch 3s infinite; }
        
        @keyframes glitch {
            0% { text-shadow: 0 0 0 transparent; }
            2% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan); }
            4% { text-shadow: 0 0 0 transparent; }
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 600px) {
            .hud-bar { padding: 0 15px; height: 60px; }
            .u-info, .bal-display span { display: none; }
            .holo-card { width: 90%; height: 380px; }
        }

    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>
    
    <div class="scanlines"></div>
    <div class="vignette"></div>
    
    <div id="cursor"></div>

    <div class="hud-bar">
        <div class="user-chip">
            <img src="{{ user.avatar_url }}" class="u-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="u-info">
                <span>OPERATOR</span>
                <h3>{{ user.username }}</h3>
            </div>
        </div>
        <div class="bal-display">
            ${{ "{:,}".format(balance) }}
        </div>
    </div>

    <div class="stage">
        
        <div class="holo-card" id="tiltCard">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="qr-box" id="qrcode-container">
                <div class="laser-line"></div>
            </div>

            <div class="scan-title glitch-text">SCAN TARGET</div>
            <div class="scan-sub">
                [ ENCRYPTED CONNECTION ]<br>
                <span style="color:var(--neon-gold)">JACKPOT: 0.01% PROBABILITY</span>
            </div>
        </div>

    </div>

    <script>
        // --- 1. QR GENERATION ---
        const scanUrl = "{{ scan_url }}"; 
        new QRCode(document.getElementById("qrcode-container"), {
            text: scanUrl,
            width: 220,
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // --- 2. PREMIUM CURSOR TRAIL ---
        const cursor = document.getElementById('cursor');
        
        document.addEventListener('mousemove', (e) => {
            // Move Cursor Ring
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            // Create Trail Particle
            const dot = document.createElement('div');
            dot.classList.add('trail-dot');
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            
            // Random Size Variation
            const size = Math.random() * 5 + 2;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            
            // Add to body and remove after animation
            document.body.appendChild(dot);
            setTimeout(() => { dot.remove(); }, 800);
        });

        // --- 3. 3D TILT EFFECT (SMOOTH) ---
        const card = document.getElementById('tiltCard');
        const container = document.querySelector('.stage');

        container.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset on leave
        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'all 0.5s ease';
        });
        container.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // --- 4. CANVAS PARTICLE SYSTEM (GOD LEVEL BG) ---
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        let particles = [];
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2;
                this.speedY = Math.random() * 1 + 0.2; // Falling down like matrix/snow
                this.color = Math.random() > 0.8 ? '#bc13fe' : '#00f3ff'; // Neon Pink or Cyan
                this.opacity = Math.random();
            }
            update() {
                this.y += this.speedY;
                if (this.y > h) {
                    this.y = 0;
                    this.x = Math.random() * w;
                }
                // Twinkle effect
                this.opacity += Math.random() * 0.02 - 0.01;
                if(this.opacity < 0) this.opacity = 0;
                if(this.opacity > 1) this.opacity = 1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create 150 particles
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // Draw semi-transparent background for trail effect in canvas
            ctx.fillStyle = 'rgba(2, 2, 5, 0.2)'; 
            ctx.fillRect(0, 0, w, h);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
