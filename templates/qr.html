<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum QR Reward</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE VISUALS --- */
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(10,10,10,1) 100%);
            color: white; font-family: 'Rajdhani', sans-serif;
            overflow: hidden; height: 100vh; cursor: none; /* Hide default cursor */
        }

        /* --- 2. CUSTOM CURSOR & TRAIL --- */
        .cursor-dot, .cursor-dot-outline {
            position: fixed; top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: #0ff; }
        .cursor-dot-outline { width: 40px; height: 40px; border: 1px solid rgba(0, 255, 255, 0.5); transition: width 0.2s, height 0.2s; }
        
        /* The Trail Particles */
        .trail {
            position: absolute; width: 6px; height: 6px;
            background: #0ff; border-radius: 50%;
            pointer-events: none; opacity: 0.7;
            animation: fadeOut 1s linear forwards;
        }
        @keyframes fadeOut { to { opacity: 0; transform: scale(0); } }

        /* --- 3. HUD HEADER --- */
        .hud-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 10;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .p-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #0ff; box-shadow: 0 0 15px #0ff; }
        .p-name { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px #0ff; }
        .p-bal { 
            background: linear-gradient(90deg, #11998e, #38ef7d); 
            padding: 5px 20px; border-radius: 4px; font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.4);
        }

        /* --- 4. QR CONTAINER --- */
        .main-stage {
            height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            position: relative;
        }

        .qr-frame {
            position: relative; padding: 5px;
            background: linear-gradient(45deg, #0ff, #f0f, #0ff);
            background-size: 400% 400%;
            animation: borderGlow 3s ease infinite;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }
        
        .qr-box {
            background: #fff; padding: 20px; border-radius: 15px;
            width: 300px; height: 300px; display: flex; 
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* Scanning Line Animation */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: #f0f; box-shadow: 0 0 15px #f0f;
            animation: scanMove 2s linear infinite;
            z-index: 5;
        }

        .instruction {
            margin-top: 30px; font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem; letter-spacing: 2px;
            color: rgba(255,255,255,0.7); text-transform: uppercase;
            text-align: center;
        }
        .instruction span { color: #f0f; animation: blink 1s infinite; }

        @keyframes borderGlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes scanMove { 0% {top:0;} 50% {top:100%;} 100% {top:0;} }
        @keyframes blink { 50% {opacity: 0.5;} }

    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-dot-outline" id="cursor-outline"></div>

    <div class="hud-header">
        <div class="player-info">
            <img src="{{ user.avatar_url }}" class="p-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div>
                <div class="text-xs text-cyan-400">OPERATOR</div>
                <div class="p-name">{{ user.username }}</div>
            </div>
        </div>
        <div class="p-bal">
            ${{ "{:,}".format(balance) }}
        </div>
    </div>

    <div class="main-stage">
        
        <div class="qr-frame">
            <div class="qr-box" id="qrcode">
                <div class="scan-line"></div>
            </div>
        </div>

        <div class="instruction">
            Scan to Claim <br> <span>[ REWARD PROTOCOL ACTIVE ]</span>
        </div>

        <div class="absolute bottom-10 text-gray-500 text-xs font-mono">
            SECURE_LINK: {{ scan_url }} <br>
            CHANCE_RATE: 0.01% LEGENDARY
        </div>

    </div>

    <script>
        // --- 1. QR GENERATION ---
        // Server se jo link aaya hai, uska QR banao
        const scanUrl = "{{ scan_url }}"; 
        
        new QRCode(document.getElementById("qrcode"), {
            text: scanUrl,
            width: 260,
            height: 260,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // --- 2. CURSOR & TRAIL EFFECT ---
        const cursorDot = document.getElementById("cursor-dot");
        const cursorOutline = document.getElementById("cursor-outline");

        window.addEventListener("mousemove", function(e) {
            const posX = e.clientX;
            const posY = e.clientY;

            // Move custom cursor
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            // Delayed follow for outline
            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });

            // Create Trail Particle
            createTrail(posX, posY);
        });

        function createTrail(x, y) {
            const trail = document.createElement("div");
            trail.className = "trail";
            trail.style.left = `${x}px`;
            trail.style.top = `${y}px`;
            
            // Randomize color slightly (Cyan to Purple)
            const colors = ['#0ff', '#00bcd4', '#e040fb', '#f0f'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            trail.style.background = randomColor;

            document.body.appendChild(trail);

            // Remove from DOM after animation
            setTimeout(() => {
                trail.remove();
            }, 1000);
        }

    </script>
</body>
</html>
